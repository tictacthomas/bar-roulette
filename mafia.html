<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: smoky speakeasy party game, playful but menacing
   IDEA: a 1920s noir card table: each phone is a dealt card
   PICTURE: moonlit city skyline over the title; the action list is the working picture in play
   COLOUR and TYPE: wine-black night with blood red, sunrise peach by day; Limelight + Inter
   LAYOUT: one phone column, guide controls in dashed cards below each player's own action */
:root{--bg:#140a10;--ink:#f4e8e0;--mut:#bba5a8;--pan:#22131b;--line:#3d2632;--acc:#e3343e;--ok:#3cb8a4;color-scheme:dark}
body.day{--bg:#f7dcc0;--ink:#2b141a;--mut:#7a5a55;--pan:#fff3e6;--line:#e6c09e;--acc:#c41f2b;--ok:#167a6b;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;transition:background .6s,color .6s;min-height:100vh}
.wrap{max-width:540px;margin:0 auto;padding:12px 16px 110px;position:relative}
.homelink{position:absolute;top:14px;left:16px;z-index:2;color:#f4e8e0;font:600 14px/1 Inter,sans-serif;text-decoration:none;background:rgba(20,10,16,.6);padding:9px 13px;border-radius:999px}
.homelink:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:auto;margin:0;z-index:8;border-radius:999px;padding:14px 20px;min-height:52px;background:var(--acc);border-color:var(--acc);color:#fff;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
h1,h2,.disp{font-family:Limelight,Georgia,serif;font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(48px,14vw,68px);letter-spacing:.03em;margin-top:-8px}
h2{font-size:32px;margin:4px 0 10px}
p{margin:.45em 0}
.mut{color:var(--mut);font-size:14px}
.hero{position:relative;height:220px;margin:-12px -16px 0;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
button{font:600 16px/1.2 Inter,sans-serif;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--ink);padding:12px 16px;cursor:pointer;width:100%;margin-top:8px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.big{min-height:60px;font-size:19px}
button:disabled{opacity:.4;cursor:default}
button.link{background:none;border:none;color:var(--mut);text-decoration:underline;min-height:44px;width:auto;padding:8px 4px;margin:0}
input{font:16px Inter,sans-serif;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--pan);color:var(--ink);padding:12px 14px;margin:6px 0 14px}
label{font-weight:600;font-size:14px}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px;color:var(--mut);padding:2px 0 8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#8a7a7c;display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}
.card{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.role{border:2px solid var(--acc);text-align:center;padding:22px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.role .disp{font-size:40px;color:var(--acc);margin:4px 0 8px}
.list{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;margin:0;gap:10px}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--pan);padding:6px 6px 6px 14px;font-weight:600}
.wrow.pr{border-color:var(--ok)}.wrow.kl{border-color:var(--acc)}
.wbtn{display:flex;gap:6px;flex-shrink:0}.wbtn button{width:auto;margin:0;min-height:44px;padding:8px 14px;font-size:15px}
.wbtn button.on{background:var(--ok);border-color:var(--ok);color:#fff}.wbtn button.kill.on{background:var(--acc);border-color:var(--acc)}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt small{color:var(--mut);font-weight:400;white-space:nowrap}
.dead{text-decoration:line-through;opacity:.55}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;min-height:44px;padding:0;font-size:20px;margin:0}
.step b{min-width:24px;padding:0 4px;text-align:center;white-space:nowrap}
.guide{border-style:dashed;border-width:2px}
.say{font-style:italic;font-size:17px}
.pop{position:fixed;inset:0;z-index:20;background:rgba(10,4,8,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.pop .card{max-width:440px;width:100%;background:var(--pan)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}
.code{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:48px;letter-spacing:.14em;color:var(--acc);line-height:1.1}
.win{text-align:center;padding:20px 8px}
.win .disp{font-size:44px;color:var(--acc)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut);font-style:normal;font-weight:600}
.err{color:var(--acc);font-weight:600}
details{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
dl{margin:0}dt{font-weight:700;margin-top:10px}dd{margin:0;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.list.pick{grid-template-columns:repeat(2,minmax(0,1fr))}
.list.pick .opt{min-height:56px;padding:10px 12px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.list.pick .opt small{white-space:normal}
.list.pick .wrow{flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.list.pick .wbtn{flex-wrap:wrap}.list.pick .wbtn button{flex:1;padding:8px 6px}
</style>
</head>
<body>
<div class="wrap" id="app"><h1>Mafia</h1><p>Loading…</p></div>

{

  seer:{n:"Seer",d:"Each night, choose one person and learn their exact role."},

  witch:{n:"Witch Doctor",d:"Each night, protect one person like the Healer. Once per game you can also use your poison to kill someone."},
  hunter:{n:"Hunter",d:"If the town votes you out during the day, you take one person down with you."},
  fool:{n:"Fool",d:"You win if the Mafia win, but you don't know who they are. Get the town to vote out the wrong people."},

/* ---------- game helpers ---------- */
const role=i=>G&&G.ro&&G.ro[i]?G.ro[i][0]:null;
const shown=i=>G&&G.ro&&G.ro[i]?G.ro[i][1]:null;
const alive=()=>G.pl.filter(p=>p.a).map(p=>p.i);
const isAlive=i=>G.pl.some(p=>p.i===i&&p.a);
const nm=i=>i==='-'?'Skip (no one)':((G.pl||[]).concat(G.lob||[]).find(p=>p.i===i)||{}).n||'Someone';
const mine=()=>G&&G.pl?G.pl.find(p=>p.i===me.i):null;
const act=i=>{const s=acts[i];return s&&s.act&&s.act.rd===G.rd?s.act:null};
const vote=i=>{const s=acts[i];return s&&s.vote&&s.vote.rd===G.rd?s.vote:null};
const partner=i=>G.lv&&G.lv.includes(i)?(G.lv[0]===i?G.lv[1]:G.lv[0]):null;
function kill(i){const p=G.pl.find(p=>p.i===i);if(!p||!p.a)return;p.a=0;
  const o=partner(i);if(o&&isAlive(o)){G.hb=(G.hb||[]).concat(o);kill(o)}}
const team=i=>role(i)==='mafia'||role(i)==='fool'?'m':'v';
const NERFABLE=['mafia','healer','seer','detective','witch','hunter','cupid','shuffler'];
const NERF_DEF=()=>({});
/* Nerf mode: true when this player's power fails this time */
/* global chance for every role, unless that role has its own level (10-50%) */
const ownLvl=(o,k)=>{const v=(o.nr||{})[k];return typeof v==='number'?v:null};
const nfPct=(o,k)=>{if(!o||!o.nf||!NERFABLE.includes(k))return 0;const v=ownLvl(o,k);return v!==null?v:(o.ng||0)};
const fails=i=>{const p=nfPct(G,role(i));return !!(p&&Math.random()*100<p)};
const allDone=()=>G.tot>0&&G.done>=G.tot;
function suggest(n){return{mafia:Math.max(1,Math.floor(n/4)),seer:n>=4?1:0,healer:n>=5?1:0,hunter:n>=6?1:0,detective:n>=7?1:0,witch:n>=8?1:0,fool:n>=9?1:0,cupid:n>=10?1:0,shuffler:n>=11?1:0,drunk:n>=12?1:0}}
const setup=()=>G.setup||suggest(G.lob.length);
const maxMafia=n=>Math.max(1,Math.floor((n-1)/2));
function rng(n){const r=G.rng||[1,Math.max(1,Math.round(n/3.5))],mx=Math.min(maxMafia(n),Math.max(1,r[1]));return[Math.min(Math.max(1,r[0]),mx),mx]}
const spRange=n=>{const mx=Math.min(maxMafia(n),Math.max(1,Math.ceil(n/3.5)));return[Math.min(mx,Math.max(1,Math.floor(n/5))),mx]};
const poolOn=()=>SPECIAL.filter(r=>!G.pool||G.pool[r]!==0);
/* deal a balanced random deck: try many line-ups, keep the fair ones, pick one at random */
function gen(n,mode,mn,mx,pool){
  const ok=[];let best=null,bs=1e9;
  for(let t=0;t<600;t++){
    const m=mn+(Math.random()*(mx-mn+1)|0),slots=n-m,sp=shuf(pool.slice());
    const k=mode==='sp'?slots:(Math.random()*(Math.min(sp.length,slots)+1)|0);
    const d=Array(m).fill('mafia');
    for(let j=0;j<slots;j++)d.push(j<k?(j<sp.length?sp[j]:pick(['healer','hunter','detective','seer'])):'peasant');
    const s=Math.abs(d.reduce((a,r)=>a+W[r],0));
    if(s<=2)ok.push(d);if(s<bs){bs=s;best=d}
  }
  return ok.length?pick(ok):best;
}
function compText(){
  if(!G.mode||G.mode==='std'){const c={};Object.values(G.ro).forEach(r=>c[r[0]]=(c[r[0]]||0)+1);
    return 'Roles in this game: '+ORDER.concat('peasant').filter(k=>c[k]).map(k=>(c[k]>1?c[k]+' × ':'')+R[k].n).join(', ')+'.'}
  return `Mafia: somewhere between ${G.info[0]} and ${G.info[1]}. `+(G.mode==='sp'?'Everyone has a power; the line-up is secret.':'The other roles in play are secret.');
}
function top(c){let m=0,t=[];for(const k in c){if(c[k]>m){m=c[k];t=[k]}else if(c[k]===m)t.push(k)}return t}

/* ---------- host logic ---------- */
function hostTick(){
  if(!G)return;
  players[me.i]=st;
  for(const k in players){const s=players[k];if(s&&s.i)acts[s.i]=s}
  const g=G;
  if(g.ph==='lobby'){g.lob=Object.values(players).filter(s=>s&&s.n).map(s=>({i:s.i,n:String(s.n).slice(0,16)}))}
  else if(g.ph==='night'){
    const al=alive(),mafs=al.filter(i=>role(i)==='mafia');let d=0;
    g.mp={};g.mc={};g.ms={};g.agp=null;g.cb=null;
    mafs.forEach(i=>{const s=acts[i],a=act(i);if(s&&s.mp&&s.mp.rd===g.rd&&s.mp.t&&isAlive(s.mp.t))g.ms[i]={t:s.mp.t,at:s.mp.at||0};
      const t=(g.ms[i]&&g.ms[i].t)||(a&&a.t);if(t)g.mp[i]=t;if(a&&a.t)g.mc[i]=1});
    if(mafs.length===1){const a=act(mafs[0]);g.ag=a&&a.t?a.t:null}
    else{/* everyone has suggested or agreed to the same person, then one of them confirms */
      const tg=mafs.map(i=>g.ms[i]&&g.ms[i].t);
      g.agp=mafs.length&&tg.every(x=>x)&&new Set(tg).size===1?tg[0]:null;
      const cb=g.agp?mafs.find(i=>act(i)&&act(i).t===g.agp):null;
      g.ag=cb?g.agp:null;g.cb=cb||null;
    }
    if(g.ag)d+=mafs.length;
    al.forEach(i=>{const a=act(i);if(!a||role(i)==='mafia')return;d++;
      const sh=shown(i);
      if((sh==='seer'||sh==='detective')&&a.t&&a.t!=='-'&&!(g.sr[i]&&g.sr[i].rd===g.rd)){
        const real=role(i)===sh;let r;const fl=real&&fails(i);
        if(sh==='seer')r=real?role(a.t):pick(Object.keys(R).filter(r=>r!=='drunk'));
        else r=real?(role(a.t)==='mafia'?'M':'N'):pick(['M','N']);
        if(fl)r='X';g.sr[i]={rd:g.rd,n:g.dn+1,t:a.t,r};
      }});
    g.tot=al.length;g.done=g.to?al.length:d;
  }
  else if(g.ph==='day'){const al=alive();g.done=al.filter(i=>vote(i)).length;g.tot=al.length}
  else if(g.ph==='hunter'){
    const s=acts[g.hp];
    if(s&&s.shot&&s.shot.rd===g.rd&&s.shot.t&&(s.shot.t==='-'||isAlive(s.shot.t))){const no=s.shot.t==='-',fl=!no&&fails(g.hp);if(!no&&!fl)kill(s.shot.t);g.shot={h:g.hp,t:no||fl?null:s.shot.t,f:fl?1:0,aim:fl?s.shot.t:null};g.ph='dusk';g.rd=rid();checkWin()}
  }
  if(!ui.practice){sv('mf_G',G);sv('mf_acts',acts)}
  sendNet();botsTick();
}
function startGame(){
  const lob=G.lob,n=lob.length,mode=G.mode||'std';let deck=[];
  if(n<4)return toast('You need at least 4 players.');
  if(mode==='std'){const c=setup();
    if(!c.mafia)return toast('You need at least one Mafia.');
    ORDER.forEach(k=>{for(let j=0;j<(c[k]||0);j++)deck.push(k)});
    if(deck.length>n)return toast('More special roles than players.');
    while(deck.length<n)deck.push('peasant');G.setup=c;
  }else{
    G.info=mode==='sp'?spRange(n):rng(n);
    const pool=mode==='sp'?SPECIAL:poolOn();
    deck=gen(n,mode,G.info[0],G.info[1],pool);
  }
  shuf(deck);
  G.gid=rid();G.lv=null;G.hb=[];G.pl=lob.map(p=>({i:p.i,n:p.n,a:1}));G.ro={};
  G.pl.forEach((p,k)=>{const r=deck[k];G.ro[p.i]=[r,r==='drunk'?pick(DRUNK_AS):r]});
  Object.assign(G,{pu:{},su:{},sr:{},msg:{},dead:[],out:null,shot:null,win:null,dn:0,last:null});
  toNight();
}
function toNight(){G.ph='night';G.rd=rid();G.mp={};G.mc={};G.ag=null;G.to=0;G.t0=G.hnow=Date.now();G.done=0;G.tot=alive().length}
function resolveNight(){
  const g=G,al=alive(),dead=new Set(),healed=new Set(),picks={};
  g.msg={};g.hb=[];
  const say=(p,m)=>{(g.msg[p]=g.msg[p]||[]).push(m)};
  if(g.dn===0)al.forEach(i=>{const a=act(i);if(a&&a.lv&&shown(i)==='cupid'&&role(i)==='cupid'&&!g.lv){
    if(fails(i)){say(i,'Your arrow missed (Nerf mode). No one fell in love.');return}
    const [x,y]=a.lv;if(x&&y&&x!==y&&isAlive(x)&&isAlive(y)){g.lv=[x,y];
      say(x,`Cupid's arrow struck! You are in love with ${nm(y)}. If they die, you die of a broken heart.`);
      say(y,`Cupid's arrow struck! You are in love with ${nm(x)}. If they die, you die of a broken heart.`)}}});
  al.forEach(i=>{const t=role(i)==='mafia'&&g.mp&&g.mp[i];if(t&&isAlive(t))picks[t]=(picks[t]||0)+1});
  al.forEach(i=>{const a=act(i);if(!a)return;
    if((role(i)==='healer'||role(i)==='witch')&&a.t){if(fails(i))say(i,'Your protection failed last night (Nerf mode).');else healed.add(a.t)}});
  const t=top(picks);let target=t.length?pick(t):null;
  const mf=al.filter(i=>role(i)==='mafia');
  if(target&&mf.length&&fails(mf[0])){target=null;mf.forEach(i=>say(i,'Your kill failed last night (Nerf mode). No one was attacked.'))}
  if(target&&!healed.has(target))dead.add(target);
  al.forEach(i=>{const a=act(i);if(a&&a.k&&shown(i)==='witch'&&!g.pu[i]){g.pu[i]=1;if(role(i)==='witch'&&isAlive(a.k)){if(fails(i))say(i,'Your poison failed (Nerf mode). It is used up.');else dead.add(a.k)}}});
  al.forEach(i=>{const a=act(i);if(a&&a.sw&&shown(i)==='shuffler'&&!g.su[i]){g.su[i]=1;
    const [x,y]=a.sw;
    if(role(i)==='shuffler'&&x&&y&&x!==y&&fails(i)){say(i,'Your shuffle failed (Nerf mode). It is used up.')}
    else if(role(i)==='shuffler'&&x&&y&&x!==y&&isAlive(x)&&isAlive(y)&&!dead.has(x)&&!dead.has(y)){
      [g.ro[x],g.ro[y]]=[g.ro[y],g.ro[x]];
      [g.pu[x],g.pu[y]]=[g.pu[y]||0,g.pu[x]||0];[g.su[x],g.su[y]]=[g.su[y]||0,g.su[x]||0];
      [x,y].forEach(p=>say(p,`While you slept, your role card was swapped. You are now the ${R[g.ro[p][1]].n}.`));
    }}});
  dead.forEach(kill);
  g.dead=[...dead];g.out=null;g.shot=null;g.last='night';g.dn++;g.ph='morning';g.rd=rid();
  checkWin();
}
function resolveVote(){
  const c={},vb={},nv=[];alive().forEach(i=>{const v=vote(i);if(v&&v.t){c[v.t]=(c[v.t]||0)+1;(vb[v.t]=vb[v.t]||[]).push(i)}else nv.push(i)});
  const t=top(c),out=t.length===1&&t[0]!=='-'?t[0]:null;
  G.out={p:out,c,vb,nv};G.shot=null;G.last='day';G.hb=[];
  if(out){kill(out);if(role(out)==='hunter'){G.ph='hunter';G.hp=out;G.rd=rid();return}}
  G.ph='dusk';G.rd=rid();checkWin();
}
function checkWin(){
  const al=alive(),m=al.filter(i=>role(i)==='mafia').length;
  if(G.lv&&al.length===2&&al.includes(G.lv[0])&&al.includes(G.lv[1])&&team(G.lv[0])!==team(G.lv[1]))G.win='l';
  else if(m===0)G.win='v';else if(al.every(i=>role(i)==='mafia'||role(i)==='fool'))G.win='m';
  if(G.win)G.ph='over';
}

const BOTS=['Ava','Ben','Cleo','Dev','Eli','Fern','Gus','Hana','Ivan','Jade','Kai','Lu','Moe','Nia'];
let botRd='';
function botMafia(){
  if(!ui.practice||!G||G.ph!=='night'||G.ag)return;
  const mafs=alive().filter(i=>role(i)==='mafia'),bots=mafs.filter(i=>i.startsWith('bot'));
  if(!bots.length||mafs.length<2)return;
  const key=G.rd+JSON.stringify(G.ms||{})+G.agp;if(ui.bmk===key)return;ui.bmk=key;const rd=G.rd;
  setTimeout(()=>{if(!G||G.rd!==rd||G.ag)return;
    const ms=G.ms||{};let L=null;for(const k in ms)if(!L||ms[k].at>L.at)L={by:k,t:ms[k].t,at:ms[k].at};
    const put=(b,o)=>{players[b]=Object.assign({},players[b],o)};
    if(!L){const t=pick(alive().filter(i=>role(i)!=='mafia'));put(bots[0],{mp:{rd,t,at:Date.now()}})}
    else bots.forEach(b=>{if(!ms[b]||ms[b].t!==L.t)put(b,{mp:{rd,t:L.t,at:L.at},act:null})});
    hostTick();
    if(G.agp&&!G.ag&&!mafs.includes(me.i)){put(bots[0],{act:{rd,t:G.agp}});hostTick()}
    onGame();render();
  },1800);
}
function botsTick(){
  botMafia();
  if(!ui.practice||!G||G.rd===botRd)return;botRd=G.rd;const rd=G.rd;
  const bots=Object.keys(players).filter(k=>k.startsWith('bot'));
  const later=fn=>setTimeout(()=>{if(G&&G.rd===rd){fn();hostTick();onGame();render()}},800+Math.random()*3200);
  const oth=i=>alive().filter(x=>x!==i);
  const put=(b,o)=>{players[b]=Object.assign({},players[b],o)};
  if(G.ph==='night')bots.filter(isAlive).forEach(b=>later(()=>{
    const s=shown(b),o=oth(b),A=alive(),x={rd};
    if(s==='mafia'&&alive().filter(i=>role(i)==='mafia').length>1)return;
    if(s==='mafia'){const t=A.filter(i=>role(i)!=='mafia'),tp=[G.mp&&G.mp[me.i]].concat(Object.keys(G.mp||{}).filter(k=>k!==b).map(k=>G.mp[k])).filter(v=>v&&isAlive(v));x.t=tp.length?tp[0]:pick(t.length?t:o);put(b,{mp:{rd,t:x.t}})}
    else if(s==='healer')x.t=pick(A);
    else if(s==='witch'){x.t=pick(A);if(!G.pu[b]&&Math.random()<.25)x.k=pick(o)}
    else if(s==='cupid'&&G.dn===0){x.t='-';x.lv=shuf(A.slice()).slice(0,2)}
    else if(s==='shuffler'&&!G.su[b]){x.t='-';if(Math.random()<.35)x.sw=shuf(A.slice()).slice(0,2)}
    else x.t=pick(o);
    put(b,{act:x})}));
  else if(G.ph==='day')bots.filter(isAlive).forEach(b=>later(()=>{
    const t=ui.voteMe&&isAlive(me.i)?me.i:(Math.random()<.15?'-':pick(oth(b)));put(b,{vote:{rd,t}})}));
  else if(G.ph==='hunter'&&G.hp.startsWith('bot'))later(()=>put(G.hp,{shot:{rd,t:pick(alive())}}));
}

/* ---------- network ---------- */
function sendNet(){
  if(!net)return;
  const s=JSON.stringify([st,me.host?G:0]);
  if(s===lastSent)return;lastSent=s;net.send();
}
function push(){if(!ui.practice)sv('mf_st',st);if(me.host)hostTick();else sendNet();onGame();render()}
function onNet(map,g){
  if(me.host){if(map)players=map;hostTick()}
  else if(g){G=g}
  onGame();render();
}
function onGame(){
  if(!G)return;
  if(!me.host&&!ui.practice&&G.kk&&G.kk.includes(me.i)&&me.code){try{sessionStorage.setItem('mf_kicked',G.code||me.code)}catch(e){}leave();return}
  if(!me.host&&G.hnow&&G.hnow!==lastH){lastH=G.hnow;off=G.hnow-Date.now()}
  if(G.rd!==lastRd){lastRd=G.rd;ui.ptOpen=false;ui.showRole=false;ui.comp=false;ui.t=ui.k=ui.v=null;ui.cf=null;ui.sw=[];ui.lv=[];ui.kill=false;ui.sure=''}
  if(G.gid){
    notes=ld('mf_n_'+G.gid,[]);
    const s=G.sr&&G.sr[me.i];
    if(s&&!notes.some(n=>n.rd===s.rd)){notes.push({rd:s.rd,n:s.n,name:nm(s.t),r:s.r});sv('mf_n_'+G.gid,notes)}
  }
  
}

async function connect(){
  setTimeout(()=>{if(!conn&&!G)fail("Still can't reach the game. Check the code, and that the guide's phone has this page open.")},15000);
  let room=null;
  if(window.claude&&typeof window.claude.use==='function'){try{room=await window.claude.use('room')}catch(e){}}
  if(room){
    try{const r=await room.join('mafia-'+me.code.toLowerCase());net=roomNet(r);sendNet();return}catch(e){}

}
function roomNet(r){
  const n={send(){r.presence(me.host?{s:st,g:G}:{s:st,g:null}).catch(()=>{})}};
  r.onPeers(ch=>{const map={};let g=null;
    ch.peers.forEach(p=>{const pr=p.presence||{};if(pr.s&&pr.s.i)map[pr.s.i]=pr.s;if(pr.g&&!p.sameTab)g=pr.g});
    onNet(map,g)});
  r.onConnection(setConn,()=>setConn(false));
  return n;
}
/* ---------- network: two relays + a direct link ----------
   Every message goes three ways at once: through two public relay servers (MQTT over secure
   WebSocket, which works on any Wi-Fi or mobile network, like loading a web page) and over a
   direct PeerJS link when the networks allow one. Whichever copy arrives first counts; messages
   are numbered, so the extra copies are ignored. */
// Four free public relays run by four different organisations. The last two use the normal
// web port (443), so they also get through strict Wi-Fi that blocks the first two.
const RELAYS=(window.MAFIA_RELAYS||[
  {name:'HiveMQ',url:'wss://broker.hivemq.com:8884/mqtt'},
  {name:'EMQX',url:'wss://broker.emqx.io:8084/mqtt'},
  {name:'Eclipse',url:'wss://mqtt.eclipseprojects.io/mqtt'},
  {name:'shiftr.io',url:'wss://public.cloud.shiftr.io/',user:'public',pass:'public'}
]).map(r=>typeof r==='string'?{url:r}:r);
const te8=new TextEncoder(),td8=new TextDecoder();
function cat(a){let n=0;for(const p of a)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of a){o.set(p,k);k+=p.length}return o}
const u16=n=>new Uint8Array([n>>8&255,n&255]);
const mstr=s=>{const b=te8.encode(s);return cat([u16(b.length),b])};
const vlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return new Uint8Array(o)};
const mpkt=(h,b)=>cat([new Uint8Array([h]),vlen(b.length),b]);

/* A small MQTT 3.1.1 client: connect, subscribe, publish (QoS 0, optionally retained),
   a "last will" message, keep-alive, and reconnecting after sleep or network changes. */
function miniMqtt(relay,o){
  const url=relay.url;
  let ws=null,buf=new Uint8Array(0),up=false,timer=null,retry=1500,pid=1,lastRx=0,closed=false;
  const put=b=>{try{if(ws&&ws.readyState===1)ws.send(b)}catch(e){}};
  const connectPkt=()=>mpkt(0x10,cat([mstr('MQTT'),
    new Uint8Array([4,2|(o.will?4|32:0)|(relay.user!=null?128:0)|(relay.pass!=null?64:0)]),u16(30),mstr(o.id),
    ...(o.will?[mstr(o.will),u16(0)]:[]),
    ...(relay.user!=null?[mstr(relay.user)]:[]),...(relay.pass!=null?[mstr(relay.pass)]:[])]));
  function onData(d){
    lastRx=Date.now();
    buf=cat([buf,new Uint8Array(d)]);
    for(;;){
      if(buf.length<2)return;
      let i=1,v=0,m=1,b;
      do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128}while(b&128);
      if(buf.length<i+v)return;
      const h=buf[0],body=buf.slice(i,i+v);buf=buf.slice(i+v);
      const t=h>>4;
      if(t===2){                                   // CONNACK
        if(body[1]!==0){try{ws.close()}catch(e){}return}
        up=true;retry=1500;
        put(mpkt(0x82,cat([u16(pid++),...o.subs.map(s=>cat([mstr(s),new Uint8Array([0])]))])));
        o.onUp();
      }else if(t===3){                             // PUBLISH
        const tl=body[0]<<8|body[1];let k=2+tl;if((h>>1)&3)k+=2;
        o.onMsg(td8.decode(body.subarray(2,2+tl)),td8.decode(body.subarray(k)),(h&1)===1);
      }
    }
  }
  function later(){clearTimeout(timer);timer=setTimeout(open,retry);retry=Math.min(retry*2,15000)}
  function open(){
    clearTimeout(timer);if(closed)return;
    let w;try{w=ws=new WebSocket(url,['mqtt'])}catch(e){ws=null;return later()}
    w.binaryType='arraybuffer';buf=new Uint8Array(0);lastRx=Date.now();
    w.onopen=()=>put(connectPkt());
    w.onmessage=e=>{if(ws===w)onData(e.data)};
    w.onerror=()=>{try{w.close()}catch(e){}};
    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};
    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again
  }
  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep
    if(closed)return clearInterval(iv);
    if(!ws)return;
    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}
    if(up)put(new Uint8Array([0xC0,0]));
  },15000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden||closed)return;
    retry=1500;
    if(!ws)open();
    else if(up&&Date.now()-lastRx>25000){try{ws.close()}catch(e){}}
  });
  open();
  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},
    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};
}

/* ---------- connection test ----------
   For each relay: connect, send a message to ourselves through it and time the round trip.
   For the direct link: check that PeerJS's introduction server answers. */
let netT=null;
function relayTest(relay){return new Promise(res=>{
  const t0=performance.now(),topic='mafianight/v1/test/'+rid(10);let sent=0,done=false,c=null;
  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};
  c=miniMqtt(relay,{id:'mft'+rid(10),subs:[topic],will:null,
    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},
    onMsg(t,m){if(t===topic&&m==='ping')fin({ok:true,conn:sent-t0,rt:performance.now()-sent})}});
  setTimeout(()=>fin({ok:false}),10000);
})}
function peerTest(){return new Promise(res=>{
  if(!window.Peer)return res({ok:false});
  const t0=performance.now();let p=null,done=false;
  const fin=r=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}res(r)};
  try{p=new Peer(window.MAFIA_PEER_OPTS||{})}catch(e){return fin({ok:false})}
  p.on('open',()=>fin({ok:true,conn:performance.now()-t0}));p.on('error',()=>fin({ok:false}));
  setTimeout(()=>fin({ok:false}),10000);
})}
async function runNetTest(){
  if(netT&&netT.busy)return;
  netT={busy:true,r:RELAYS.map(()=>null),p:null};render();
  const jobs=RELAYS.map((u,k)=>relayTest(u).then(x=>{netT.r[k]=x;render()}));
  jobs.push(peerTest().then(x=>{netT.p=x;render()}));
  await Promise.all(jobs);netT.busy=false;render();
}
const secs=ms=>(ms/1000).toFixed(ms<1000?2:1)+' s';
function netV(){
  const t=netT||{busy:true,r:[],p:null};
  const row=(name,x,okText)=>`<div class="row"><span><i class="dot ${x&&x.ok?'on':''}"></i>${name}</span><small class="${x&&!x.ok?'err':'mut'}" style="white-space:nowrap">${!x?'Testing…':x.ok?okText(x):'Not reachable'}</small></div>`;
  const rows=RELAYS.map((u,k)=>row(`Relay ${k+1}${u.name?' ('+u.name+')':''}`,t.r[k],x=>`Works · ${secs(x.rt)}`)).join('')
    +row('Direct link',t.p,x=>'Works');
  const relOk=t.r.filter(x=>x&&x.ok).length;
  let verdict='';
  if(!t.busy){
    verdict=relOk===RELAYS.length?`<p><b>Good to go.</b> This phone can reach all ${RELAYS.length} relays, so it can host or join a game.</p>`
      :relOk>0?`<p><b>Good to go.</b> ${relOk} of ${RELAYS.length} relays work here. One is enough to play.</p>`
      :t.p&&t.p.ok?`<p class="err">None of the relays work on this network.</p><p class="mut">The game can still try the direct link, but that often fails. Try switching this phone to mobile data, or another Wi-Fi.</p>`
      :`<p class="err">This phone can't reach any of the game's servers.</p><p class="mut">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.</p>`;
  }
  return `<button class="link" data-a="home">← Back</button><h2>Connection test</h2>
<p class="mut">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.</p>
<div class="card">${rows}</div>${verdict}
<button class="pri" data-a="nettest"${t.busy?' disabled':''}>${t.busy?'Testing…':'Test again'}</button>`;
}

function mixNet(){
  const base='mafianight/v1/'+me.code.toLowerCase();
  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits
  const PO=window.MAFIA_PEER_OPTS||{};
  const hid='mafia-night-cl-'+me.code.toLowerCase();
  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null;
  const conns=new Set(),relays=[];
  const last={},seen={};                          // newest message number, and when each player was last heard from
  const anyUp=()=>relays.some(r=>r.up())||peerUp;
  let upSince=0;
  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};

  function fromPlayer(src,d,stored){
    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;
    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide
    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent
    if(at>(seen[s.i]||0))seen[s.i]=at;
    if(last[s.i]&&d.q<=last[s.i])return;
    last[s.i]=d.q;
    if(s.bye){if(G&&G.ph==='lobby'&&players[s.i])drop(s.i);return}   // they tapped Leave
    onNet(Object.assign({},players,{[s.i]:s}),null);
  }
  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}

  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes
  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.
  if(me.host){
    let tick=Date.now();
    setInterval(()=>{
      const now=Date.now();
      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging
      tick=now;
      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;
      for(const id in players){
        if(id===me.i)continue;
        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}
      }
    },30e3);
  }
  function fromHost(d){
    if(!d||!d.g||(last.g&&d.q<=last.g))return;
    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay
    last.g=d.q;gotG=true;onNet(null,d.g);status();
  }

  RELAYS.forEach((relay,k)=>{
    const src='r'+k;
    const r=miniMqtt(relay,{
      id:'mf'+rid(12),
      subs:[me.host?base+'/p/+':base+'/g'],
      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true)},
      onDown(){status()},
      onMsg(t,s,stored){
        if(me.host){
          // A brand-new game: anything the relay had stored for this word belongs to an old game. Wipe it.
          if(stored&&freshGame&&Date.now()-freshGame<5000){if(s)r.pub(t,'',true);return}
          if(!s)return;
          try{fromPlayer(src,JSON.parse(s),stored)}catch(e){}
        }else if(s){try{fromHost(JSON.parse(s))}catch(e){}}
      }
    });
    relays.push(r);
  });

  if(window.Peer)try{
    if(me.host){
      let p,wait=2500;
      const start=()=>{
        p=new Peer(hid,PO);
        p.on('open',()=>{wait=2500;peerUp=true;status()});
        p.on('connection',c=>{
          c.on('open',()=>{conns.add(c);if(env)try{c.send(env)}catch(e){}});
          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});
          c.on('close',()=>conns.delete(c));
        });
        p.on('error',e=>{
          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}
            setTimeout(start,wait);wait=Math.min(wait*2,30000)}
        });
        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});
      };
      start();
    }else{
      const p=new Peer(PO);let rt=null,wait=2500;
      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};
      const dial=()=>{
        if(p.destroyed)return;
        if(p.disconnected){try{p.reconnect()}catch(e){}}
        if(pc){try{pc.close()}catch(e){}}
        const cc=pc=p.connect(hid,{reliable:true});
        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);
        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});
        cc.on('data',d=>{if(pc===cc)fromHost(d)});
        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});
      };
      p.on('open',dial);
      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});
    }
  }catch(e){}

  function out(e){
    const t=me.host?base+'/g':myT,s=JSON.stringify(e);
    relays.forEach(r=>r.pub(t,s,true));
    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});
    else if(pc&&pc.open)try{pc.send(e)}catch(x){}
  }
  // "Still here": resend the latest message with a fresh time once a minute while the page is open.
  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.
  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);

  return{
    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},
    bye(){if(me.host)return;env=null;out({q:++Q,t:Date.now(),s:{i:me.i,bye:1}})}   // tapped Leave
  };
}

  if(G.ph==='lobby')return h+lobbyV();
  if(!mine())return h+card('<p>A game is already under way. You\'ll be dealt in when the guide starts the next one.</p>');
  return h+({night:nightV,morning:morningV,day:dayV,hunter:hunterV,dusk:duskV,over:overV}[G.ph]||(()=>''))();
}
function render(){
  document.body.className=G&&ui.scr==='game'&&['morning','day','hunter','dusk'].includes(G.ph)?'day':'';
  const h=ui.scr==='home'?homeV():ui.scr==='join'?joinV():ui.scr==='practice'?practiceV():ui.scr==='nettest'?netV():gameV();
  if(h!==lastHtml){const y=window.scrollY;app.innerHTML=h;lastHtml=h;window.scrollTo(0,y)}
}
function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

function kickPlayer(id){
  if(!me.host||!G||G.ph!=='lobby'||id===me.i)return;
  G.kk=(G.kk||[]).concat(id);
  const m=Object.assign({},players);delete m[id];onNet(m,null);
}
function enter(){st={i:me.i,n:me.n};ui.scr='game';err='';lastSent='';render();connect()}
function leave(){
  const bye=net&&net.bye;if(bye)try{net.bye()}catch(e){}
  me.code='';me.host=false;saveMe();
  setTimeout(()=>{try{location.reload()}catch(e){}},bye?600:0);
}

/* ---------- events ---------- */
app.addEventListener('input',e=>{if(e.target.id==='nm')ui.name=e.target.value;if(e.target.id==='cd')ui.code=e.target.value.toUpperCase().replace(/[^A-Z]/g,'')});
document.addEventListener('pointerdown',unlock);
app.addEventListener('toggle',e=>{if(e.target.id==='pt')ui.ptOpen=e.target.open},true);
app.addEventListener('click',e=>{
  unlock();
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,p=b.dataset.p,r=b.dataset.r,k=b.dataset.k;
  const confirmTwice=key=>{if(!allDone()&&ui.sure!==key){ui.sure=key;render();return false}ui.sure='';return true};
  if(a!=='leave'&&ui.sure==='leave')ui.sure='';
  if(a!=='kick'&&String(ui.sure).startsWith('kick:'))ui.sure='';
  ui.notice='';
  switch(a){
    case 'start':ui.mode='join';ui.scr='join';err='';break;
    case 'hostnew':ui.mode='host';ui.scr='join';err='';break;
    case 'home':ui.scr='home';err='';break;
    case 'create':{const n=(ui.name||'').trim();if(!n){err='Enter your name.';break}
      me.n=n.slice(0,16);me.host=true;me.code=newCode();freshGame=Date.now();saveMe();acts={};players={};
      G={ph:'lobby',code:me.code,setup:null,ng:20,rev:1,lob:[],rd:rid(),dn:0};enter();return}
    case 'join':{const n=(ui.name||'').trim(),c=(ui.code||'').trim();if(!n){err='Enter your name.';break}if(c.length!==4){err='The game code has 4 letters.';break}
      me.n=n.slice(0,16);me.host=false;me.code=c;saveMe();G=null;enter();return}
    case 'practice':ui.scr='practice';err='';break;
    case 'kick':if(ui.sure!=='kick:'+p){ui.sure='kick:'+p;break}ui.sure='';kickPlayer(p);break;
    case 'nettest':ui.scr='nettest';err='';runNetTest();return;
    case 'pbots':ui.bots=Math.max(3,Math.min(14,ui.bots+(+b.dataset.d)));break;
    case 'pmode':ui.pmode=r;break;
    case 'prole':ui.prole=r;break;
    case 'pstart':startPractice();break;
    case 'myrole':setMyRole(r);hostTick();break;
    case 'comp':ui.comp=!ui.comp;break;
    case 'help':ui.help=!ui.help;try{window.scrollTo(0,0)}catch(e){}break;
    case 'voters':ui.vx=ui.vx===p?null:p;break;
    case 'revive':{const p=mine();if(p){p.a=1;if(G.ph==='over'){G.ph='dusk';G.win=null}}hostTick();break}
    case 'hunterhome':ui.prole='hunter';startPractice();// falls through to the Hunter test
    case 'thunter':{if(G.ph==='lobby')break;setMyRole('hunter');const p=mine();if(p)p.a=1;G.win=null;if(!G.dn)G.dn=1;
      G.ph='day';G.rd=rid();const rd=G.rd;
      Object.keys(players).filter(k=>k.startsWith('bot')&&isAlive(k)).forEach(k=>{players[k]=Object.assign({},players[k],{vote:{rd,t:me.i}})});
      st.vote={rd,t:'-'};hostTick();resolveVote();ui.ptOpen=false;push();window.scrollTo(0,0);return}
    case 'voteme':ui.voteMe=!ui.voteMe;break;
    case 'peek':ui.peek=!ui.peek;break;
    case 'pexit':try{location.reload()}catch(e){}return;
    case 'leave':if(ui.sure!=='leave'){ui.sure='leave';break}leave();return;
    case 'role':ui.showRole=!ui.showRole;break;
    case 'sel':if(k==='sw'||k==='lv'){const s=ui[k];ui[k]=s.includes(p)?s.filter(x=>x!==p):s.concat(p).slice(-2)}else{ui[k]=ui[k]===p?null:p;if(G&&G.ph==='night'&&k==='t'&&shown(me.i)==='mafia'&&!teammates().some(q=>q.a)){st.mp=ui.t?{rd:G.rd,t:ui.t}:null;if(st.act&&st.act.t!==ui.t)st.act=null;push();return}}break;
    case 'wpro':ui.t=ui.t===p?null:p;if(ui.k===p)ui.k=null;break;
    case 'wkill':ui.k=ui.k===p?null:p;if(ui.t===p)ui.t=null;ui.kill=!!ui.k;break;
    case 'tkill':ui.kill=!ui.kill;if(!ui.kill)ui.k=null;break;
    case 'act':{if(b.dataset.x==='mkill'){if(!G.agp)break;ui.t=G.agp}
      if(!G.nc&&!b.dataset.ok){ui.cf={a:'act',x:b.dataset.x||''};break}ui.cf=null;const s=shown(me.i),x={rd:G.rd};
      if(s==='cupid'&&G.dn===0){x.t='-';x.lv=ui.lv.slice(0,2)}
      else if(s==='shuffler'&&!G.su[me.i]){x.t='-';if(b.dataset.x!=='pass')x.sw=ui.sw.slice(0,2)}
      else{x.t=ui.t;if(s==='witch'&&ui.kill&&ui.k)x.k=ui.k}
      st.act=x;push();return}
    case 'undo':st.act=null;push();return;
    case 'vote':if(!ui.v||(st.vote&&st.vote.rd===G.rd))return;if(!G.nc&&!b.dataset.ok){ui.cf={a:'vote'};break}st.vote={rd:G.rd,t:ui.v};ui.cf=null;push();return;
    case 'msug':if(!ui.t)break;st.mp={rd:G.rd,t:ui.t,at:hostNow()};st.act=null;push();return;
    case 'magree':{const L=latestSug();if(!L)break;st.mp={rd:G.rd,t:L.t,at:L.at};st.act=null;ui.t=L.t;push();return}
    case 'mother':{const L=latestSug();if(L)ui.dis=L.by+L.t+L.at;break}
    case 'cfback':ui.cf=null;break;
    case 'shoot':if(!ui.t)return;if(!G.nc&&!b.dataset.ok){ui.cf={a:'shoot'};break}st.shot={rd:G.rd,t:ui.t};ui.cf=null;push();return;
    /* guide */
    case 'cnt':{const c=Object.assign({},setup());c[r]=Math.max(r==='mafia'?1:0,(c[r]||0)+(+b.dataset.d));G.setup=c;push();return}
    case 'mode':G.mode=r;push();return;
    case 'nf':case 'ngt':case 'ngp':case 'nfr':case 'nfk':case 'nc':case 'nt':{const o=b.dataset.s==='g'?G:ui.pc;
      if(a==='nf'){o.nf=o.nf?0:1;if(o.ng===undefined)o.ng=20}
      if(a==='ngt')o.ng=o.ng?0:20;
      if(a==='ngp')o.ng=Math.max(10,Math.min(40,(o.ng||20)+5*(+b.dataset.d)));
      if(a==='nfk'){const n=Object.assign({},o.nr||{});n[r]=Math.max(0,Math.min(50,(ownLvl(o,r)||0)+5*(+b.dataset.d)));o.nr=n}
      if(a==='nfr'){const n=Object.assign({},o.nr||{});if(ownLvl(o,r)!==null)delete n[r];else n[r]=o.ng||20;o.nr=n}
      if(a==='nc')o.nc=o.nc?0:1;
      if(a==='nt')o.nt=o.nt?0:1;
      if(b.dataset.s==='g'){push();return}break}
    case 'rng':{const n=Math.max(G.lob.length,4),v=rng(n);v[+r]=Math.max(1,Math.min(maxMafia(n),v[+r]+(+b.dataset.d)));if(r==='0'&&v[0]>v[1])v[1]=v[0];if(r==='1'&&v[1]<v[0])v[0]=v[1];G.rng=v;push();return}
    case 'pool':{const p=Object.assign({},G.pool||{});p[r]=p[r]===0?1:0;G.pool=p;push();return}
    case 'auto':G.setup=null;push();return;
    case 'rev':G.rev=G.rev?0:1;push();return;
    case 'deal':startGame();push();return;
    case 'wake':if(!allDone())return;resolveNight();push();return;
    case 'toVote':G.ph='day';G.rd=rid();G.done=0;G.tot=alive().length;push();return;
    case 'reveal':if(!allDone())return;resolveVote();push();return;
    case 'skipShot':G.ph='dusk';G.rd=rid();checkWin();push();return;
    case 'toNight':toNight();push();return;
    case 'again':G={ph:'lobby',code:G.code,setup:G.setup,mode:G.mode,nf:G.nf,ng:G.ng,nr:G.nr,nc:G.nc,nt:G.nt,rng:G.rng,pool:G.pool,rev:G.rev,lob:[],rd:rid(),dn:0};ui.showRole=false;push();return;
  }
  render();
});

setInterval(()=>{
  if(!G||ui.scr!=='game')return;
  if(me.host&&G.ph==='night'&&G.t0&&!G.to&&!G.nt){
    if(Date.now()-G.t0>=60000){G.to=1;hostTick();onGame()}
    else if(Date.now()-G.hnow>4000){G.hnow=Date.now();hostTick()}
  }
  if(G.ph==='night')render();
},500);

/* ---------- boot ---------- */
if(me.code&&me.n){
  if(me.host){const g=ld('mf_G',null);G=g&&g.code===me.code?g:{ph:'lobby',code:me.code,setup:null,rev:1,lob:[],rd:rid(),dn:0};acts=ld('mf_acts',{});
    const mine=acts[me.i];if(mine)st=Object.assign({},mine,{n:me.n})}
  const ss=ld('mf_st',null);if(ss&&ss.i===me.i)st=Object.assign({},ss,{n:me.n});
  ui.scr='game';lastRd=G?G.rd:'';onGame();render();connect();
}else{
  try{const k=sessionStorage.getItem('mf_kicked');if(k){sessionStorage.removeItem('mf_kicked');ui.notice=`The guide removed you from game ${k}.`}}catch(e){}
  render();
}
}
</script>
</body>
</html>
