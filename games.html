k your internet connection and try again.\")}\n}\n/* ---------- network: two relays + a direct link ----------\n   Every message goes three ways at once: through two public relay servers (MQTT over secure\n   WebSocket, which works on any Wi-Fi or mobile network, like loading a web page) and over a\n   direct PeerJS link when the networks allow one. Whichever copy arrives first counts; messages\n   are numbered, so the extra copies are ignored. */\n// Four free public relays run by four different organisations. The last two use the normal\n// web port (443), so they also get through strict Wi-Fi that blocks the first two.\nconst RELAYS=(window.MAFIA_RELAYS||[\n  {name:'HiveMQ',url:'wss://broker.hivemq.com:8884/mqtt'},\n  {name:'EMQX',url:'wss://broker.emqx.io:8084/mqtt'},\n  {name:'Eclipse',url:'wss://mqtt.eclipseprojects.io/mqtt'},\n  {name:'shiftr.io',url:'wss://public.cloud.shiftr.io/',user:'public',pass:'public'}\n]).map(r=>typeof r==='string'?{url:r}:r);\nconst te8=new TextEncoder(),td8=new TextDecoder();\nfunction cat(a){let n=0;for(const p of a)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of a){o.set(p,k);k+=p.length}return o}\nconst u16=n=>new Uint8Array([n>>8&255,n&255]);\nconst mstr=s=>{const b=te8.encode(s);return cat([u16(b.length),b])};\nconst vlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return new Uint8Array(o)};\nconst mpkt=(h,b)=>cat([new Uint8Array([h]),vlen(b.length),b]);\n\n/* A small MQTT 3.1.1 client: connect, subscribe, publish (QoS 0, optionally retained),\n   a \"last will\" message, keep-alive, and reconnecting after sleep or network changes. */\nfunction miniMqtt(relay,o){\n  const url=relay.url;\n  let ws=null,buf=new Uint8Array(0),up=false,timer=null,retry=1500,pid=1,lastRx=0,closed=false;\n  const put=b=>{try{if(ws&&ws.readyState===1)ws.send(b)}catch(e){}};\n  const subPkt=()=>mpkt(0x82,cat([u16(pid++),...o.subs.map(s=>cat([mstr(s),new Uint8Array([0])]))]));\n  const connectPkt=()=>mpkt(0x10,cat([mstr('MQTT'),\n    new Uint8Array([4,2|(o.will?4|32:0)|(relay.user!=null?128:0)|(relay.pass!=null?64:0)]),u16(30),mstr(o.id),\n    ...(o.will?[mstr(o.will),u16(0)]:[]),\n    ...(relay.user!=null?[mstr(relay.user)]:[]),...(relay.pass!=null?[mstr(relay.pass)]:[])]));\n  function onData(d){\n    lastRx=Date.now();\n    buf=cat([buf,new Uint8Array(d)]);\n    for(;;){\n      if(buf.length<2)return;\n      let i=1,v=0,m=1,b;\n      do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128}while(b&128);\n      if(buf.length<i+v)return;\n      const h=buf[0],body=buf.slice(i,i+v);buf=buf.slice(i+v);\n      const t=h>>4;\n      if(t===2){                                   // CONNACK\n        if(body[1]!==0){try{ws.close()}catch(e){}return}\n        up=true;retry=1500;\n        put(subPkt());\n        o.onUp();\n      }else if(t===3){                             // PUBLISH\n        const tl=body[0]<<8|body[1];let k=2+tl;if((h>>1)&3)k+=2;\n        o.onMsg(td8.decode(body.subarray(2,2+tl)),td8.decode(body.subarray(k)),(h&1)===1);\n      }\n    }\n  }\n  function later(){clearTimeout(timer);timer=setTimeout(open,retry);retry=Math.min(retry*2,15000)}\n  function open(){\n    clearTimeout(timer);if(closed)return;\n    let w;try{w=ws=new WebSocket(url,['mqtt'])}catch(e){ws=null;return later()}\n    w.binaryType='arraybuffer';buf=new Uint8Array(0);lastRx=Date.now();\n    w.onopen=()=>put(connectPkt());\n    w.onmessage=e=>{if(ws===w)onData(e.data)};\n    w.onerror=()=>{try{w.close()}catch(e){}};\n    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};\n    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again\n  }\n  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep\n    if(closed)return clearInterval(iv);\n    if(!ws)return;\n    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}\n    if(up)put(new Uint8Array([0xC0,0]));\n  },15000);\n  // Coming back to the foreground (or the network changing): the phone may have paused this page and\n  // quietly killed its connection, so messages sent meanwhile never arrived. Ask the relay again for\n  // everything it has stored, check the line answers, and replace it if it doesn't within 4 seconds.\n  let lastWake=0;\n  function wake(){\n    if(closed||document.hidden||Date.now()-lastWake<1500)return;\n    lastWake=Date.now();retry=1500;\n    if(!ws){open();return}\n    if(!up)return;                                 // still connecting; that will fetch everything anyway\n    const mark=Date.now();\n    put(subPkt());put(new Uint8Array([0xC0,0]));\n    o.onUp();\n    setTimeout(()=>{if(!closed&&ws&&lastRx<mark){retry=300;try{ws.close()}catch(e){}}},4000);\n  }\n  document.addEventListener('visibilitychange',wake);\n  window.addEventListener('focus',wake);\n  window.addEventListener('pageshow',wake);\n  window.addEventListener('online',wake);\n  open();\n  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},\n    restart(){if(closed)return;clearTimeout(timer);retry=1500;const w=ws;ws=null;if(up){up=false;o.onDown()}if(w)try{w.close()}catch(e){}open()},\n    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};\n}\n\n/* ---------- connection test ----------\n   For each relay: connect, send a message to ourselves through it and time the round trip.\n   For the direct link: check that PeerJS's introduction server answers. */\nlet netT=null;\nfunction relayTest(relay){return new Promise(res=>{\n  const t0=performance.now(),topic='clocktower/v1/test/'+rid(10);let sent=0,done=false,c=null;\n  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};\n  c=miniMqtt(relay,{id:'ctt'+rid(10),subs:[topic],will:null,\n    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},\n    onMsg(t,m){if(t===topic&&m===' is phone can't reach any of the game's servers.<\/p><p class=\"mut\">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.<\/p>`;\n  }\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='clocktower/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='clocktower-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove \n          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});\n          c.on('close',()=>conns.delete(c));\n        });\n        p.on('error',e=>{\n          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}\n            setTimeout(start,wait);wait=Math.min(wait*2,30000)}\n        });\n        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});\n      };\n      start();\n    }else{\n      const p=new Peer(PO);let rt=null,wait=2500;\n      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};\n      const dial=()=>{\n        if(p.destroyed)return;\n        if(p.disconnected){try{p.reconnect()}catch(e){}}\n        if(pc){try{pc.close()}catch(e){}}\n        const cc=pc=p.connect(hid,{reliable:true});\n        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);\n        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});\n        cc.on('data',d=>{if(pc===cc)fromHost(d)});\n        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});\n      };\n      p.on('open',dial);\n      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});\n    }\n  }catch(e){}\n\n  function out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- views ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall)\" */\nconst fullName=s=>{const o=G&&G.nmx&&G.nmx[s.i],b=String(o||s.n).slice(0,16),x=G&&G.sfx&&G.sfx[s.i];return x?b+' '+x:b};\nfunction sfxV(){\n  const i=ui.sfxFor;if(!i||!me.host||!G||G.ph!=='lobby')return '';\n  const pl=players[i]||{i},base=String(pl.n||'this player').slice(0,16),now=fullName(pl),changed=(G.sfx&&G.sfx[i])||(G.nmx&&G.nmx[i]);\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sfh\"><div class=\"card\"><p id=\"sfh\" class=\"disp\" style=\"font-size:24px\">Change ${esc(base)}'s name<\/p><p class=\"mut\">Shown on everyone's phone as: <b>${esc(now)}<\/b><\/p><label for=\"sfx\">New text<\/label><input id=\"sfx\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.sfxv==null?'':ui.sfxv)}\" placeholder=\"e.g. Ben, or (red jumper)\"><button class=\"pri big\" data-a=\"sfxs\">Add to the end of the name<\/button><button class=\"pri big\" data-a=\"sfxr\">Replace the whole name<\/button>${changed?`<button data-a=\"sfxd\">Go back to \"${esc(base)}\"<\/button>`:''}<button data-a=\"sfxc\">Cancel<\/button><\/div><\/div>`;\n}\n\nfunction rnClean(){if(G&&G.rn)for(const k in G.rn){const s=acts[k];if(!players[k]||(s&&(s.rnd||0)>=G.rn[k]))delete G.rn[k]}}\nfunction hero(){\n  const stars=[[30,30],[70,60],[120,22],[160,70],[210,30],[250,58],[340,26],[372,70],[60,110],[190,100]].map(([x,y])=>`<circle cx=\"${x}\" cy=\"${y}\" r=\"1.4\" fill=\"#efe9dc\" opacity=\".7\"/>`).join('');\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 230\" preserveAspectRatio=\"xMidYMax slice\">\n<defs><linearGradient id=\"sk\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1d1840\"/><stop offset=\"1\" stop-color=\"#0d0f1f\"/><\/linearGradient>\n<radialGradient id=\"gl\"><stop offset=\"0\" stop-color=\"#e4555d\" stop-opacity=\".5\"/><stop offset=\"1\" stop-color=\"#e4555d\" stop-opacity=\"0\"/><\/radialGradient><\/defs>\n<rect width=\"400\" height=\"230\" fill=\"url(#sk)\"/>${stars}<circle cx=\"300\" cy=\"70\" r=\"80\" fill=\"url(#gl)\"/><circle cx=\"300\" cy=\"70\" r=\"34\" fill=\"#c8323c\"/>\n<g fill=\"#07080f\">\n<rect x=\"0\" y=\"180\" width=\"400\" height=\"50\"/><path d=\"M0 182 L30 160 L60 182 Z M70 182 L95 150 L120 182 Z M260 182 L290 158 L320 182 Z M330 182 L360 150 L400 182 Z\"/>\n<rect x=\"150\" y=\"60\" width=\"64\" height=\"130\"/><path d=\"M144 62 L182 8 L220 62 Z\"/><rect x=\"178\" y=\"0\" width=\"8\" height=\"12\"/>\n<rect x=\"132\" y=\"120\" width=\"20\" height=\"70\"/><rect x=\"212\" y=\"120\" width=\"20\" height=\"70\"/><\/g>\n<circle cx=\"182\" cy=\"92\" r=\"21\" fill=\"#d9b36a\"/><circle cx=\"182\" cy=\"92\" r=\"17\" fill=\"#f2e3bd\"/>\n<line x1=\"182\" y1=\"92\" x2=\"182\" y2=\"78\" stroke=\"#07080f\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"182\" y1=\"92\" x2=\"192\" y2=\"96\" stroke=\"#07080f\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n<rect x=\"172\" y=\"140\" width=\"20\" height=\"30\" rx=\"10\" fill=\"#f2c46d\" opacity=\".75\"/>\n<rect y=\"224\" width=\"400\" height=\"6\" fill=\"#c8323c\"/><\/svg><\/div>`;\n}\nfunction rolesHelp(){\n  const grp=(t,h)=>`<h3>${h}<\/h3><dl>${Object.keys(ROLES).filter(k=>ROLES[k].t===t).map(k=>`<dt>${ROLES[k].n}<\/dt><dd>${ROLES[k].d}<\/dd>`).join('')}<\/dl>`;\n  return grp('tf','Townsfolk (good)')+grp('out','Outsiders (good)')+grp('min','Minions (evil)')+grp('dem','Demon (evil)');\n}\nfunction rulesText(){\n  return `<p>Everyone gets a secret character. The <b class=\"g\">good team<\/b> (Townsfolk and Outsiders) wins by executing the Demon. The <b class=\"e\">evil team<\/b> (the Demon and its Minions) wins when only two players are left alive.<\/p>\n<p><b>At night<\/b>, everyone looks at their phone. Some characters choose a player; everyone else taps a name too, so nobody can tell who has a power. The Demon kills from the second night on. Info arrives on your phone in the morning.<\/p>\n<p><b>By day<\/b>, talk, bluff and share (or hide) what you know. Any living player can nominate someone once a day, and everyone votes. A player needs votes from at least half the living players to be executed, and only the one with the most votes is executed when the day ends.<\/p>\n<p><b>Dead players<\/b> stay in the game: they can still talk, and they get one last vote to use on any later day. The game decides with your seats: the Chef and Empath count neighbours, so put the names in the order you sit.<\/p>\n<p>With 7 or more players, the Minions and the Demon learn who each other are on the first night, and the Demon learns three good characters to bluff as.<\/p>\n<p><b>Two ways to play.<\/b> <b>Storyteller:<\/b> one person runs the game on their phone and doesn't play. They see everyone's character, check each night before it happens, and can change the info given to the Drunk and poisoned players. <b>Automatic:<\/b> everyone plays, and the game makes those choices itself.<\/p>`;\n}\nfunction homeV(){\n  return hero()+`<a class=\"homelink\" href=\"./\">\u2190 Home<\/a><h1>Blood on the Clocktower<\/h1>${ui.notice?`<p class=\"err\">${esc(ui.notice)}<\/p>`:''}${ui.rejoin?`<button class=\"pri\" data-a=\"rejoin\">Join game ${esc(ui.rejoin.c)} again<\/button>`:''}\n<p class=\"mut\">A game of bluffing and deduction for 5 to 15 players in one room, each on their own phone. Trouble Brewing characters.<\/p>\n<button class=\"pri big\" data-a=\"start\">Join a game<\/button>\n<button data-a=\"hostnew\">Host a new game<\/button>\n<button class=\"link\" data-a=\"nettest\">Test connection: can this phone reach the servers?<\/button>\n<details><summary>How to play<\/summary>${rulesText()}<\/details>\n<details><summary>All the characters<\/summary>${rolesHelp()}<\/details>\n<p class=\"fine\">A fan-made helper for playing Blood on the Clocktower, a game by The Pandemonium Institute. Not official.<\/p>`;\n}\nfunction joinV(){\n  const h=ui.mode==='host';\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>${h?'Host a game':'Join the game'}<\/h2>\n<label for=\"nm\">Your name<\/label><input id=\"nm\" maxlength=\"16\" autocomplete=\"nickname\" value=\"${esc(ui.name)}\">\n${h?`<p><b>How will you run it?<\/b><\/p><div class=\"list\">\n<button class=\"opt${ui.hm==='st'?' sel':''}\" data-a=\"hm\" data-r=\"st\"><span>I'm the Storyteller<br><small>You run the game and don't play. You see every character and check each night before it happens.<\/small><\/span><\/button>\n<button class=\"opt${ui.hm==='auto'?' sel':''}\" data-a=\"hm\" data-r=\"auto\"><span>Automatic<br><small>You play too. The game runs the nights and makes the Storyteller's choices itself.<\/small><\/span><\/button><\/div>`\n:`<label for=\"cd\">Game code (ask the host)<\/label><input id=\"cd\" maxlength=\"4\" autocapitalize=\"characters\" autocomplete=\"off\" value=\"${esc(ui.code)}\" style=\"text-transform:uppercase;letter-spacing:.2em\">`}\n${err?`<p class=\"err\">${esc(err)}<\/p>`:''}\n<button class=\"pri big\" data-a=\"${h?'create':'join'}\">${h?'Create game':'Join'}<\/button>`;\n}\nfunction bar(){\n  return `<div class=\"bar\"><span><i class=\"dot ${conn?'on':''}\"><\/i>Game ${esc(me.code)} \u00b7 ${esc(me.n)}${isST()?' \u00b7 Storyteller':me.host?' \u00b7 host':''}<\/span><span>${ui.sure==='leave'?'<button class=\"link\" data-a=\"leave\">Tap again to leave<\/button>':'<button class=\"link\" data-a=\"leave\">Leave<\/button>'}<\/span><\/div>`;\n}\nconst card=x=>`<div class=\"card\">${x}<\/div>`;\nconst hostCard=x=>`<div class=\"card guide\">${x}<\/div>`;\nconst prog=(d,t)=>`<div class=\"prog\"><i style=\"width:${t?Math.round(100*d/t):0}%\"><\/i><\/div><p class=\"mut\">${d} of ${t} done<\/p>`;\nfunction optList(ids,k,multi){\n  return `<div class=\"list pick\">${ids.map(i=>{const on=multi?ui[k].includes(i):ui[k]===i,p=P(i);\n    return `<button class=\"opt${on?' sel':''}${p&&!p.a?' dead':''}\" data-a=\"${multi?'sel2':'sel'}\" data-k=\"${k}\" data-p=\"${esc(i)}\"><span class=\"nm\">${esc(nm(i))}${i===me.i?' <small>(you)<\/small>':''}<\/span><small>${on?'Selected':p&&!p.a?'dead':''}<\/small><\/button>`}).join('')}<\/div>`;\n}\nconst team=r=>evilRole(r)?'evil':'good';\nfunction roleCard(){\n  const s=shown(me.i),k=kind(s);\n  if(!ui.showRole)return `<button class=\"big\" data-a=\"role\">Show my character<\/button>`;\n  return `<div class=\"card role ${team(s)}\"><p class=\"mut\">You are the<\/p><div class=\"disp\">${rn(s)}<\/div><p><span class=\"tag ${team(s)}\">${KIND[k]} \u00b7 ${team(s)==='evil'?'Evil':'Good'}<\/span><\/p><p>${ROLES[s].d}<\/p><button data-a=\"role\">Hide<\/button><\/div>`;\n}\nfunction infoLog(){\n  const L=(G.inf&&G.inf[me.i])||[];if(!L.length)return '';\n  return card(`<p class=\"mut\">What you've learned<\/p>`+L.slice().reverse().map((x,k)=>`<div class=\"card info${k===0&&x.at>Date.now()-15*60e3?' new':''}\" style=\"margin:8px 0;padding:10px 12px\"><p class=\"mut\" style=\"margin:0\">${x.w}<\/p><p style=\"margin:2px 0 0\">${x.x}<\/p><\/div>`).join(''));\n}\nfunction townV(){\n  return `<details${ui.town?' open':''} id=\"town\"><summary>The town square (seat order)<\/summary><p class=\"mut\">Seats go round the circle: the last seat sits next to the first.<\/p>`+card(G.pl.map((p,k)=>`<div class=\"row${p.a?'':' dead'}\"><span><span class=\"mut\">${k+1}.<\/span> <span class=\"nm\">${esc(p.n)}<\/span>${p.i===me.i?' <span class=\"tag\">you<\/span>':''}<\/span><small class=\"mut\">${p.a?'alive':p.gv?'dead \u00b7 has a vote':'dead \u00b7 vote used'}<\/small><\/div>`).join(''))+`<\/details>`;\n}\nfunction grimoire(full){\n  const tags=i=>{const t=[];if(poisoned(i))t.push('<span class=\"tag warn\">poisoned<\/span>');if(G.mk===i)t.push('<span class=\"tag\">safe (Monk)<\/span>');if(G.rh===i)t.push('<span class=\"tag\">red herring<\/span>');\n    Object.keys(G.ms||{}).forEach(b=>{if(G.ms[b]===i)t.push('<span class=\"tag\">Butler\\'s master<\/span>')});return t.join(' ')};\n  return card(`<p class=\"mut\">${full?\"The Storyteller's book\":\"The Spy's look at the book\"}<\/p>`+G.pl.map((p,k)=>{const r=role(p.i);\n    return `<div class=\"row${p.a?'':' dead'}\"><span><span class=\"mut\">${k+1}.<\/span> <span class=\"nm\">${esc(p.n)}<\/span><br><small class=\"${team(r)==='evil'?'e':'g'}\">${rn(r)}${r==='drunk'?' (thinks: '+rn(shown(p.i))+')':''}<\/small> ${tags(p.i)}${p.a?'':` <small class=\"mut\">${p.gv?'\u00b7 has a vote':'\u00b7 vote used'}<\/small>`}<\/span>`+\n      (full?`<button class=\"link\" data-a=\"gk\" data-p=\"${esc(p.i)}\">${ui.sure==='gk:'+p.i?'Tap again':p.a?'Kill':'Revive'}<\/button>`:'')+`<\/div>`}).join('')+\n    (full?`<p class=\"mut\" style=\"margin-top:12px\">Bluffs for the Demon: ${G.bl.map(rn).join(', ')}<\/p>`+\n      `<button class=\"opt\" data-a=\"rre\"><span>The Recluse shows up as evil<\/span><small>${G.rre?'On':'Off'}<\/small><\/button><button class=\"opt\" data-a=\"srg\"><span>The Spy shows up as good<\/span><small>${G.srg?'On':'Off'}<\/small><\/button>`:''));\n}\nfunction actionPanel(){\n  const nd=need(me.i),s=shown(me.i);\n  if(nd.k==='none')return card(`<p><b>${rn(s)}<\/b>: nothing to choose tonight. Tap any name so no one can tell, then tap Done.<\/p>`+optList(G.pl.map(p=>p.i).filter(x=>x!==me.i),'t')+`<button class=\"pri big\" data-a=\"act\">Done<\/button>`);\n  if(nd.k==='two')return card(`<p><b>${rn(s)}<\/b>: ${nd.q}<\/p>`+optList(nd.opts,'t2',true)+`<button class=\"pri big\" data-a=\"act\" ${ui.t2.length===2?'':'disabled'}>Choose these two<\/button>`);\n  return card(`<p><b>${rn(s)}<\/b>: ${nd.q}<\/p>`+optList(nd.opts,'t')+`<button class=\"pri big\" data-a=\"act\" ${ui.t?'':'disabled'}>${ui.t===me.i&&s==='imp'?'Choose myself':'Choose'}<\/button>`);\n}\nfunction nightV(){\n  let h=`<h2>Night ${G.dn}<\/h2>`;\n  const p=mine();\n  if(p){\n    if(!p.a)h+=card(`<p><b>You're dead.<\/b> Close your eyes and sleep through the night. You still have ${p.gv?'your':'no'} last vote.<\/p>`);\n    else if(act(me.i))h+=card(`<p><b>Done.<\/b> Put your phone down and wait for morning.<\/p>${prog(G.done,G.tot)}<button data-a=\"undo\">Change my choice<\/button>`);\n    else h+=actionPanel();\n    if(role(me.i)==='spy'&&p.a)h+=grimoire(false);\n  }\n  if(me.host)h+=hostCard((isST()?'':'<p class=\"mut\">You\\'re hosting.<\/p>')+`<p>Night ${G.dn}: everyone is choosing.<\/p>${prog(G.done,G.tot)}`+\n    (isST()?`<button class=\"pri big\" data-a=\"review\">${G.done>=G.tot?'Everyone is done: review the night':ui.sure==='review'?`Tap again: ${G.tot-G.done} still choosing`:'Review the night now'}<\/button>`\n      :G.done<G.tot?`<button data-a=\"force\">${ui.sure==='force'?`Tap again: ${G.tot-G.done} still choosing`:'Wake the town now'}<\/button>`:''));\n  if(p)h+=roleCard()+infoLog()+townV();\n  if(isST())h+=grimoire(true);\n  return h;\n}\nfunction reviewV(){\n  const pd=G.pend;\n  if(!isST())return `<h2>Night ${G.dn}<\/h2>`+card('<p>The Storyteller is finishing the night\u2026<\/p>')+(mine()?roleCard()+infoLog():'');\n  let h=`<h2>${pd.raven?'The Ravenkeeper':'Before morning'}<\/h2>`;\n  if(!pd.raven){\n    h+=card((pd.notes.length?pd.notes.map(x=>`<p>${x}<\/p>`).join(''):'<p>A quiet night.<\/p>')+\n      `<p class=\"mut\" style=\"margin-top:12px\">Who dies tonight \u00b7 tap to change<\/p><div class=\"list pick\">`+alive().map(i=>{const on=pd.deaths.includes(i);\n        return `<button class=\"opt${on?' sel':''}\" data-a=\"rdie\" data-p=\"${esc(i)}\"><span>${esc(nm(i))}<br><small>${rn(role(i))}<\/small><\/span><small>${on?'Dies':''}<\/small><\/button>`}).join('')+'<\/div>');\n  }\n  h+=pd.items.length?`<p class=\"mut\">The info each player gets. Tap a value to change it. Drunk and poisoned players can be told anything.<\/p>`:'<p class=\"mut\">No one gets info tonight.<\/p>';\n  pd.items.forEach((x,ix)=>{\n    let ed='';\n    const sel=(f,val,opts)=>`<select data-ed=\"${ix}:${f}\" aria-label=\"${f}\">${opts.map(([v,l])=>`<option value=\"${esc(v)}\"${v===val?' selected':''}>${esc(l)}<\/option>`).join('')}<\/select>`;\n    const pls=G.pl.map(p=>[p.i,p.n]);\n    if(x.k==='pair'){const pool=x.c==='tf'?TF:x.c==='out'?OUT:MIN;\n      ed=x.none?'':sel('p0',x.p[0],pls)+sel('p1',x.p[1],pls);\n      ed+=sel('r',x.none?'none':x.r,pool.map(r=>[r,rn(r)]).concat(x.c==='out'?[['none','No Outsiders in play']]:[]))}\n    else if(x.k==='num')ed=`<div class=\"row\"><span>Number<\/span><span class=\"step\"><button data-a=\"enum\" data-r=\"${ix}\" data-d=\"-1\" aria-label=\"Lower\">\u2212<\/button><b>${x.v}<\/b><button data-a=\"enum\" data-r=\"${ix}\" data-d=\"1\" aria-label=\"Higher\">+<\/button><\/span><\/div>`;\n    else if(x.k==='yn')ed=`<button class=\"opt\" data-a=\"eyn\" data-r=\"${ix}\"><span>Answer<\/span><small>${x.v?'Yes':'No'}<\/small><\/button>`;\n    else if(x.k==='role')ed=sel('v',x.v,Object.keys(ROLES).map(r=>[r,rn(r)]));\n    h+=card(`<p><b>${esc(nm(x.i))}<\/b> \u00b7 ${rn(x.s)} ${x.bad?`<span class=\"tag warn\">${x.bad}: their info can be false<\/span>`:''}${x.ed?' <span class=\"tag\">changed<\/span>':''}<\/p><p class=\"say\">${infoText(x)}<\/p>${ed}`);\n  });\n  return h+`<button class=\"pri big\" data-a=\"confirm\">${pd.raven?'Send it and start the day':'Confirm and wake the town'}<\/button>`+grimoire(true);\n}\nfunction ravenV(){\n  let h=`<h2>Night ${G.dn}<\/h2>`;\n  if(me.i===G.rk){const a=act(me.i);\n    h+=a?card('<p>Done. Waiting for morning\u2026<\/p>'):card(`<p><b>You died tonight, Ravenkeeper.<\/b> Choose a player to learn their character.<\/p>`+optList(G.pl.map(p=>p.i),'t')+`<button class=\"pri big\" data-a=\"act\" ${ui.t?'':'disabled'}>Choose<\/button>`);\n  }else h+=card('<p>Someone is still waking up\u2026 Keep your eyes closed.<\/p>');\n  if(isST())h+=hostCard(`<p>${N(G.rk)} (the Ravenkeeper) died tonight and is choosing a player.<\/p>`)+grimoire(true);\n  else if(mine())h+=roleCard()+infoLog();\n  return h;\n}\nfunction deathNews(){return G.died&&G.died.length?G.died.map(i=>`<p>${N(i)} died in the night.<\/p>`).join(''):'<p><b>No one died in the night.<\/b><\/p>'}\nfunction dayV(){\n  const d=G.day,p=mine();\n  let h=`<h2>Day ${G.dn}<\/h2>`+card(deathNews()+(d.log.length?`<p class=\"mut\" style=\"margin-top:10px\">Today<\/p>`+d.log.map(x=>`<p>${x}<\/p>`).join(''):''));\n  if(d.blk)h+=card(d.blk.t?`<p>About to be executed: ${N(d.blk.t)} with <b>${d.blk.v}<\/b> ${plural(d.blk.v,'vote','votes')}.<\/p><p class=\"mut\">Someone else needs more than ${d.blk.v} votes to take their place. A tie means no one is executed.<\/p>`:`<p>Tied at <b>${d.blk.v}<\/b> votes: no one is about to be executed. It takes more than ${d.blk.v} votes to change that.<\/p>`);\n  if(G.nom){\n    const v=voteOf(me.i),can=p&&(p.a||p.gv);\n    h+=card(`<p class=\"disp\" style=\"font-size:22px\">${N(G.nom.by)} nominated ${N(G.nom.t)}<\/p><p class=\"mut\">It takes ${need2()} votes. Vote now; everyone's votes are shown when it closes.<\/p>`+\n      (!p?'':!can?`<p class=\"mut\">You've used your last vote, so you can't vote.<\/p>`:v?`<p>You voted <b>${v.y?'yes':'no'}<\/b>.<\/p><button data-a=\"unvote\">Change my vote<\/button>`:\n        (p.a?'':`<p class=\"mut\">You're dead: voting yes uses up your one last vote.<\/p>`)+(role(me.i)==='butler'&&p.a&&G.ms[me.i]?`<p class=\"mut\">Butler: your yes only counts if your master, ${esc(nm(G.ms[me.i]))}, votes yes too.<\/p>`:'')+\n        `<div class=\"two\"><button class=\"pri half big\" data-a=\"vote\" data-r=\"1\">Yes, execute<\/button><button class=\"half big\" data-a=\"vote\" data-r=\"0\">No<\/button><\/div>`)+prog(G.nom.done,G.nom.tot));\n    if(me.host)h+=hostCard(`<p>Votes so far: ${G.nom.done} of ${G.nom.tot}. It closes by itself when everyone has voted.<\/p><button data-a=\"closevote\">${ui.sure==='closevote'?'Tap again: missing votes count as no':'Close the vote now'}<\/button>`);\n  }else if(p&&p.a){\n    const done=d.nby.includes(me.i)||!!(st.nom&&st.nom.d===G.dn);\n    if(ui.nomOpen&&!done){const opts=alive().filter(i=>!d.nt.includes(i));\n      h+=card(`<p><b>Who do you nominate?<\/b> You can nominate once today.<\/p>`+optList(opts,'t')+`<div class=\"two\"><button class=\"pri half\" data-a=\"nomgo\" ${ui.t?'':'disabled'}>Nominate<\/button><button class=\"half\" data-a=\"nomx\">Cancel<\/button><\/div>`)}\n    else if(ui.slayOpen&&!G.slu[me.i]){\n      h+=card(`<p><b>Use the Slayer's power<\/b> on a player. Everyone will see who you aimed at. You can only try this once per game.<\/p>`+optList(alive().filter(i=>i!==me.i),'t')+`<div class=\"two\"><button class=\"pri half\" data-a=\"slaygo\" ${ui.t?'':'disabled'}>Aim at them<\/button><button class=\"half\" data-a=\"slayx\">Cancel<\/button><\/div>`)}\n    else h+=(done?card('<p class=\"mut\">You have nominated today.<\/p>'):`<button class=\"pri big\" data-a=\"nom\">Nominate someone<\/button>`)+(G.slu[me.i]?'': ">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='party-imposter/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='party-imposter-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes\n  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.\n  if(me.host){\n    let tick=Date.now();\n    setInterval(()=>{\n      const now=Date.now();\n      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging\n      tick=now;\n      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;\n      for(const id in players){\n        if(id===me.i)continue;\n        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}\n      }\n    },30e3);\n  }\n  function fromHost(d){\n    if(!d||!d.g||(last.g&&d.q<=last.g))return;\n    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay\n    last.g=d.q;gotG=true;onNet(null,d.g);status();\n  }\n\n  RELAYS.forEach((relay,k)=>{\n    const src='r'+k;\n    const r=miniMqtt(relay,{\n      id:'mf'+rid(12),\n      subs:[me.host?base+'/p/+':base+'/g'],\n      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true);\n        if(byeDone){const f=byeDone;byeDone=null;setTimeout(f,400)}},   // the goodbye went out on a working connection\n      onDown(){status()},\n      onMsg(t,s,stored){\n        if(me.host){\n          // A brand-new game: anything stored from before it was created belongs to an old game with this word. Wipe it.\n          if(stored&&freshGame&&s){let d=null;try{d=JSON.parse(s)}catch(e){}\n            if(!d||!d.t||d.t<freshGame-2000){r.pub(t,'',true);return}}\n          if(!s)return;\n          try{fromPlayer(src,JSON.parse(s),stored)}catch(e){}\n        }else if(s){try{fromHost(JSON.parse(s))}catch(e){}}\n      }\n    });\n    relays.push(r);\n  });\n\n  if(window.Peer)try{\n    if(me.host){\n      let p,wait=2500;\n      const start=()=>{\n        p=new Peer(hid,PO);\n        p.on('open',()=>{wait=2500;peerUp=true;status()});\n        p.on('connection',c=>{\n          c.on('open',()=>{conns.add(c);if(env)try{c.send(env)}catch(e){}});\n          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});\n          c.on('close',()=>conns.delete(c));\n        });\n        p.on('error',e=>{\n          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}\n            setTimeout(start,wait);wait=Math.min(wait*2,30000)}\n        });\n        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});\n      };\n      start();\n    }else{\n      const p=new Peer(PO);let rt=null,wait=2500;\n      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};\n      const dial=()=>{\n        if(p.destroyed)return;\n        if(p.disconnected){try{p.reconnect()}catch(e){}}\n        if(pc){try{pc.close()}catch(e){}}\n        const cc=pc=p.connect(hid,{reliable:true});\n        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);\n        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});\n        cc.on('data',d=>{if(pc===cc)fromHost(d)});\n        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});\n      };\n      p.on('open',dial);\n      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});\n    }\n  }catch(e){}\n\n  function out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- common screens ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall)\" */\nconst fullName=s=>{const o=G&&G.nmx&&G.nmx[s.i],b=String(o||s.n).slice(0,16),x=G&&G.sfx&&G.sfx[s.i];return x?b+' '+x:b};\nfunction sfxV(){\n  const i=ui.sfxFor;if(!i||!me.host||!G||G.ph!=='lobby')return '';\n  const pl=players[i]||{i},base=String(pl.n||'this player').slice(0,16),now=fullName(pl),changed=(G.sfx&&G.sfx[i])||(G.nmx&&G.nmx[i]);\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sfh\"><div class=\"card\"><p id=\"sfh\" class=\"disp\" style=\"font-size:24px\">Change ${esc(base)}'s name<\/p><p class=\"mut\">Shown on everyone's phone as: <b>${esc(now)}<\/b><\/p><label for=\"sfx\">New text<\/label><input id=\"sfx\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.sfxv==null?'':ui.sfxv)}\" placeholder=\"e.g. Ben, or (red jumper)\"><button class=\"pri big\" data-a=\"sfxs\">Add to the end of the name<\/button><button class=\"pri big\" data-a=\"sfxr\">Replace the whole name<\/button>${changed?`<button data-a=\"sfxd\">Go back to \"${esc(base)}\"<\/button>`:''}<button data-a=\"sfxc\">Cancel<\/button><\/div><\/div>`;\n}\n\nfunction rnClean(){if(G&&G.rn)for(const k in G.rn){const s=acts[k];if(!players[k]||(s&&(s.rnd||0)>=G.rn[k]))delete G.rn[k]}}\nfunction homeV(){\n  return hero()+`<a class=\"homelink\" href=\"./\">\u2190 Home<\/a><h1>${CFG.title}<\/h1>${ui.notice?`<p class=\"err\">${esc(ui.notice)}<\/p>`:''}${ui.rejoin?`<button class=\"pri\" data-a=\"rejoin\">Join game ${esc(ui.rejoin.c)} again<\/button>`:''}\n<p class=\"mut\">${CFG.blurb}<\/p>\n<button class=\"pri big\" data-a=\"start\">Join a game<\/button>\n<button data-a=\"hostnew\">Host a new game<\/button>\n<button class=\"link\" data-a=\"nettest\">Test connection: can this phone reach the servers?<\/button>\n<details><summary>How to play<\/summary>${rulesText()}<\/details>${CFG.fine?`<p class=\"fine\">${CFG.fine}<\/p>`:''}`;\n}\nfunction joinV(){\n  const h=ui.mode==='host';\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>${h?'Host a game':'Join the game'}<\/h2>\n<label for=\"nm\">Your name<\/label><input id=\"nm\" maxlength=\"16\" autocomplete=\"nickname\" value=\"${esc(ui.name)}\">\n${h?`<p class=\"mut\">You'll get a 4-letter code to share. You play too.<\/p>`:`<label for=\"cd\">Game code (ask the host)<\/label><input id=\"cd\" maxlength=\"4\" autocapitalize=\"characters\" autocomplete=\"off\" value=\"${esc(ui.code)}\" style=\"text-transform:uppercase;letter-spacing:.2em\">`}\n${err?`<p class=\"err\">${esc(err)}<\/p>`:''}\n<button class=\"pri big\" data-a=\"${h?'create':'join'}\">${h?'Create game':'Join'}<\/button>`;\n}\nfunction bar(){\n  return `<div class=\"bar\"><span><i class=\"dot ${conn?'on':''}\"><\/i>Game ${esc(me.code)} \u00b7 ${esc(me.n)}${me.host?' \u00b7 host':''}<\/span><span>${ui.sure==='leave'?'<button class=\"link\" data-a=\"leave\">Tap again to leave<\/button>':'<button class=\"link\" data-a=\"leave\">Leave<\/button>'}<\/span><\/div>`;\n}\nfunction lobbyList(extra){\n  return card(G.lob.map(p=>`<div class=\"row\"><span>${esc(p.n)}${p.i===me.i?' <span class=\"tag\">you<\/span>':''}${extra?extra(p.i):''}<\/span>${me.host&&p.i!==me.i?rnBtn(p.i)+`<button class=\"link\" data-a=\"kick\" data-p=\"${esc(p.i)}\">${ui.sure==='kick:'+p.i?'Tap again to remove':'Remove'}<\/button>`:''}<\/div>`).join('')||'<p class=\"mut\">No one yet.<\/p>');\n}\nfunction lobbyV(){\n  const n=G.lob.length;\n  let h=`<h2>Who's playing<\/h2><p class=\"mut\">${n} ${plural(n,'player','players')} joined<\/p>`+lobbyPlayers();\n  if(!me.host)return h+lobbyGuest()+`<p class=\"mut\">Waiting for the host to start\u2026<\/p><details><summary>How to play<\/summary>${rulesText()}<\/details>`;\n  h=hostCard(`<p>Everyone opens this page, taps <b>Join a game<\/b> and enters:<\/p><div class=\"code\">${esc(G.code)}<\/div>`)+h+lobbyGuest();\n  const [ok,msg]=canStart();\n  return h+lobbySettings()+`<button class=\"pri big\" data-a=\"go\" ${ok?'':'disabled'}>${ok?CFG.startText:esc(msg)}<\/button>`;\n}\nfunction helpV(){return `<h2>How to play<\/h2>`+card(rulesText())+`<button class=\"pri big\" data-a=\"help\">Back to the game<\/button>`}\nfunction gameV(){\n  if(ui.leaving)return card('<p><b>Leaving the game\u2026<\/b><\/p><p class=\"mut\">Telling the host you left.<\/p>');\n  let h=bar()+renameV()+sfxV();\n  if(ui.help)return h+helpV();\n  if(!G)return h+card(`<p>${conn?'Connected. Waiting for the host\u2026':'Connecting to game '+esc(me.code)+'\u2026'}<\/p>`+(err?`<p class=\"err\">${esc(err)}<\/p>`:''));\n  if(err)h+=`<p class=\"err\">${esc(err)}<\/p>`;\n  if(G.ph==='lobby')return h+lobbyV();\n  return h+gameScreen()+`<button class=\"link\" data-a=\"help\">How to play<\/button>`;\n}\nfunction render(){\n  if(typeof beforeRender==='function'&&beforeRender()===false)return;\n  document.body.className=bodyClass();\n  const h=ui.scr==='home'?homeV():ui.scr==='join'?joinV():ui.scr==='nettest'?netV():gameV();\n  if(h!==lastHtml){\n    // keep the cursor in a text box that is being typed in while other players' updates arrive\n    const f=document.activeElement,fid=f&&app.contains(f)&&f.id?f.id:null,s0=fid&&f.selectionStart!=null?[f.selectionStart,f.selectionEnd]:null;\n    const y=window.scrollY;app.innerHTML=h;lastHtml=h;window.scrollTo(0,y);\n    if(fid){const g=document.getElementById(fid);if(g){try{g.focus({preventScroll:true});if(s0)g.setSelectionRange(s0[0],s0[1])}catch(e){}}}\n    if(typeof afterRender==='function')afterRender()}\n}\nfunction toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}\nfunction kickPlayer(id){if(!me.host||!G||G.ph!=='lobby'||id===me.i)return;G.kk=(G.kk||[]).concat(id);const m=Object.assign({},players);delete m[id];onNet(m,null)}\nfunction enter(){st={i:me.i,n:me.n};ui.scr='game';err='';lastSent='';render();connect();wake()}\nfunction leave(){\n  if(ui.leaving)return;\n  let p=null;if(net&&net.bye&&!me.host)try{p=net.bye()}catch(e){}\n  me.code='';me.host=false;saveMe();\n  const go=()=>{try{location.reload()}catch(e){}};\n  if(p){ui.leaving=true;render();p.then(go,go)}else go();\n}\n\n/* ---------- Imposter: everyone shares a secret word, except one ---------- */\n/* Each pair: the real word, and a similar word for \"Similar word\" mode */\nconst WORDS={\n  'Food':[['Pizza','Burger'],['Sushi','Tacos'],['Pancakes','Waffles'],['Spaghetti','Lasagna'],['Chocolate','Caramel'],['Ice cream','Frozen yogurt'],['Popcorn','Crisps'],['Croissant','Bagel'],['Cheese','Butter'],['Salmon','Tuna'],['Soup','Stew'],['Strawberry','Raspberry'],['Banana','Mango'],['Hot dog','Sausage roll'],['Cupcake','Muffin'],['Omelette','Scrambled eggs'],['Waffle','Crepe'],['Taco','Burrito']],\n  'Drinks':[['Coffee','Tea'],['Beer','Cider'],['Wine','Champagne'],['Lemonade','Iced tea'],['Milkshake','Smoothie'],['Hot chocolate','Latte'],['Cola','Lemon soda'],['Whisky','Rum'],['Orange juice','Apple juice'],['Cocktail','Mocktail'],['Espresso','Cappuccino'],['Gin and tonic','Vodka soda']],\n  'Places':[['Beach','Lake'],['Airport','Train station'],['Hospital','Pharmacy'],['Library','Bookshop'],['Cinema','Theatre'],['Gym','Swimming pool'],['Zoo','Aquarium'],['Museum','Art gallery'],['Supermarket','Corner shop'],['Hotel','Campsite'],['School','University'],['Church','Castle'],['Nightclub','Bar'],['Sauna','Hot tub'],['Farm','Garden'],['Ski resort','Ice rink']],\n  'Animals':[['Dog','Wolf'],['Cat','Lion'],['Horse','Zebra'],['Shark','Dolphin'],['Eagle','Owl'],['Penguin','Seagull'],['Elephant','Rhino'],['Monkey','Gorilla'],['Snake','Lizard'],['Frog','Toad'],['Bee','Wasp'],['Rabbit','Hamster'],['Moose','Reindeer'],['Bear','Panda'],['Octopus','Squid'],['Spider','Ant']],\n  'Jobs':[['Doctor','Nurse'],['Teacher','Professor'],['Pilot','Flight attendant'],['Chef','Waiter'],['Firefighter','Police officer'],['Dentist','Hairdresser'],['Plumber','Electrician'],['Farmer','Fisher'],['Lawyer','Judge'],['Astronaut','Scientist'],['Actor','Singer'],['Photographer','Painter'],['Bus driver','Taxi driver'],['Postman','Delivery driver']],\n  'Things at home':[['Sofa','Bed'],['Fridge','Freezer'],['Toothbrush','Hairbrush'],['Lamp','Candle'],['Mirror','Window'],['Pillow','Blanket'],['Microwave','Oven'],['Television','Laptop'],['Shower','Bath'],['Vacuum cleaner','Broom'],['Washing machine','Dishwasher'],['Bookshelf','Wardrobe'],['Door','Gate'],['Clock','Calendar']],\n  'Sports & hobbies':[['Football','Rugby'],['Tennis','Badminton'],['Skiing','Snowboarding'],['Swimming','Diving'],['Golf','Mini golf'],['Chess','Checkers'],['Running','Cycling'],['Yoga','Pilates'],['Boxing','Wrestling'],['Fishing','Sailing'],['Bowling','Darts'],['Knitting','Sewing'],['Karaoke','Dancing'],['Climbing','Hiking']],\n  'Things you carry':[['Phone','Wallet'],['Keys','Coins'],['Umbrella','Raincoat'],['Backpack','Suitcase'],['Sunglasses','Glasses'],['Headphones','Speaker'],['Watch','Bracelet'],['Water bottle','Thermos'],['Passport','Ticket'],['Lip balm','Sunscreen'],['Charger','Power bank'],['Notebook','Pen']],\n  'Transport':[['Car','Taxi'],['Bicycle','Scooter'],['Train','Tram'],['Plane','Helicopter'],['Boat','Ferry'],['Bus','Coach'],['Motorbike','Moped'],['Rocket','Satellite'],['Submarine','Yacht'],['Skateboard','Rollerblades'],['Tractor','Truck'],['Hot air balloon','Parachute']],\n  'Party & holidays':[['Birthday','Wedding'],['Christmas','New Year'],['Halloween','Carnival'],['Fireworks','Bonfire'],['Balloon','Confetti'],['Present','Card'],['Cake','Pie'],['Disco','Concert'],['Barbecue','Picnic'],['Holiday','Weekend trip'],['Costume','Mask'],['Toast','Speech']]\n};\nconst CATS=Object.keys(WORDS);\nconst MODES={cat:['The Imposter knows','The Imposter knows they\\'re the Imposter and only sees the category. If they get caught, they can still win by guessing the word.'],\n  sim:['Similar word','The Imposter gets a similar word (Coffee instead of Tea) and doesn\\'t know they\\'re the Imposter. Nobody knows who is.']};\n\nfunction newGame(){return{mode:'cat',rounds:2,oral:0,cats:CATS.slice(),sc:{},used:[]}}\nfunction rulesText(){\n  return `<p>Everyone gets the same secret word, except the <b>Imposter<\/b>.<\/p>\n<p><b>Clues.<\/b> Take turns giving one word that fits the secret word: close enough to show you know it, vague enough that the Imposter can't work it out. The order is on everyone's phone. You go round ${'once, twice or three times'} (the host decides).<\/p>\n<p><b>Vote.<\/b> Then everyone votes for who they think the Imposter is.<\/p>\n<p><b>Two ways to play.<\/b> ${Object.values(MODES).map(m=>`<b>${m[0]}:<\/b> ${m[1]}`).join(' ')}<\/p>\n<p><b>Points.<\/b> The Imposter gets away: Imposter +2. The Imposter is caught but guesses the word: Imposter +1. The Imposter is caught and can't guess it: everyone else +1.<\/p>`;\n}\nfunction hero(){\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 210\" preserveAspectRatio=\"xMidYMid slice\">\n<defs><radialGradient id=\"spot\" cx=\".5\" cy=\"0\" r=\"1\"><stop offset=\"0\" stop-color=\"#f5e663\" stop-opacity=\".55\"/><stop offset=\".6\" stop-color=\"#f5e663\" stop-opacity=\"0\"/><\/radialGradient><\/defs>\n<rect width=\"400\" height=\"210\" fill=\"#10161a\"/><path d=\"M200 -10 L90 210 L310 210 Z\" fill=\"url(#spot)\"/>\n${[60,120,280,340].map(x=>`<g fill=\"#24323a\"><circle cx=\"${x}\" cy=\"118\" r=\"22\"/><path d=\"M${x-36} 210 Q${x-36} 146 ${x} 146 Q${x+36} 146 ${x+36} 210 Z\"/><\/g>`).join('')}\n<g fill=\"#0a0d0f\"><circle cx=\"200\" cy=\"112\" r=\"26\"/><path d=\"M158 210 Q158 140 200 140 Q242 140 242 210 Z\"/><\/g>\n<text x=\"200\" y=\"124\" text-anchor=\"middle\" font-family=\"Bungee,Impact,sans-serif\" font-size=\"34\" fill=\"#f5e663\">?<\/text><\/svg><\/div>`;\n}\nconst isImp=i=>G.imp===i;\nfunction canStart(){const n=G.lob.length;if(n<3)return[false,'Need at least 3 players'];if(!G.cats.length)return[false,'Pick at least one category'];return[true,'']}\nfunction startGame(){\n  const pl=G.lob.map(p=>({i:p.i,n:p.n}));\n  let pool=[];G.cats.forEach(c=>WORDS[c].forEach(w=>pool.push([c,w])));\n  let fresh=pool.filter(x=>!G.used.includes(x[1][0]));if(!fresh.length){G.used=[];fresh=pool}\n  const [cat,w]=pick(fresh),flip=G.mode==='sim'&&Math.random()<.5;\n  const cand=pl.filter(p=>p.i!==G.imp);                         // avoid the same Imposter twice in a row\n  Object.assign(G,{pl,cat,word:flip?w[1]:w[0],alt:flip?w[0]:w[1],imp:pick(cand.length?cand:pl).i,order:shuf(pl.map(p=>p.i)),turn:0,clues:[],ph:'clue',rd:rid(),res:null,gs:null});\n  G.used.push(w[0]);pl.forEach(p=>{if(G.sc[p.i]==null)G.sc[p.i]=0});\n}\nconst myWord=()=>isImp(me.i)?(G.mode==='sim'?G.alt:null):G.word;\nconst cur=()=>G.order[G.turn%G.order.length];\nconst totalTurns=()=>G.rounds*G.order.length;\nfunction gReset(){ui.cw='';ui.gw='';ui.show=false}\nfunction gInput(e){if(e.target.id==='cw')ui.cw=e.target.value;if(e.target.id==='gw')ui.gw=e.target.value}\nconst norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');\n\nfunction gHostTick(){\n  if(G.ph==='clue'){\n    const c=cur(),a=acts[c]&&acts[c].clue;\n    if(a&&a.rd===G.rd&&a.k===G.turn){G.clues.push({i:c,w:String(a.w||'').slice(0,30)});G.turn++}\n    if(G.turn>=totalTurns()){G.ph='vote';G.vrd=rid()}\n  }else if(G.ph==='vote'){\n    const v=G.pl.filter(p=>vote(p.i));G.vd=v.length;\n    if(v.length>=G.pl.length)tally();\n  }else if(G.ph==='guess'){\n    const a=acts[G.imp]&&acts[G.imp].guess;\n    if(a&&a.rd===G.rd&&!G.gs){G.gs={w:String(a.w).slice(0,40),ok:norm(a.w)===norm(G.word)};finish()}\n  }\n}\nconst vote=i=>{const s=acts[i];return s&&s.vote&&s.vote.rd===G.vrd?s.vote:null};\nfunction tally(){\n  const c={};G.pl.forEach(p=>{const v=vote(p.i);if(v&&v.t)c[v.t]=(c[v.t]||0)+1});\n  let top=[],m=0;for(const k in c){if(c[k]>m){m=c[k];top=[k]}else if(c[k]===m)top.push(k)}\n  const out=top.length===1?top[0]:null;\n  G.res={c,out,caught:out===G.imp,vb:Object.fromEntries(G.pl.map(p=>[p.i,(vote(p.i)||{}).t||null]))};\n  if(G.res.caught&&G.mode==='cat'){G.ph='guess';G.rd=rid();return}\n  finish();\n}\nfunction finish(){\n  const r=G.res;\n  if(!r.caught)G.sc[G.imp]=(G.sc[G.imp]||0)+2;\n  else if(G.gs&&G.gs.ok)G.sc[G.imp]=(G.sc[G.imp]||0)+1;\n  else G.pl.forEach(p=>{if(p.i!==G.imp)G.sc[p.i]=(G.sc[p.i]||0)+1});\n  G.ph='end';G.rd=rid();\n}\n\nfunction wordCard(){\n  const w=myWord();\n  if(!ui.show)return `<button class=\"big\" data-a=\"show\">Show my word<\/button>`;\n  return `<div class=\"card word\"><p class=\"mut\">${w?'The secret word':'You are'}<\/p><div class=\"disp\">${w?esc(w):'The Imposter'}<\/div>${w?'':`<p>The category is <b>${esc(G.cat)}<\/b>. Blend in, and try to work out the word.<\/p>`}<p class=\"mut\">Category: ${esc(G.cat)}<\/p><button data-a=\"show\">Hide<\/button><\/div>`;\n}\nfunction orderV(){\n  return card(`<p class=\"mut\">Order \u00b7 round ${Math.min(G.rounds,Math.floor(G.turn/G.order.length)+1)} of ${G.rounds}<\/p><div class=\"chips\">${G.order.map((i,k)=>{const now=G.ph==='clue'&&k===G.turn%G.order.length;return `<span class=\"chip${now?' now':''}\">${esc(nm(i))}<\/span>`}).join('')}<\/div>`);\n}\nfunction cluesV(){\n  if(!G.clues.length)return '';\n  const by={};G.clues.forEach(c=>{(by[c.i]=by[c.i]||[]).push(c.w)});\n  return card(`<p class=\"mut\">Clues so far<\/p>`+G.order.filter(i=>by[i]).map(i=>`<div class=\"row\"><span>${esc(nm(i))}<\/span><b class=\"clue\">${by[i].map(esc).join(' \u00b7 ')}<\/b><\/div>`).join(''));\n}\nfunction scoresV(){\n  const ids=Object.keys(G.sc).filter(i=>G.lob.some(p=>p.i===i)||P(i)).sort((a,b)=>G.sc[b]-G.sc[a]);\n  return ids.length?card(`<p class=\"mut\">Scores<\/p>`+ids.map(i=>`<div class=\"row\"><span>${esc(nm(i))}${i===me.i?' <span class=\"tag\">you<\/span>':''}<\/span><b>${G.sc[i]}<\/b><\/div>`).join('')):'';\n}\nfunction gameScreen(){\n  const p=mine();\n  if(!p)return card(\"<p>A round is under way. You'll be dealt in next round.<\/p>\")+scoresV();\n  let h='';\n  if(G.ph==='clue'){\n    const c=cur(),meNow=c===me.i,a=acts[me.i]&&acts[me.i].clue;\n    h+=`<h2>Clues<\/h2>`+wordCard();\n    if(meNow){\n      h+=G.oral?card(`<p class=\"disp\" style=\"font-size:24px\">Your turn!<\/p><p>Say your clue out loud, then tap Done.<\/p><button class=\"pri big\" data-a=\"clue\">Done<\/button>`)\n        :card(`<p class=\"disp\" style=\"font-size:24px\">Your turn!<\/p><label for=\"cw\">One word that fits ${myWord()?'the secret word':'(bluff!)'}<\/label><input id=\"cw\" maxlength=\"30\" autocomplete=\"off\" value=\"${esc(ui.cw||'')}\" data-enter=\"clue\"><button class=\"pri big\" data-a=\"clue\">Send clue<\/button>`);\n    }else h+=card(`<p>Waiting for ${N(c)} to ${G.oral?'say':'give'} a clue\u2026<\/p>`);\n    h+=orderV()+cluesV();\n    if(me.host)h+=hostCard(`<p>If ${N(c)} is stuck, you can skip them.<\/p><button data-a=\"skip\">${ui.sure==='skip'?'Tap again to skip':'Skip '+esc(nm(c))}<\/button>`);\n  }else if(G.ph==='vote'){\n    const v=vote(me.i);\n    h+=`<h2>Who's the Imposter?<\/h2>`+cluesV();\n    h+=v?card(`<p>You voted for ${N(v.t)}.<\/p><button data-a=\"unvote\">Change my vote<\/button>${prog(G.vd||0,G.pl.length,'voted')}`)\n      :card(`<p><b>Vote for who you think the Imposter is.<\/b><\/p>`+optList(G.pl.map(p=>p.i).filter(i=>i!==me.i),'t')+`<button class=\"pri big\" data-a=\"vote\" ${ui.t?'':'disabled'}>Vote<\/button>`);\n    h+=wordCard();\n    if(me.host)h+=hostCard(`<p>${G.vd||0} of ${G.pl.length} have voted.<\/p><button data-a=\"closevote\">${ui.sure==='closevote'?'Tap again to count the votes now':'Count the votes now'}<\/button>`);\n  }else if(G.ph==='guess'){\n    h+=`<h2>Caught!<\/h2>`+card(`<p>The town caught ${N(G.imp)}, the Imposter. One last chance: if they guess the secret word, they still get a point.<\/p>`);\n    if(isImp(me.i))h+=card(`<label for=\"gw\">What's the secret word? (Category: ${esc(G.cat)})<\/label><input id=\"gw\" maxlength=\"40\" autocomplete=\"off\" value=\"${esc(ui.gw||'')}\" data-enter=\"guess\"><button class=\"pri big\" data-a=\"guess\">Guess<\/button>`);\n    else h+=card(`<p>Waiting for ${N(G.imp)} to guess\u2026<\/p>`);\n    h+=cluesV();\n  }else if(G.ph==='end'){\n    const r=G.res,iw=isImp(me.i);\n    const head=!r.caught?`${N(G.imp)} got away!`:G.gs&&G.gs.ok?`${N(G.imp)} was caught, but guessed the word!`:`The town caught ${N(G.imp)}!`;\n    const iWin=iw?(!r.caught||(G.gs&&G.gs.ok)):(r.caught&&!(G.gs&&G.gs.ok));\n    h+=`<div class=\"win\"><div class=\"disp\">${iWin?'You win':'You lose'}<\/div><p>${head}<\/p><\/div>`;\n    h+=card(`<p>The secret word was <b>${esc(G.word)}<\/b>${G.mode==='sim'?` and the Imposter had <b>${esc(G.alt)}<\/b>`:''}. Category: ${esc(G.cat)}.<\/p>`+\n      (G.gs?`<p>The Imposter guessed \"<b>${esc(G.gs.w)}<\/b>\": ${G.gs.ok?'right!':'wrong.'}<\/p>`:'')+\n      (r.out?'':'<p class=\"mut\">The vote was a tie, so no one was caught.<\/p>'));\n    h+=card(`<p class=\"mut\">The votes<\/p>`+G.pl.map(p=>`<div class=\"row\"><span>${esc(p.n)}${p.i===G.imp?' <span class=\"tag imp\">Imposter<\/span>':''}<\/span><small class=\"mut\">${r.c[p.i]||0} ${plural(r.c[p.i]||0,'vote','votes')}${r.vb[p.i]?' \u00b7 voted '+esc(nm(r.vb[p.i])):''}<\/small><\/div>`).join(''));\n    h+=cluesV()+scoresV();\n    if(me.host){\n      if(G.gs&&!G.gs.ok)h+=hostCard(`<p>Was \"${esc(G.gs.w)}\" close enough?<\/p><button data-a=\"accept\">Count the guess as right<\/button>`);\n      h+=`<button class=\"pri big\" data-a=\"again\">Next round<\/button><button data-a=\"lobby\">Back to the lobby (change settings)<\/button>`;\n    }else h+=card('<p class=\"mut\">Waiting for the host to start the next round\u2026<\/p>');\n  }\n  return h;\n}\nfunction lobbyPlayers(){return lobbyList(i=>G.sc&&G.sc[i]?` <span class=\"tag\">${G.sc[i]} pts<\/span>`:'')}\nfunction lobbyGuest(){return card(`<p><b>${MODES[G.mode][0]}.<\/b> ${MODES[G.mode][1]}<\/p><p class=\"mut\">${G.rounds} ${plural(G.rounds,'round','rounds')} of clues \u00b7 ${G.oral?'clues said out loud':'clues typed on phones'}<\/p>`)}\nfunction lobbySettings(){\n  return card(`<p><b>How the Imposter plays<\/b><\/p><div class=\"list\">`+Object.keys(MODES).map(k=>`<button class=\"opt${G.mode===k?' sel':''}\" data-a=\"mode\" data-r=\"${k}\"><span>${MODES[k][0]}<\/span><small>${G.mode===k?'Selected':''}<\/small><\/button>`).join('')+`<\/div>`+\n    `<div class=\"row\"><span>Rounds of clues<\/span><span class=\"step\"><button data-a=\"rounds\" data-d=\"-1\" aria-label=\"Fewer rounds\">\u2212<\/button><b>${G.rounds}<\/b><button data-a=\"rounds\" data-d=\"1\" aria-label=\"More rounds\">+<\/button><\/span><\/div>`+\n    `<button class=\"opt\" data-a=\"oral\"><span>Clues<\/span><small>${G.oral?'Said out loud':'Typed on phones'}<\/small><\/button>`+\n    `<p style=\"margin-top:14px\"><b>Categories<\/b><\/p><div class=\"list pick\">`+CATS.map(c=>`<button class=\"opt${G.cats.includes(c)?' sel':''}\" data-a=\"cat\" data-r=\"${esc(c)}\"><span>${esc(c)}<\/span><small>${G.cats.includes(c)?'On':'Off'}<\/small><\/button>`).join('')+`<\/div>`)+\n    (Object.keys(G.sc).length?`<button class=\"link\" data-a=\"reset\">Reset the scores<\/button>`:'');\n}\nfunction bodyClass(){return ''}\nfunction gClick(a,b,o){\n  switch(a){\n    case 'show':ui.show=!ui.show;return;\n    case 'clue':{if(cur()!==me.i)return;const w=(ui.cw||'').trim();\n      if(!G.oral){if(!w){toast('Type a clue first.');return}const mw=myWord();if(mw&&norm(w)===norm(mw)){toast(\"You can't use the secret word itself!\");return}}\n      st.clue={rd:G.rd,k:G.turn,w:G.oral?'(said out loud)':w};ui.cw='';return 'push'}\n    case 'vote':if(!ui.t)return;st.vote={rd:G.vrd,t:ui.t};return 'push';\n    case 'unvote':st.vote=null;return 'push';\n    case 'guess':{const w=(ui.gw||'').trim();if(!w){toast('Type your guess first.');return}st.guess={rd:G.rd,w};return 'push'}\n    /* host */\n    case 'skip':if(!o.twice('skip'))return;G.clues.push({i:cur(),w:'(skipped)'});G.turn++;if(G.turn>=totalTurns()){G.ph='vote';G.vrd=rid()}return 'push';\n    case 'closevote':if(!o.twice('closevote'))return;tally();return 'push';\n    case 'accept':if(G.gs&&!G.gs.ok){G.gs.ok=true;G.pl.forEach(p=>{if(p.i!==G.imp)G.sc[p.i]=Math.max(0,(G.sc[p.i]||0)-1)});G.sc[G.imp]=(G.sc[G.imp]||0)+1}return 'push';\n    case 'again':startGame();ui.show=false;return 'push';\n    case 'lobby':G.ph='lobby';G.rd=rid();return 'push';\n    case 'mode':G.mode=o.r;return 'push';\n    case 'rounds':G.rounds=Math.max(1,Math.min(3,G.rounds+(+b.dataset.d)));return 'push';\n    case 'oral':G.oral=G.oral?0:1;return 'push';\n    case 'cat':G.cats=G.cats.includes(o.r)?G.cats.filter(c=>c!==o.r):G.cats.concat(o.r);return 'push';\n    case 'reset':G.sc={};return 'push';\n  }\n}\n\n/* ---------- events ---------- */\napp.addEventListener('input',e=>{\n  if(e.target.id==='rnn')ui.rnn=e.target.value;\n  else if(e.target.id==='sfx')ui.sfxv=e.target.value;\n  else if(e.target.id==='nm')ui.name= ate.now();\n    w.onopen=()=>put(connectPkt());\n    w.onmessage=e=>{if(ws===w)onData(e.data)};\n    w.onerror=()=>{try{w.close()}catch(e){}};\n    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};\n    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again\n  }\n  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep\n    if(closed)return clearInterval(iv);\n    if(!ws)return;\n    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}\n    if(up)put(new Uint8Array([0xC0,0]));\n  },15000);\n  // Coming back to the foreground (or the network changing): the phone may have paused this page and\n  // quietly killed its connection, so messages sent meanwhile never arrived. Ask the relay again for\n  // everything it has stored, check the line answers, and replace it if it doesn't within 4 seconds.\n  let lastWake=0;\n  function wake(){\n    if(closed||document.hidden||Date.now()-lastWake<1500)return;\n    lastWake=Date.now();retry=1500;\n    if(!ws){open();return}\n    if(!up)return;                                 // still connecting; that will fetch everything anyway\n    const mark=Date.now();\n    put(subPkt());put(new Uint8Array([0xC0,0]));\n    o.onUp();\n    setTimeout(()=>{if(!closed&&ws&&lastRx<mark){retry=300;try{ws.close()}catch(e){}}},4000);\n  }\n  document.addEventListener('visibilitychange',wake);\n  window.addEventListener('focus',wake);\n  window.addEventListener('pageshow',wake);\n  window.addEventListener('online',wake);\n  open();\n  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},\n    restart(){if(closed)return;clearTimeout(timer);retry=1500;const w=ws;ws=null;if(up){up=false;o.onDown()}if(w)try{w.close()}catch(e){}open()},\n    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};\n}\n\n/* ---------- connection test ----------\n   For each relay: connect, send a message to ourselves through it and time the round trip.\n   For the direct link: check that PeerJS's introduction server answers. */\nlet netT=null;\nfunction relayTest(relay){return new Promise(res=>{\n  const t0=performance.now(),topic='party-spymasters/v1/test/'+rid(10);let sent=0,done=false,c=null;\n  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};\n  c=miniMqtt(relay,{id:'mft'+rid(10),subs:[topic],will:null,\n    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},\n    onMsg(t,m){if(t===topic&&m==='ping')fin({ok:true,conn:sent-t0,rt:performance.now()-sent})}});\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nfunction peerTest(){return new Promise(res=>{\n  if(!window.Peer)return res({ok:false});\n  const t0=performance.now();let p=null,done=false;\n  const fin=r=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}res(r)};\n  try{p=new Peer(window.MAFIA_PEER_OPTS||{})}catch(e){return fin({ok:false})}\n  p.on('open',()=>fin({ok:true,conn:performance.now()-t0}));p.on('error',()=>fin({ok:false}));\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nasync function runNetTest(){\n  if(netT&&netT.busy)return;\n  netT={busy:true,r:RELAYS.map(()=>null),p:null};render();\n  const jobs=RELAYS.map((u,k)=>relayTest(u).then(x=>{netT.r[k]=x;render()}));\n  jobs.push(peerTest().then(x=>{netT.p=x;render()}));\n  await Promise.all(jobs);netT.busy=false;render();\n}\nconst secs=ms=>(ms/1000).toFixed(ms<1000?2:1)+' s';\nfunction netV(){\n  const t=netT||{busy:true,r:[],p:null};\n  const row=(name,x,okText)=>`<div class=\"row\"><span><i class=\"dot ${x&&x.ok?'on':''}\"><\/i>${name}<\/span><small class=\"${x&&!x.ok?'err':'mut'}\" style=\"white-space:nowrap\">${!x?'Testing\u2026':x.ok?okText(x):'Not reachable'}<\/small><\/div>`;\n  const rows=RELAYS.map((u,k)=>row(`Relay ${k+1}${u.name?' ('+u.name+')':''}`,t.r[k],x=>`Works \u00b7 ${secs(x.rt)}`)).join('')\n    +row('Direct link',t.p,x=>'Works');\n  const relOk=t.r.filter(x=>x&&x.ok).length;\n  let verdict='';\n  if(!t.busy){\n    verdict=relOk===RELAYS.length?`<p><b>Good to go.<\/b> This phone can reach all ${RELAYS.length} relays, so it can host or join a game.<\/p>`\n      :relOk>0?`<p><b>Good to go.<\/b> ${relOk} of ${RELAYS.length} relays work here. One is enough to play.<\/p>`\n      :t.p&&t.p.ok?`<p class=\"err\">None of the relays work on this network.<\/p><p class=\"mut\">The game can still try the direct link, but that often fails. Try switching this phone to mobile data, or another Wi-Fi.<\/p>`\n      :`<p class=\"err\">This phone can't reach any of the game's servers.<\/p><p class=\"mut\">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.<\/p>`;\n  }\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='party-spymasters/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='party-spymasters-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes\n  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.\n  if(me.host){\n    let tick=Date.now();\n    setInterval(()=>{\n      const now=Date.now();\n      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging\n      tick=now;\n      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;\n      for(const id in players){\n        if(id===me.i)continue;\n        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}\n      }\n    },30e3);\n  }\n  function fromHost(d){\n    if(!d||!d.g||(last.g&&d.q<=last.g))return;\n    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay\n    last.g=d.q;gotG=true;onNet(null,d.g);status();\n  }\n\n  RELAYS.forEach((relay,k)=>{\n    const src='r'+k;\n    const r=miniMqtt(relay,{\n      id:'mf'+rid(12),\n      subs:[me.host?base+'/p/+':base+'/g'],\n      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true);\n        if(byeDone){const f=byeDone;byeDone=null;setTimeout(f,400)}},   // the goodbye went out on a working connection\n      onDown(){status()},\n      onMsg(t,s,stored){\n        if(me.host){\n          // A brand-new game: anything stored from before it was created belongs to an old game with this word. Wipe n out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- common screens ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall t:0,wins:{r:0,b:0}}}\nfunction rulesText(){\n  return `<p>Two teams, <b class=\"tr\">Red<\/b> and <b class=\"tb\">Blue<\/b>. Each team has one <b>spymaster<\/b>; everyone else is a guesser.<\/p>\n<p>Every phone shows the same 25 code words. Only the spymasters see which words belong to which team, which are neutral bystanders, and which one is the <b>assassin<\/b>.<\/p>\n<p><b>On your team's turn<\/b>, your spymaster gives a one-word clue and a number: how many words it fits. For example \"Ocean 2\" for WHALE and SHIP. The guessers talk it over and tap words on their phones. A right guess lets you keep going, up to the number plus one. A neutral word or the other team's word ends your turn. The assassin loses the game at once.<\/p>\n<p><b>The first team to find all its words wins.<\/b> The team that starts has 9 words; the other has 8.<\/p>`;\n}\nfunction hero(){\n  const g=[];for(let y=0;y<4;y++)for(let x=0;x<7;x++){const c=['#c6372f','#2b62b8','#e4d7b9','#e4d7b9'][(x*3+y*5)%4],r=(x+y)%7===3;g.push(`<rect x=\"${18+x*54}\" y=\"${28+y*42}\" width=\"46\" height=\"32\" rx=\"5\" fill=\"${r?'#1d1a16':c}\" opacity=\"${c==='#e4d7b9'&&!r?.9:1}\"/>`)}\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 210\" preserveAspectRatio=\"xMidYMid slice\"><rect width=\"400\" height=\"210\" fill=\"#efe6d2\"/>${g.join('')}<rect y=\"200\" width=\"400\" height=\"10\" fill=\"#1d1a16\"/><\/svg><\/div>`;\n}\nconst team=i=>G.tm[i]||null;\nconst isSM=i=>G.sm.r===i||G.sm.b===i;\nfunction canStart(){\n  const n=G.lob.length,r=G.lob.filter(p=>team(p.i)==='r'),b=G.lob.filter(p=>team(p.i)==='b');\n  if(n<4)return[false,'Need at least 4 players'];\n  if(r.length<2||b.length<2)return[false,'Each team needs at least 2 players'];\n  if(!G.sm.r||!G.sm.b)return[false,'Each team needs a spymaster'];\n  return[true,''];\n}\n/* lobby: everyone picks a team and can volunteer as spymaster; the host can shuffle */\nfunction gLobbyTick(){\n  const ids=G.lob.map(p=>p.i);\n  Object.keys(G.
