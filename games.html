stringify([st,me.host?G:0]);if(s===lastSent)return;lastSent=s;net.send()}\nfunction push(){sv('st',st);if(me.host)hostTick();else sendNet();onGame();render()}\nfunction onNet(map,g){if(me.host){if(map)players=map;hostTick()}else if(g){G=g}onGame();render()}\nfunction onGame(){\n  if(!G)return;\n  if(!me.host&&G.kk&&G.kk.includes(me.i)&&me.code){try{sessionStorage.setItem(KEY+'kicked',JSON.stringify({c:G.code||me.code,n:me.n}))}catch(e){}leave();return}\n  if(G.rd!==lastRd){lastRd=G.rd;ui.t=null;ui.sure='';gReset()}\n}\nfunction setConn(c){conn=c;if(c)err='';render()}\nfunction fail(m){err=m;render()}\nfunction connect(){\n  setTimeout(()=>{if(!conn&&!G)fail(\"Still can't reach the game. Check the code, and that the host's phone has this page open.\")},15000);\n  try{net=mixNet();lastSent='';sendNet()}catch(e){fail(\"This page couldn't open a live connection here. Check your internet connection and try again.\")}\n}\n/* ---------- network: two relays + a direct link ----------\n   Every message goes three ways at once: through two public relay servers (MQTT over secure\n   WebSocket, which works on any Wi-Fi or mobile network, like loading a web page) and over a\n   direct PeerJS link when the networks allow one. Whichever copy arrives first counts; messages\n   are numbered, so the extra copies are ignored. */\n// Four free public relays run by four different organisations. The last two use the normal\n// web port (443), so they also get through strict Wi-Fi that blocks the first two.\nconst RELAYS=(window.MAFIA_RELAYS||[\n  {name:'HiveMQ',url:'wss://broker.hivemq.com:8884/mqtt'},\n  {name:'EMQX',url:'wss://broker.emqx.io:8084/mqtt'},\n  {name:'Eclipse',url:'wss://mqtt.eclipseprojects.io/mqtt'},\n  {name:'shiftr.io',url:'wss://public.cloud.shiftr.io/',user:'public',pass:'public'}\n]).map(r=>typeof r==='string'?{url:r}:r);\nconst te8=new TextEncoder(),td8=new TextDecoder();\nfunction cat(a){let n=0;for(const p of a)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of a){o.set(p,k);k+=p.length}return o}\nconst u16=n=>new Uint8Array([n>>8&255,n&255]);\nconst mstr=s=>{const b=te8.encode(s);return cat([u16(b.length),b])};\nconst vlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return new Uint8Array(o)};\nconst mpkt=(h,b)=>cat([new Uint8Array([h]),vlen(b.length),b]);\n\n/* A small MQTT 3.1.1 client: connect, subscribe, publish (QoS 0, optionally retained),\n   a \"last will\" message, keep-alive, and reconnecting after sleep or network changes. */\nfunction miniMqtt(relay,o){\n  const url=relay.url;\n  let ws=null,buf=new Uint8Array(0),up=false,timer=null,retry=1500,pid=1,lastRx=0,closed=false;\n  const put=b=>{try{if(ws&&ws.readyState===1)ws.send(b)}catch(e){}};\n  const subPkt=()=>mpkt(0x82,cat([u16(pid++),...o.subs.map(s=>cat([mstr(s),new Uint8Array([0])]))]));\n  const connectPkt=()=>mpkt(0x10,cat([mstr('MQTT'),\n    new Uint8Array([4,2|(o.will?4|32:0)|(relay.user!=null?128:0)|(relay.pass!=null?64:0)]),u16(30),mstr(o.id),\n    ...(o.will?[mstr(o.will),u16(0)]:[]),\n    ...(relay.user!=null?[mstr(relay.user)]:[]),...(relay.pass!=null?[mstr(relay.pass)]:[])]));\n  function onData(d){\n    lastRx=Date.now();\n    buf=cat([buf,new Uint8Array(d)]);\n    for(;;){\n      if(buf.length<2)return;\n      let i=1,v=0,m=1,b;\n      do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128}while(b&128);\n      if(buf.length<i+v)return;\n      const h=buf[0],body=buf.slice(i,i+v);buf=buf.slice(i+v);\n      const t=h>>4;\n      if(t===2){                                   // CONNACK\n        if(body[1]!==0){try{ws.close()}catch(e){}return}\n        up=true;retry=1500;\n        put(subPkt());\n        o.onUp();\n      }else if(t===3){                             // PUBLISH\n        const tl=body[0]<<8|body[1];let k=2+tl;if((h>>1)&3)k+=2;\n        o.onMsg(td8.decode(body.subarray(2,2+tl)),td8.decode(body.subarray(k)),(h&1)===1);\n      }\n    }\n  }\n  function later(){clearTimeout(timer);timer=setTimeout(open,retry);retry=Math.min(retry*2,15000)}\n  function open(){\n    clearTimeout(timer);if(closed)return;\n    let w;try{w=ws=new WebSocket(url,['mqtt'])}catch(e){ws=null;return later()}\n    w.binaryType='arraybuffer';buf=new Uint8Array(0);lastRx=Date.now();\n    w.onopen=()=>put(connectPkt());\n    w.onmessage=e=>{if(ws===w)onData(e.data)};\n    w.onerror=()=>{try{w.close()}catch(e){}};\n    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};\n    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again\n  }\n  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep\n    if(closed)return clearInterval(iv);\n    if(!ws)return;\n    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}\n    if(up)put(new Uint8Array([0xC0,0]));\n  },15000);\n  // Coming back to the foreground (or the network changing): the phone may have paused this page and\n  // quietly killed its connection, so messages sent meanwhile never arrived. Ask the relay again for\n  // everything it has stored, check the line answers, and replace it if it doesn't within 4 seconds.\n  let lastWake=0;\n  function wake(){\n    if(closed||document.hidden||Date.now()-lastWake<1500)return;\n    lastWake=Date.now();retry=1500;\n    if(!ws){open();return}\n    if(!up)return;                                 // still connecting; that will fetch everything anyway\n    const mark=Date.now();\n    put(subPkt());put(new Uint8Array([0xC0,0]));\n    o.onUp();\n    setTimeout(()=>{if(!closed&&ws&&lastRx<mark){retry=300;try{ws.close()}catch(e){}}},4000);\n  }\n  document.addEventListener('visibilitychange',wake);\n  window.addEventListener('focus',wake);\n  window.addEventListener('pageshow',wake);\n  window.addEventListener('online',wake);\n  open();\n  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},\n    restart(){if(closed)return;clearTimeout(timer);retry=1500;const w=ws;ws=null;if(up){up=false;o.onDown()}if(w)try{w.close()}catch(e){}open()},\n    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};\n}\n\n/* ---------- connection test ----------\n   For each relay: connect, send a message to ourselves through it and time the round trip.\n   For the direct link: check that PeerJS's introduction server answers. */\nlet netT=null;\nfunction relayTest(relay){return new Promise(res=>{\n  const t0=performance.now(),topic='party-scribble/v1/test/'+rid(10);let sent=0,done=false,c=null;\n  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};\n  c=miniMqtt(relay,{id:'mft'+rid(10),subs:[topic],will:null,\n    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},\n    onMsg(t,m){if(t===topic&&m==='ping')fin({ok:true,conn:sent-t0,rt:performance.now()-sent})}});\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nfunction peerTest(){return new Promise(res=>{\n  if(!window.Peer)return res({ok:false});\n  const t0=performance.now();let p=null,done=false;\n  const fin=r=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}res(r)};\n  try{p=new Peer(window.MAFIA_PEER_OPTS||{})}catch(e){return fin({ok:false})}\n  p.on('open',()=>fin({ok:true,conn:performance.now()-t0}));p.on('error',()=>fin({ok:false}));\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nasync function runNetTest(){\n  if(netT&&netT.busy)return;\n  netT={busy:true,r:RELAYS.map(()=>null),p:null};render();\n  const jobs=RELAYS.map((u,k)=>relayTest(u).then(x=>{netT.r[k]=x;render()}));\n  jobs.push(peerTest().then(x=>{netT.p=x;render()}));\n  await Promise.all(jobs);netT.busy=false;render();\n}\nconst secs=ms=>(ms/1000).toFixed(ms<1000?2:1)+' s';\nfunction netV(){\n  const t=netT||{busy:true,r:[],p:null};\n  const row=(name,x,okText)=>`<div class=\"row\"><span><i class=\"dot ${x&&x.ok?'on':''}\"><\/i>${name}<\/span><small class=\"${x&&!x.ok?'err':'mut'}\" style=\"white-space:nowrap\">${!x?'Testing\u2026':x.ok?okText(x):'Not reachable'}<\/small><\/div>`;\n  const rows=RELAYS.map((u,k)=>row(`Relay ${k+1}${u.name?' ('+u.name+')':''}`,t.r[k],x=>`Works \u00b7 ${secs(x.rt)}`)).join('')\n    +row('Direct link',t.p,x=>'Works');\n  const relOk=t.r.filter(x=>x&&x.ok).length;\n  let verdict='';\n  if(!t.busy){\n    verdict=relOk===RELAYS.length?`<p><b>Good to go.<\/b> This phone can reach all ${RELAYS.length} relays, so it can host or join a game.<\/p>`\n      :relOk>0?`<p><b>Good to go.<\/b> ${relOk} of ${RELAYS.length} relays work here. One is enough to play.<\/p>`\n      :t.p&&t.p.ok?`<p class=\"err\">None of the relays work on this network.<\/p><p class=\"mut\">The game can still try the direct link, but that often fails. Try switching this phone to mobile data, or another Wi-Fi.<\/p>`\n      :`<p class=\"err\">This phone can't reach any of the game's servers.<\/p><p class=\"mut\">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.<\/p>`;\n  }\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='party-scribble/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='party-scribble-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes\n  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.\n  if(me.host){\n    let tick=Date.now();\n    setInterval(()=>{\n      const now=Date.now();\n      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging\n      tick=now;\n      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;\n      for(const id in players){\n        if(id===me.i)continue;\n        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}\n      }\n    },30e3);\n  }\n  function fromHost(d){\n    if(!d||!d.g||(last.g&&d.q<=last.g))return;\n    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay\n    last.g=d.q;gotG=true;onNet(null,d.g);status();\n  }\n\n  RELAYS.forEach((relay,k)=>{\n    const src='r'+k;\n    const r=miniMqtt(relay,{\n      id:'mf'+rid(12),\n      subs:[me.host?base+'/p/+':base+'/g'],\n      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true);\n        if(byeDone){const f=byeDone;byeDone=null;setTimeout(f,400)}},   // the goodbye went out on a working connection\n      onDown(){status()},\n      onMsg(t,s,stored){\n        if(me.host){\n          // A brand-new game: anything stored from before it was created belongs to an old game with this word. Wipe it.\n          if(stored&&freshGame&&s){let d=null;try{d=JSON.parse(s)}catch(e){}\n            if(!d||!d.t||d.t<freshGame-2000){r.pub(t,'',true);return}}\n          if(!s)return;\n          try{fromPlayer(src,JSON.parse(s),stored)}catch(e){}\n        }else if(s){try{fromHost(JSON.parse(s))}catch(e){}}\n      }\n    });\n    relays.push(r);\n  });\n\n  if(window.Peer)try{\n    if(me.host){\n      let p,wait=2500;\n      const start=()=>{\n        p=new Peer(hid,PO);\n        p.on('open',()=>{wait=2500;peerUp=true;status()});\n        p.on('connection',c=>{\n          c.on('open',()=>{conns.add(c);if(env)try{c.send(env)}catch(e){}});\n          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});\n          c.on('close',()=>conns.delete(c));\n        });\n        p.on('error',e=>{\n          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}\n            setTimeout(start,wait);wait=Math.min(wait*2,30000)}\n        });\n        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});\n      };\n      start();\n    }else{\n      const p=new Peer(PO);let rt=null,wait=2500;\n      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};\n      const dial=()=>{\n        if(p.destroyed)return;\n        if(p.disconnected){try{p.reconnect()}catch(e){}}\n        if(pc){try{pc.close()}catch(e){}}\n        const cc=pc=p.connect(hid,{reliable:true});\n        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);\n        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});\n        cc.on('data',d=>{if(pc===cc)fromHost(d)});\n        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});\n      };\n      p.on('open',dial);\n      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});\n    }\n  }catch(e){}\n\n  function out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- common screens ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall)\" */\nconst fullName=s=>{const o=G&&G.nmx&&G.nmx[s.i],b=String(o||s.n).slice(0,16),x=G&&G.sfx&&G.sfx[s.i];return x?b+' '+x:b};\nfunction sfxV(){\n  const i=ui.sfxFor;if(!i||!me.host||!G||G.ph!=='lobby')return '';\n  const pl=players[i]||{i},base=String(pl.n||'this player').slice(0,16),now=fullName(pl),changed=(G.sfx&&G.sfx[i])||(G.nmx&&G.nmx[i]);\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sfh\"><div class=\"card\"><p id=\"sfh\" class=\"disp\" style=\"font-size:24px\">Change ${esc(base)}'s name<\/p><p class=\"mut\">Shown on everyone's phone as: <b>${esc(now)}<\/b><\/p><label for=\"sfx\">New text<\/label><input id=\"sfx\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.sfxv==null?'':ui.sfxv)}\" placeholder=\"e.g. Ben, or (red jumper)\"><button class=\"pri big\" data-a=\"sfxs\">Add to the end of the name<\/button><button class=\"pri big\" data-a=\"sfxr\">Replace the whole name<\/button>${changed?`<button data-a=\"sfxd\">Go back to \"${esc(base)}\"<\/button>`:''}<button data-a=\"sfxc\">Cancel<\/button><\/div><\/div>`;\n}\n\nfunction rnClean(){if(G&&G.rn)for(const k in G.rn){const s=acts[k];if(!players[k]||(s&&(s.rnd||0)>=G.rn[k]))delete G.rn[k]}}\nfunction homeV(){\n  return hero()+`<a class=\"homelink\" href=\"./\">\u2190 Home<\/a><h1>${CFG.title}<\/h1>${ui.notice?`<p class=\"err\">${esc(ui.notice)}<\/p>`:''}${ui.rejoin?`<button class=\"pri\" data-a=\"rejoin\">Join game ${esc(ui.rejoin.c)} again<\/button>`:''}\n<p class=\"mut\">${CFG.blurb}<\/p>\n<button class=\"pri big\" data-a=\"start\">Join a game<\/button>\n<button data-a=\"hostnew\">Host a new game<\/button>\n<button class=\"link\" data-a=\"nettest\">Test connection: can this phone reach the servers?<\/button>\n<detai \/p><div class=\"code\">${esc(G.code)}<\/div>`)+h+lobbyGuest();\n  const [ok,msg]=canStart();\n  return h+lobbySettings()+`<button class=\"pri big\" data-a=\"go\" ${ok?'':'disabled'}>${ok?CFG.startText:esc(msg)}<\/button>`;\n}\nfunction helpV(){return `<h2>How to play<\/h2>`+card(rulesText())+`<button class=\"pri big\" data-a=\"help\">Back to the game<\/button>`}\nfunction gameV(){\n  if(ui.leaving)return card('<p><b>Leaving the game\u2026<\/b><\/p><p class=\"mut\">Telling the host you left.<\/p>');\n  let h=bar()+renameV()+sfxV();\n  if(ui.help)return h+helpV();\n  if(!G)return h+card(`<p>${conn?'Connected. Waiting for the host\u2026':'Connecting to game '+esc(me.code)+'\u2026'}<\/p>`+(err?`<p class=\"err\">${esc(err)}<\/p>`:''));\n  if(err)h+=`<p class=\"err\">${esc(err)}<\/p>`;\n  if(G.ph==='lobby')return h+lobbyV();\n  return h+gameScreen()+`<button class=\"link\" data-a=\"help\">How to play<\/button>`;\n}\nfunction render(){\n  if(typeof beforeRender==='function'&&beforeRender()===false)return;\n  document.body.className=bodyClass();\n  const h=ui.scr==='home'?homeV():ui.scr==='join'?joinV():ui.scr==='nettest'?netV():gameV();\n  if(h!==lastHtml){\n    // keep the cursor in a text box that is being typed in while other players' updates arrive\n    const f=document.activeElement,fid=f&&app.contains(f)&&f.id?f.id:null,s0=fid&&f.selectionStart!=null?[f.selectionStart,f.selectionEnd]:null;\n    const y=window.scrollY;app.innerHTML=h;lastHtml=h;window.scrollTo(0,y);\n    if(fid){const g=document.getElementById(fid);if(g){try{g.focus({preventScroll:true});if(s0)g.setSelectionRange(s0[0],s0[1])}catch(e){}}}\n    if(typeof afterRender==='function')afterRender()}\n}\nfunction toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}\nfunction kickPlayer(id){if(!me.host||!G||G.ph!=='lobby'||id===me.i)return;G.kk=(G.kk||[]).concat(id);const m=Object.assign({},players);delete m[id];onNet(m,null)}\nfunction enter(){st={i:me.i,n:me.n};ui.scr='game';err='';lastSent='';render();connect();wake()}\nfunction leave(){\n  if(ui.leaving)return;\n  let p=null;if(net&&net.bye&&!me.host)try{p=net.bye()}catch(e){}\n  me.code='';me.host=false;saveMe();\n  const go=()=>{try{location.reload()}catch(e){}};\n  if(p){ui.leaving=true;render();p.then(go,go)}else go();\n}\n\n/* ---------- Scribble Phone: write, draw, guess, pass it on ---------- */\nconst IDEAS=['A cat stuck in a tree','Grandma on a skateboard','A shark at a birthday party','The moon eating cheese','A snowman in the desert','A dog driving a bus','Pirates having a picnic','A robot falling in love','A giraffe in a lift','Breakfast in bed','A ghost doing yoga','An elephant hiding behind a lamp','A wizard who lost his hat','A penguin on holiday','Aliens stealing a cow','A dragon at the dentist','The world\\'s longest sandwich','A cowboy riding a chicken','Too many cooks','A haunted fridge','Fishing for compliments','A king with a cold','A snail winning a race','Dinosaur in the bath','A very tired superhero','Mermaid at the gym','Pizza falling from the sky','A tiny horse in a big car','Spider knitting a scarf','Sunburnt vampire','Frog prince on a phone','A bank robbery by squirrels','The last slice of cake','Cat walking a human','A volcano making popcorn','An octopus juggling','Monday morning','A sheep counting people','Banana in sunglasses','Teacher on a rollercoaster','A troll under a motorway','The Viking who forgot his boat','Moose in a sauna','Ski jump gone wrong','Waffles in space','A queue for the toilet','Hide and seek champion','The world\\'s worst haircut','A tree growing money','Party in a submarine'];\nconst COLS=['#1b1b1f','#e03131','#f08c00','#f2c600','#2f9e44','#1c7ed6','#7048e8','#8d5a2b','#ffffff'];\nconst WID=[7,16,34];\nconst AB='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';\nconst TIMES=[0,60,90,120];\nObject.assign(ui,{dr:[],col:0,wid:1,t0:Date.now()});\nlet book=null;                          // host only: every chain, every step (kept off the network until the reveal)\nfunction hostBoot(){book=ld('book',null)}\nfunction newGame(){return{tl:90,gid:null}}\nfunction rulesText(){\n  return `<p>Everyone writes a funny sentence. Each phone then passes it on: the next player <b>draws<\/b> it, the next <b>guesses<\/b> what the drawing shows, the next draws that guess, and so on until it has been round the whole group.<\/p>\n<p>At the end, the host shows each chain step by step on everyone's phone. Expect \"a cat in a tree\" to turn into something very different.<\/p>\n<p>3 to 12 players. You never see what's coming until it's your turn, and you only ever see the step just before yours.<\/p>`;\n}\nfunction hero(){\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 210\" preserveAspectRatio=\"xMidYMid slice\"><rect width=\"400\" height=\"210\" fill=\"#fffdf7\"/>\n<g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M40 150 C60 70 120 60 140 120 S220 170 230 90\" stroke=\"#1c7ed6\" stroke-width=\"9\"/>\n<circle cx=\"300\" cy=\"80\" r=\"38\" stroke=\"#f2c600\" stroke-width=\"10\"/>\n<path d=\"M270 160 l20 -30 l20 30 z\" stroke=\"#e03131\" stroke-width=\"8\"/><path d=\"M70 40 q20 20 40 0 t40 0\" stroke=\"#2f9e44\" stroke-width=\"7\"/>\n<path d=\"M330 150 l40 -40\" stroke=\"#1b1b1f\" stroke-width=\"6\"/><path d=\"M330 190 l40 -40\" stroke=\"#7048e8\" stroke-width=\"6\"/><\/g>\n<rect y=\"200\" width=\"400\" height=\"10\" fill=\"#1b1b1f\"/><\/svg><\/div>`;\n}\nfunction canStart(){const n=G.lob.length;if(n<3)return[false,'Need at least 3 players'];if(n>12)return[false,'At most 12 players'];return[true,'']}\nconst kindOf=s=>s===0?'write':s%2?'draw':'guess';\nfunction startGame(){\n  const order=shuf(G.lob.map(p=>p.i));\n  Object.assign(G,{pl:G.lob.filter(p=>order.includes(p.i)).map(p=>({i:p.i,n:p.n})),order,n:order.length,step:0 ill can't reach the game. Check the code, and that the host's phone has this page open.\")},15000);\n  try{net=mixNet();lastSent='';sendNet()}catch(e){fail(\"This page couldn't open a live connection here. Check your internet connection and try again.\")}\n}\n/* ---------- network: two relays + a direct link ----------\n   Every message goes three ways at once: through two public relay servers (MQTT over secure\n   WebSocket, which works on any Wi-Fi or mobile network, like loading a web page) and over a\n   direct PeerJS link when the networks allow one. Whichever copy arrives first counts; messages\n   are numbered, so the extra copies are ignored. */\n// Four free public relays run by four different organisations. The last two use the normal\n// web port (443), so they also get through strict Wi-Fi that blocks the first two.\nconst RELAYS=(window.MAFIA_RELAYS||[\n  {name:'HiveMQ',url:'wss://broker.hivemq.com:8884/mqtt'},\n  {name:'EMQX',url:'wss://broker.emqx.io:8084/mqtt'},\n  {name:'Eclipse',url:'wss://mqtt.eclipseprojects.io/mqtt'},\n  {name:'shiftr.io',url:'wss://public.cloud.shiftr.io/',user:'public',pass:'public'}\n]).map(r=>typeof r==='string'?{url:r}:r);\nconst te8=new TextEncoder(),td8=new TextDecoder();\nfunction cat(a){let n=0;for(const p of a)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of a){o.set(p,k);k+=p.length}return o}\nconst u16=n=>new Uint8Array([n>>8&255,n&255]);\nconst mstr=s=>{const b=te8.encode(s);return cat([u16(b.length),b])};\nconst vlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return new Uint8Array(o)};\nconst mpkt=(h,b)=>cat([new Uint8Array([h]),vlen(b.length),b]);\n\n/* A small MQTT 3.1.1 client: connect, subscribe, publish (QoS 0, optionally retained),\n   a \"last will\" message, keep-alive, and reconnecting after sleep or network changes. */\nfunction miniMqtt(relay,o){\n  const url=relay.url;\n  let ws=null,buf=new Uint8Array(0),up=false,timer=null,retry=1500,pid=1,lastRx=0,closed=false;\n  const put=b=>{try{if(ws&&ws.readyState===1)ws.send(b)}catch(e){}};\n  const subPkt=()=>mpkt(0x82,cat([u16(pid++),...o.subs.map(s=>cat([mstr(s),new Uint8Array([0])]))]));\n  const connectPkt=()=>mpkt(0x10,cat([mstr('MQTT'),\n    new Uint8Array([4,2|(o.will?4|32:0)|(relay.user!=null?128:0)|(relay.pass!=null?64:0)]),u16(30),mstr(o.id),\n    ...(o.will?[mstr(o.will),u16(0)]:[]),\n    ...(relay.user!=null?[mstr(relay.user)]:[]),...(relay.pass!=null?[mstr(relay.pass)]:[])]));\n  function onData(d){\n    lastRx=Date.now();\n    buf=cat([buf,new Uint8Array(d)]);\n    for(;;){\n      if(buf.length<2)return;\n      let i=1,v=0,m=1,b;\n      do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128}while(b&128);\n      if(buf.length<i+v)return;\n      const h=buf[0],body=buf.slice(i,i+v);buf=buf.slice(i+v);\n      const t=h>>4;\n      if(t===2){                                   // CONNACK\n        if(body[1]!==0){try{ws.close()}catch(e){}return}\n        up=true;retry=1500;\n        put(subPkt());\n        o.onUp();\n      }else if(t===3){                             // PUBLISH\n        const tl=body[0]<<8|body[1];let k=2+tl;if((h>>1)&3)k+=2;\n        o.onMsg(td8.decode(body.subarray(2,2+tl)),td8.decode(body.subarray(k)),(h&1)===1);\n      }\n    }\n  }\n  function later(){clearTimeout(timer);timer=setTimeout(open,retry);retry=Math.min(retry*2,15000)}\n  function open(){\n    clearTimeout(timer);if(closed)return;\n    let w;try{w=ws=new WebSocket(url,['mqtt'])}catch(e){ws=null;return later()}\n    w.binaryType='arraybuffer';buf=new Uint8Array(0);lastRx=Date.now();\n    w.onopen=()=>put(connectPkt());\n    w.onmessage=e=>{if(ws===w)onData(e.data)};\n    w.onerror=()=>{try{w.close()}catch(e){}};\n    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};\n    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again\n  }\n  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep\n    if(closed)return clearInterval(iv);\n    if(!ws)return;\n    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}\n    if(up)put(new Uint8Array([0xC0,0]));\n  },15000);\n  // Coming back to the foreground (or the network changing): the phone may have paused this page and\n  // quietly killed its connection, so messages sent meanwhile never arrived. Ask the relay again for\n  // everything it has stored, check the line answers, and replace it if it doesn't within 4 seconds.\n  let lastWake=0;\n  function wake(){\n    if(closed||document.hidden||Date.now()-lastWake<1500)return;\n    lastWake=Date.now();retry=1500;\n    if(!ws){open();return}\n    if(!up)return;                                 // still connecting; that will fetch everything anyway\n    const mark=Date.now();\n    put(subPkt());put(new Uint8Array([0xC0,0]));\n    o.onUp();\n    setTimeout(()=>{if(!closed&&ws&&lastRx<mark){retry=300;try{ws.close()}catch(e){}}},4000);\n  }\n  document.addEventListener('visibilitychange',wake);\n  window.addEventListener('focus',wake);\n  window.addEventListener('pageshow',wake);\n  window.addEventListener('online',wake);\n  open();\n  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},\n    restart(){if(closed)return;clearTimeout(timer);retry=1500;const w=ws;ws=null;if(up){up=false;o.onDown()}if(w)try{w.close()}catch(e){}open()},\n    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};\n}\n\n/* ---------- connection test ----------\n   For each relay: connect, send a message to ourselves through it and time the round trip.\n   For the direct link: check that PeerJS's introduction server answers. */\nlet netT=null;\nfunction relayTest(relay){return new Promise(res=>{\n  const t0=performance.now(),topic='party-whoami/v1/test/'+rid(10);let sent=0,done=false,c=null;\n  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};\n  c=miniMqtt(relay,{id:'mft'+rid(10),subs:[topic],will:null,\n    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},\n    onMsg(t,m){if(t===topic&&m==='ping')fin({ok:true,conn:sent-t0,rt:performance.now()-sent})}});\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nfunction peerTest(){return new Promise(res=>{\n  if(!window.Peer)return res({ok:false});\n  const t0=performance.now();let p=null,done=false;\n  const fin=r=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}res(r)};\n  try{p=new Peer(window.MAFIA_PEER_OPTS||{})}catch(e){return fin({ok:false})}\n  p.on('open',()=>fin({ok:true,conn:performance.now()-t0}));p.on('error',()=>fin({ok:false}));\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nasync function runNetTest(){\n  if(netT&&netT.busy)return;\n  netT={busy:true,r:RELAYS.map(()=>null),p:null};render();\n  const jobs=RELAYS.map((u,k)=>relayTest(u).then(x=>{netT.r[k]=x;render()}));\n  jobs.push(peerTest().then(x=>{netT.p=x;render()}));\n  await Promise.all(jobs);netT.busy=false;render();\n}\nconst secs=ms=>(ms/1000).toFixed(ms<1000?2:1)+' s';\nfunction netV(){\n  const t=netT||{busy:true,r:[],p:null};\n  const row=(name,x,okText)=>`<div class=\"row\"><span><i class=\"dot ${x&&x.ok?'on':''}\"><\/i>${name}<\/span><small class=\"${x&&!x.ok?'err':'mut'}\" style=\"white-space:nowrap\">${!x?'Testing\u2026':x.ok?okText(x):'Not reachable'}<\/small><\/div>`;\n  const rows=RELAYS.map((u,k)=>row(`Relay ${k+1}${u.name?' ('+u.name+')':''}`,t.r[k],x=>`Works \u00b7 ${secs(x.rt)}`)).join('')\n    +row('Direct link',t.p,x=>'Works');\n  const relOk=t.r.filter(x=>x&&x.ok).length;\n  let verdict='';\n  if(!t.busy){\n    verdict=relOk===RELAYS.length?`<p><b>Good to go.<\/b> This phone can reach all ${RELAYS.length} relays, so it can host or join a game.<\/p>`\n      :relOk>0?`<p><b>Good to go.<\/b> ${relOk} of ${RELAYS.length} relays work here. One is enough to play.<\/p>`\n      :t.p&&t.p.ok?`<p class=\"err\">None of the relays work on this network.<\/p><p class=\"mut\">The game can still try the direct link, but that often fails. Try switching this phone to mobile data, or another Wi-Fi.<\/p>`\n      :`<p class=\"err\">This phone can't reach any of the game's servers.<\/p><p class=\"mut\">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.<\/p>`;\n  }\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='party-whoami/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='party-whoami-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes\n  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.\n  if(me.host){\n    let tick=Date.now();\n    setInterval(()=>{\n      const now=Date.now();\n      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging\n      tick=now;\n      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;\n      for(const id in players){\n        if(id===me.i)continue;\n        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}\n      }\n    },30e3);\n  }\n  function fromHost(d){\n    if(!d||!d.g||(last.g&&d.q<=last.g))return;\n    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay\n    last.g=d.q;gotG=true;onNet(null,d.g);status();\n  }\n\n  RELAYS.forEach((relay,k)=>{\n    const src='r'+k;\n    const r=miniMqtt(relay,{\n      id:'mf'+rid(12),\n      subs:[me.host?base+'/p/+':base+'/g'],\n      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true);\n        if(byeDone){const f=byeDone;byeDone=null;setTimeout(f,400)}},   // the goodbye went out on a working connection\n      onDown(){status()},\n      onMsg(t,s,stored){\n        if(me.host){\n          // A brand-new game: anything stored from before it was created belongs to an old game with this word. Wipe it.\n          if(stored&&freshGame&&s){let d=null;try{d=JSON.parse(s)}catch(e){}\n            if(!d||!d.t||d.t<freshGame-2000){r.pub(t,'',true);return}}\n          if(!s)return;\n          try{fromPlayer(src,JSON.parse(s),stored)}catch(e){}\n        }else if(s){try{fromHost(JSON.parse(s))}catch(e){}}\n      }\n    });\n    relays.push(r);\n  });\n\n  if(window.Peer)try{\n    if(me.host){\n      let p,wait=2500;\n      const start=()=>{\n        p=new Peer(hid,PO);\n        p.on('open',()=>{wait=2500;peerUp=true;status()});\n        p.on('connection',c=>{\n          c.on('open',()=>{conns.add(c);if(env)try{c.send(env)}catch(e){}});\n          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});\n          c.on('close',()=>conns.delete(c));\n        });\n        p.on('error',e=>{\n          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}\n            setTimeout(start,wait);wait=Math.min(wait*2,30000)}\n        });\n        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});\n      };\n      start();\n    }else{\n      const p=new Peer(PO);let rt=null,wait=2500;\n      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};\n      const dial=()=>{\n        if(p.destroyed)return;\n        if(p.disconnected){try{p.reconnect()}catch(e){}}\n        if(pc){try{pc.close()}catch(e){}}\n        const cc=pc=p.connect(hid,{reliable:true});\n        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);\n        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});\n        cc.on('data',d=>{if(pc===cc)fromHost(d)});\n        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});\n      };\n      p.on('open',dial);\n      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});\n    }\n  }catch(e){}\n\n  function out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- common screens ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall)\" */\nconst fullName=s=>{const o=G&&G.nmx&&G.nmx[s.i],b=String(o||s.n).slice(0,16),x=G&&G.sfx&&G.sfx[s.i];return x?b+' '+x:b};\nfunction sfxV(){\n  const i=ui.sfxFor;if(!i||!me.host||!G||G.ph!=='lobby')return '';\n  const pl=players[i]||{i},base=String(pl.n||'this player').slice(0,16),now=fullName(pl),changed=(G.sfx&&G.sfx[i])||(G.nmx&&G.nmx[i]);\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-la se;letter-spacing:.2em\">`}\n${err?`<p class=\"err\">${esc(err)}<\/p>`:''}\n<button class=\"pri big\" data-a=\"${h?'create':'join'}\">${h?'Create game':'Join'}<\/button>`;\n}\nfunction bar(){\n  return `<div class=\"bar\"><span><i class=\"dot ${conn?'on':''}\"><\/i>Game ${esc(me.code)} \u00b7 ${esc(me.n)}${me.host?' \u00b7 host':''}<\/span><span>${ui.sure==='leave'?'<button class=\"link\" data-a=\"leave\">Tap again to leave<\/button>':'<button class=\"link\" data-a=\"leave\">Leave<\/button>'}<\/span><\/div>`;\n}\nfunction lobbyList(extra){\n  return card(G.lob.map(p=>`<div class=\"row\"><span>${esc(p.n)}${p.i===me.i?' <span class=\"tag\">you<\/span>':''}${extra?extra(p.i):''}<\/span>${me.host&&p.i!==me.i?rnBtn(p.i)+`<button class=\"link\" data-a=\"kick\" data-p=\"${esc(p.i)}\">${ui.sure==='kick:'+p.i?'Tap again to remove':'Remove'}<\/button>`:''}<\/div>`).join('')||'<p class=\"mut\">No one yet.<\/p>');\n}\nfunction lobbyV(){\n  const n=G.lob.length;\n  let h=`<h2>Who's playing<\/h2><p class=\"mut\">${n} ${plural(n,'player','players')} joined<\/p>`+lobbyPlayers();\n  if(!me.host)return h+lobbyGuest()+`<p class=\"mut\">Waiting for the host to start\u2026<\/p><details><summary>How to play<\/summary>${rulesText()}<\/details>`;\n  h=hostCard(`<p>Everyone opens this page, taps <b>Join a game<\/b> and enters:<\/p><div class=\"code\">${esc(G.code)}<\/div>`)+h+lobbyGuest();\n  const [ok,msg]=canStart();\n  return h+lobbySettings()+`<button class=\"pri big\" data-a=\"go\" ${ok?'':'disabled'}>${ok?CFG.startText:esc(msg)}<\/button>`;\n}\nfunction helpV(){return `<h2>How to play<\/h2>`+card(rulesText())+`<button class=\"pri big\" data-a=\"help\">Back to the game<\/button>`}\nfunction gameV(){\n  if(ui.leaving)return card('<p><b>Leaving the game\u2026<\/b><\/p><p class=\"mut\">Telling the host you left.<\/p>');\n  let h=bar()+renameV()+sfxV();\n  if(ui.help)return h+helpV();\n  if(!G)return h+card(`<p>${conn?'Connected. Waiting for the host\u2026':'Connecting to game '+esc(me.cod ,'Moose','Hedgehog','Gorilla','Dolphin','Parrot','Polar bear','Sheep','Spider','Camel','Squirrel'],\n  'Jobs':['Doctor','Firefighter','Pilot','Chef','Teacher','Astronaut','Police officer','Farmer','Dentist','Plumber','Hairdresser','Lifeguard','Judge','Magician','Photographer','Clown','Taxi driver','Librarian','Vet','Builder','Waiter','Scientist','Postman','DJ'],\n  'Food':['Pizza','Banana','Sushi','Taco','Pancake','Ice cream','Broccoli','Popcorn','Cheese','Spaghetti','Hot dog','Doughnut','Egg','Carrot','Chocolate','Watermelon','Burger','Croissant','Lemon','Meatballs','Waffle','Salmon','Strawberry','Toast'],\n  'Things':['Umbrella','Toothbrush','Bicycle','Guitar','Mirror','Fridge','Candle','Ladder','Backpack','Television','Scissors','Clock','Pillow','Rocket','Phone','Lamp','Sofa','Telescope','Key','Balloon','Hammer','Sunglasses','Kite','Bathtub'],\n  'Famous characters':['Santa Claus','Superman','Batman','Spider-Man','Harry Potter','Mickey Mouse','Shrek','Pikachu','Darth Vader','Sherlock Holmes','Cinderella','Mario','Homer Simpson','Elsa','SpongeBob','Dracula','Peter Pan','Tarzan','Winnie the Pooh','James Bond','Robin Hood','Frankenstein','Pinocchio','The Easter Bunny'],\n  'Famous people':['Albert Einstein','Taylor Swift','Leonardo da Vinci','Elvis Presley','Cleopatra','Napoleon','Michael Jackson','Marilyn Monroe','Lionel Messi','Beyonc\u00e9','Shakespeare','Mozart','Usain Bolt','Queen Elizabeth II','Charlie Chaplin','Barack Obama','Elon Musk','Frida Kahlo','Isaac Newton','Serena Williams','Neil Armstrong','Bob Marley','Oprah Winfrey','Vincent van Gogh']\n};\nconst CATS=Object.keys(CHARS);\nfunction newGame(){return{src:'auto',cats:['Animals','Jobs','Food','Things','Famous characters']}}\nfunction rulesText(){\n  return `<p>Everyone gets a secret character. <b>Every phone shows everyone else's character, but never your own.<\/b> Work out who (or what) you are.<\/p>\n<p>Everything else happens out loud: take turns asking yes/no questions (\"Am I an animal?\") and guessing (\"Am I a lion?\"), and the others answer.<\/p>\n<p>When you've guessed right, tap <b>I got it!<\/b> to see your character and take your place in the ranking.<\/p>\n<p>The host chooses whether the game picks the characters, or <b>everyone writes one for the next player<\/b>.<\/p>`;\n}\nfunction hero(){\n  const cards=[[40,60,-8,'#ff4d8d'],[120,40,4,'#4dc9ff'],[200,56,-3,'#ffd23f'],[280,38,6,'#7cf29a']];\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 210\" preserveAspectRatio=\"xMidYMid slice\"><rect width=\"400\" height=\"210\" fill=\"#2b1d4f\"/>\n${cards.map(([x,y,r,c],k)=>`<g transform=\"rotate(${r} ${x+40} ${y+55})\"><rect x=\"${x}\" y=\"${y}\" width=\"80\" height=\"110\" rx=\"10\" fill=\"${c}\"/><circle cx=\"${x+40}\" cy=\"${y+44}\" r=\"18\" fill=\"#2b1d4f\" opacity=\".85\"/><path d=\"M${x+16} ${y+100} Q${x+16} ${y+70} ${x+40} ${y+70} Q${x+64} ${y+70} ${x+64} ${y+100} Z\" fill=\"#2b1d4f\" opacity=\".85\"/>${k===2?`<text x=\"${x+40}\" y=\"${y+52}\" text-anchor=\"middle\" font-family=\"'Luckiest Guy',Impact,sans-serif\" font-size=\"26\" fill=\"#ffd23f\">?<\/text>`:''}<\/g>`).join('')}\n<rect y=\"202\" width=\"400\" height=\"8\" fill=\"#ff4d8d\"/><\/svg><\/div>`;\n}\nfunction canStart(){const n=G.lob.length;if(n<2)return[false,'Need at least 2 players'];if(G.src==='auto'&&!G.cats.length)return[false,'Pick at least one category'];return[true,'']}\nfunction startGame(){\n  const order=shuf(G.lob.map(p=>p.i));\n  Object.assign(G,{pl:G.lob.map(p=>({i:p.i,n:p.n})),order,ch:{},rank:[],gid:rid(),rd:rid()});\n  if(G.src==='write'){G.ph='write';G.wfor={};order.forEach((i,k)=>G.wfor[i]=order[(k+1)%order.length])}\n  else{dealAuto();G.ph='play'}\n}\nfunction dealAuto(only){\n  let pool=[];G.cats.forEach(c=>CHARS[c].forEach(w=>pool.push(w)));if(!pool.length)CATS.forEach(c=>CHARS[c].forEach(w=>pool.push(w)));\n  pool=shuf(pool).filter(x=>!Object.values(G.ch).includes(x));\n  G.order.forEach(i=>{if(only&&G.ch[i])return;G.ch[i]=pool.pop()||pick(C ect, subscribe, publish (QoS 0, optionally retained),\n   a \"last will\" message, keep-alive, and reconnecting after sleep or network changes. */\nfunction miniMqtt(relay,o){\n  const url=relay.url;\n  let ws=null,buf=new Uint8Array(0),up=false,timer=null,retry=1500,pid=1,lastRx=0,closed=false;\n  const put=b=>{try{if(ws&&ws.readyState===1)ws.send(b)}catch(e){}};\n  const subPkt=()=>mpkt(0x82,cat([u16(pid++),...o.subs.map(s=>cat([mstr(s),new Uint8Array([0])]))]));\n  const connectPkt=()=>mpkt(0x10,cat([mstr('MQTT'),\n    new Uint8Array([4,2|(o.will?4|32:0)|(relay.user!=null?128:0)|(relay.pass!=null?64:0)]),u16(30),mstr(o.id),\n    ...(o.will?[mstr(o.will),u16(0)]:[]),\n    ...(relay.user!=null?[mstr(relay.user)]:[]),...(relay.pass!=null?[mstr(relay.pass)]:[])]));\n  function onData(d){\n    lastRx=Date.now();\n    buf=cat([buf,new Uint8Array(d)]);\n    for(;;){\n      if(buf.length<2)return;\n      let i=1,v=0,m=1,b;\n      do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128}while(b&128);\n      if(buf.length<i+v)return;\n      const h=buf[0],body=buf.slice(i,i+v);buf=buf.slice(i+v);\n      const t=h>>4;\n      if(t===2){                                   // CONNACK\n        if(body[1]!==0){try{ws.close()}catch(e){}return}\n        up=true;retry=1500;\n        put(subPkt());\n        o.onUp();\n      }else if(t===3){                             // PUBLISH\n        const tl=body[0]<<8|body[1];let k=2+tl;if((h>>1)&3)k+=2;\n        o.onMsg(td8.decode(body.subarray(2,2+tl)),td8.decode(body.subarray(k)),(h&1)===1);\n      }\n    }\n  }\n  function later(){clearTimeout(timer);timer=setTimeout(open,retry);retry=Math.min(retry*2,15000)}\n  function open(){\n    clearTimeout(timer);if(closed)return;\n    let w;try{w=ws=new WebSocket(url,['mqtt'])}catch(e){ws=null;return later()}\n    w.binaryType='arraybuffer';buf=new Uint8Array(0);lastRx=Date.now();\n    w.onopen=()=>put(connectPkt());\n    w.onmessage=e=>{if(ws===w)onData(e.data)};\n    w.onerror=()=>{try{w.close()}catch(e){}};\n    w.onclose=()=>{if(ws!==w)return;ws=null;if(up){up=false;o.onDown()}later()};\n    setTimeout(()=>{if(ws===w&&!up)try{w.close()}catch(e){}},10000);   // no answer: try again\n  }\n  const iv=setInterval(()=>{                       // keep-alive; drop a connection that died while asleep\n    if(closed)return clearInterval(iv);\n    if(!ws)return;\n    if(Date.now()-lastRx>45000){try{ws.close()}catch(e){}return}\n    if(up)put(new Uint8Array([0xC0,0]));\n  },15000);\n  // Coming back to the foreground (or the network changing): the phone may have paused this page and\n  // quietly killed its connection, so messages sent meanwhile never arrived. Ask the relay again for\n  // everything it has stored, check the line answers, and replace it if it doesn't within 4 seconds.\n  let lastWake=0;\n  function wake(){\n    if(closed||document.hidden||Date.now()-lastWake<1500)return;\n    lastWake=Date.now();retry=1500;\n    if(!ws){open();return}\n    if(!up)return;                                 // still connecting; that will fetch everything anyway\n    const mark=Date.now();\n    put(subPkt());put(new Uint8Array([0xC0,0]));\n    o.onUp();\n    setTimeout(()=>{if(!closed&&ws&&lastRx<mark){retry=300;try{ws.close()}catch(e){}}},4000);\n  }\n  document.addEventListener('visibilitychange',wake);\n  window.addEventListener('focus',wake);\n  window.addEventListener('pageshow',wake);\n  window.addEventListener('online',wake);\n  open();\n  return{up:()=>up,pub(t,s,ret){if(up)put(mpkt(0x30|(ret?1:0),cat([mstr(t),te8.encode(s)])))},\n    restart(){if(closed)return;clearTimeout(timer);retry=1500;const w=ws;ws=null;if(up){up=false;o.onDown()}if(w)try{w.close()}catch(e){}open()},\n    close(){closed=true;clearTimeout(timer);clearInterval(iv);const w=ws;ws=null;up=false;if(w)try{w.send(new Uint8Array([0xE0,0]));w.close()}catch(e){}}};\n}\n\n/* ---------- connection test ----------\n   For each relay: connect, send a message to ourselves through it and time the round trip.\n   For the direct link: check that PeerJS's introduction server answers. */\nlet netT=null;\nfunction relayTest(relay){return new Promise(res=>{\n  const t0=performance.now(),topic='party-likely/v1/test/'+rid(10);let sent=0,done=false,c=null;\n  const fin=r=>{if(done)return;done=true;try{c&&c.close()}catch(e){}res(r)};\n  c=miniMqtt(relay,{id:'mft'+rid(10),subs:[topic],will:null,\n    onUp(){sent=performance.now();c.pub(topic,'ping',false)},onDown(){},\n    onMsg(t,m){if(t===topic&&m==='ping')fin({ok:true,conn:sent-t0,rt:performance.now()-sent})}});\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nfunction peerTest(){return new Promise(res=>{\n  if(!window.Peer)return res({ok:false});\n  const t0=performance.now();let p=null,done=false;\n  const fin=r=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}res(r)};\n  try{p=new Peer(window.MAFIA_PEER_OPTS||{})}catch(e){return fin({ok:false})}\n  p.on('open',()=>fin({ok:true,conn:performance.now()-t0}));p.on('error',()=>fin({ok:false}));\n  setTimeout(()=>fin({ok:false}),10000);\n})}\nasync function runNetTest(){\n  if(netT&&netT.busy)return;\n  netT={busy:true,r:RELAYS.map(()=>null),p:null};render();\n  const jobs=RELAYS.map((u,k)=>relayTest(u).then(x=>{netT.r[k]=x;render()}));\n  jobs.push(peerTest().then(x=>{netT.p=x;render()}));\n  await Promise.all(jobs);netT.busy=false;render();\n}\nconst secs=ms=>(ms/1000).toFixed(ms<1000?2:1)+' s';\nfunction netV(){\n  const t=netT||{busy:true,r:[],p:null};\n  const row=(name,x,okText)=>`<div class=\"row\"><span><i class=\"dot ${x&&x.ok?'on':''}\"><\/i>${name}<\/span><small class=\"${x&&!x.ok?'err':'mut'}\" style=\"white-space:nowrap\">${!x?'Testing\u2026':x.ok?okText(x):'Not reachable'}<\/small><\/div>`;\n  const rows=RELAYS.map((u,k)=>row(`Relay ${k+1}${u.name?' ('+u.name+')':''}`,t.r[k],x=>`Works \u00b7 ${secs(x.rt)}`)).join('')\n    +row('Direct link',t.p,x=>'Works');\n  const relOk=t.r.filter(x=>x&&x.ok).length;\n  let verdict='';\n  if(!t.busy){\n    verdict=relOk===RELAYS.length?`<p><b>Good to go.<\/b> This phone can reach all ${RELAYS.length} relays, so it can host or join a game.<\/p>`\n      :relOk>0?`<p><b>Good to go.<\/b> ${relOk} of ${RELAYS.length} relays work here. One is enough to play.<\/p>`\n      :t.p&&t.p.ok?`<p class=\"err\">None of the relays work on this network.<\/p><p class=\"mut\">The game can still try the direct link, but that often fails. Try switching this phone to mobile data, or another Wi-Fi.<\/p>`\n      :`<p class=\"err\">This phone can't reach any of the game's servers.<\/p><p class=\"mut\">Check that it's online. Some Wi-Fi networks (offices, schools, hotels) block them: try mobile data instead.<\/p>`;\n  }\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>Connection test<\/h2>\n<p class=\"mut\">Checks whether this phone can reach the servers the game uses. The time is how long a message takes to get through. If someone can't join, run it on their phone.<\/p>\n<div class=\"card\">${rows}<\/div>${verdict}\n<button class=\"pri\" data-a=\"nettest\"${t.busy?' disabled':''}>${t.busy?'Testing\u2026':'Test again'}<\/button>`;\n}\n\nfunction mixNet(){\n  const base='party-likely/v1/'+me.code.toLowerCase();\n  const myT=base+'/p/'+me.i;                      // player ids only use a-z and digits\n  const PO=window.MAFIA_PEER_OPTS||{};\n  const hid='party-likely-cl-'+me.code.toLowerCase();\n  let Q=Date.now(),env=null,peerUp=false,gotG=false,pc=null,byeDone=null;\n  const conns=new Set(),relays=[];\n  const last={},seen={};                          // newest message number, and when each player was last heard from\n  const anyUp=()=>relays.some(r=>r.up())||peerUp;\n  let upSince=0;\n  const status=()=>{const u=anyUp();if(u&&!upSince)upSince=Date.now();if(!u)upSince=0;setConn(me.host?u:(u&&gotG))};\n\n  function fromPlayer(src,d,stored){\n    const s=d&&d.s;if(!s||!s.i||s.i===me.i)return;\n    if(G&&G.kk&&G.kk.includes(s.i))return;        // removed by the guide\n    const at=stored?(d.t||0):Date.now();          // a stored copy only tells us when it was sent\n    if(at>(seen[s.i]||0))seen[s.i]=at;\n    if(last[s.i]&&d.q<=last[s.i])return;\n    last[s.i]=d.q;\n    if(s.bye){if(players[s.i])drop(s.i);return}   // they tapped Leave (mid-game too: they're left out of the next round)\n    onNet(Object.assign({},players,{[s.i]:s}),null);\n  }\n  function drop(id){const m=Object.assign({},players);delete m[id];delete seen[id];onNet(m,null)}\n\n  // Guide only: in the lobby, remove a player who hasn't been heard from for 15 minutes\n  // (phone asleep or page closed that long). Sleeping for less than that changes nothing.\n  if(me.host){\n    let tick=Date.now();\n    setInterval(()=>{\n      const now=Date.now();\n      if(now-tick>60e3)upSince=anyUp()?now:0;    // this phone was asleep itself: listen a while before judging\n      tick=now;\n      if(!G||G.ph!=='lobby'||!upSince||now-upSince<150e3)return;\n      for(const id in players){\n        if(id===me.i)continue;\n        if(now-(seen[id]||0)>15*60e3){delete last[id];drop(id)}\n      }\n    },30e3);\n  }\n  function fromHost(d){\n    if(!d||!d.g||(last.g&&d.q<=last.g))return;\n    if(d.t&&Date.now()-d.t>6*3600e3)return;   // an old game left behind on a relay\n    last.g=d.q;gotG=true;onNet(null,d.g);status();\n  }\n\n  RELAYS.forEach((relay,k)=>{\n    const src='r'+k;\n    const r=miniMqtt(relay,{\n      id:'mf'+rid(12),\n      subs:[me.host?base+'/p/+':base+'/g'],\n      onUp(){status();if(env)r.pub(me.host?base+'/g':myT,JSON.stringify(env),true);\n        if(byeDone){const f=byeDone;byeDone=null;setTimeout(f,400)}},   // the goodbye went out on a working connection\n      onDown(){status()},\n      onMsg(t,s,stored){\n        if(me.host){\n          // A brand-new game: anything stored from before it was created belongs to an old game with this word. Wipe it.\n          if(stored&&freshGame&&s){let d=null;try{d=JSON.parse(s)}catch(e){}\n            if(!d||!d.t||d.t<freshGame-2000){r.pub(t,'',true);return}}\n          if(!s)return;\n          try{fromPlayer(src,JSON.parse(s),stored)}catch(e){}\n        }else if(s){try{fromHost(JSON.parse(s))}catch(e){}}\n      }\n    });\n    relays.push(r);\n  });\n\n  if(window.Peer)try{\n    if(me.host){\n      let p,wait=2500;\n      const start=()=>{\n        p=new Peer(hid,PO);\n        p.on('open',()=>{wait=2500;peerUp=true;status()});\n        p.on('connection',c=>{\n          c.on('open',()=>{conns.add(c);if(env)try{c.send(env)}catch(e){}});\n          c.on('data',d=>{if(d&&d.s&&d.s.i){c.pid=d.s.i;fromPlayer('p',d)}});\n          c.on('close',()=>conns.delete(c));\n        });\n        p.on('error',e=>{\n          if(e.type==='unavailable-id'){peerUp=false;status();try{p.destroy()}catch(x){}\n            setTimeout(start,wait);wait=Math.min(wait*2,30000)}\n        });\n        p.on('disconnected',()=>{peerUp=false;status();setTimeout(()=>{try{p.reconnect()}catch(e){}},2000)});\n      };\n      start();\n    }else{\n      const p=new Peer(PO);let rt=null,wait=2500;\n      const redial=()=>{clearTimeout(rt);rt=setTimeout(dial,wait);wait=Math.min(wait*1.6,30000)};\n      const dial=()=>{\n        if(p.destroyed)return;\n        if(p.disconnected){try{p.reconnect()}catch(e){}}\n        if(pc){try{pc.close()}catch(e){}}\n        const cc=pc=p.connect(hid,{reliable:true});\n        setTimeout(()=>{if(pc===cc&&!cc.open){try{cc.close()}catch(e){}redial()}},8000);\n        cc.on('open',()=>{if(pc!==cc)return;wait=2500;peerUp=true;status();if(env)try{cc.send(env)}catch(e){}});\n        cc.on('data',d=>{if(pc===cc)fromHost(d)});\n        cc.on('close',()=>{if(pc!==cc)return;peerUp=false;status();redial()});\n      };\n      p.on('open',dial);\n      p.on('error',e=>{if(['peer-unavailable','network','disconnected','webrtc'].includes(e.type))redial()});\n    }\n  }catch(e){}\n\n  function out(e){\n    const t=me.host?base+'/g':myT,s=JSON.stringify(e);\n    relays.forEach(r=>r.pub(t,s,true));\n    if(me.host)conns.forEach(c=>{try{if(c.open)c.send(e)}catch(x){}});\n    else if(pc&&pc.open)try{pc.send(e)}catch(x){}\n  }\n  // \"Still here\": resend the latest message with a fresh time once a minute while the page is open.\n  // It stops when the phone sleeps, which is how the guide can tell how long someone has been away.\n  setInterval(()=>{if(env){env.t=Date.now();out(env)}},60e3);\n\n  return{\n    send(){env=me.host?{q:++Q,t:Date.now(),g:G}:{q:++Q,t:Date.now(),s:st};out(env)},\n    // Tapped Leave: send a goodbye. The connection may have died quietly while this browser was in the\n    // background, so also send it again on fresh connections, and report back once it has gone out.\n    bye(){\n      if(me.host)return Promise.resolve();\n      env={q:++Q,t:Date.now(),s:{i:me.i,bye:1}};out(env);\n      return new Promise(res=>{byeDone=res;relays.forEach(r=>r.restart());setTimeout(res,8000)});\n    }\n  };\n}\n\n\n/* ---------- common screens ---------- */\n/* The host asked this player to pick a different name (lobby only) */\nfunction renameV(){if(!G||G.ph!=='lobby'||me.host||!G.rn||!G.rn[me.i]||(st.rnd||0)>=G.rn[me.i])return '';\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rnh\"><div class=\"card\"><p id=\"rnh\" class=\"disp\" style=\"font-size:26px\">New name, please<\/p><p>The host asked you to change your name. Pick something everyone will recognise.<\/p><label for=\"rnn\">Your new name<\/label><input id=\"rnn\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.rnn==null?'':ui.rnn)}\" data-enter=\"rnsave\"><button class=\"pri big\" data-a=\"rnsave\">Save my new name<\/button><\/div><\/div>`}\nconst rnBtn=i=>me.host&&i!==me.i&&G&&G.ph==='lobby'?`<button class=\"link\" data-a=\"sfxo\" data-p=\"${esc(i)}\">Change name<\/button> `:'';\n/* The host can add a few words after a player's name, e.g. \"Ben (tall)\" */\nconst fullName=s=>{const o=G&&G.nmx&&G.nmx[s.i],b=String(o||s.n).slice(0,16),x=G&&G.sfx&&G.sfx[s.i];return x?b+' '+x:b};\nfunction sfxV(){\n  const i=ui.sfxFor;if(!i||!me.host||!G||G.ph!=='lobby')return '';\n  const pl=players[i]||{i},base=String(pl.n||'this player').slice(0,16),now=fullName(pl),changed=(G.sfx&&G.sfx[i])||(G.nmx&&G.nmx[i]);\n  return `<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sfh\"><div class=\"card\"><p id=\"sfh\" class=\"disp\" style=\"font-size:24px\">Change ${esc(base)}'s name<\/p><p class=\"mut\">Shown on everyone's phone as: <b>${esc(now)}<\/b><\/p><label for=\"sfx\">New text<\/label><input id=\"sfx\" maxlength=\"16\" autocomplete=\"off\" value=\"${esc(ui.sfxv==null?'':ui.sfxv)}\" placeholder=\"e.g. Ben, or (red jumper)\"><button class=\"pri big\" data-a=\"sfxs\">Add to the end of the name<\/button><button class=\"pri big\" data-a=\"sfxr\">Replace the whole name<\/button>${changed?`<button data-a=\"sfxd\">Go back to \"${esc(base)}\"<\/button>`:''}<button data-a=\"sfxc\">Cancel<\/button><\/div><\/div>`;\n}\n\nfunction rnClean(){if(G&&G.rn)for(const k in G.rn){const s=acts[k];if(!players[k]||(s&&(s.rnd||0)>=G.rn[k]))delete G.rn[k]}}\nfunction homeV(){\n  return hero()+`<a class=\"homelink\" href=\"./\">\u2190 Home<\/a><h1>${CFG.title}<\/h1>${ui.notice?`<p class=\"err\">${esc(ui.notice)}<\/p>`:''}${ui.rejoin?`<button class=\"pri\" data-a=\"rejoin\">Join game ${esc(ui.rejoin.c)} again<\/button>`:''}\n<p class=\"mut\">${CFG.blurb}<\/p>\n<button class=\"pri big\" data-a=\"start\">Join a game<\/button>\n<button data-a=\"hostnew\">Host a new game<\/button>\n<button class=\"link\" data-a=\"nettest\">Test connection: can this phone reach the servers?<\/button>\n<details><summary>How to play<\/summary>${rulesText()}<\/details>${CFG.fine?`<p class=\"fine\">${CFG.fine}<\/p>`:''}`;\n}\nfunction joinV(){\n  const h=ui.mode==='host';\n  return `<button class=\"link\" data-a=\"home\">\u2190 Back<\/button><h2>${h?'Host a game':'Join the game'}<\/h2>\n<label for=\"nm\">Your name<\/label><input id=\"nm\" maxlength=\"16\" autocomplete=\"nickname\" value=\"${esc(ui. leaving)return card('<p><b>Leaving the game\u2026<\/b><\/p><p class=\"mut\">Telling the host you left.<\/p>');\n  let h=bar()+renameV()+sfxV();\n  if(ui.help)return h+helpV();\n  if(!G)return h+card(`<p>${conn?'Connected. Waiting for the host\u2026':'Connecting to game '+esc(me.code)+'\u2026'}<\/p>`+(err?`<p class=\"err\">${esc(err)}<\/p>`:''));\n  if(err)h+=`<p class=\"err\">${esc(err)}<\/p>`;\n  if(G.ph==='lobby')return h+lobbyV();\n  return h+gameScreen()+`<button class=\"link\" data-a=\"help\">How to play<\/button>`;\n}\nfunction render(){\n  if(typeof beforeRender==='function'&&beforeRender()===false)return;\n  document.body.className=bodyClass();\n  const h=ui.scr==='home'?homeV():ui.scr==='join'?joinV():ui.scr==='nettest'?netV():gameV();\n  if(h!==lastHtml){\n    // keep the cursor in a text box that is being typed in while other players' updates arrive\n    const f=document.activeElement,fid=f&&app.contains(f)&&f.id?f.id:null,s0=fid&&f.selectionStart!=null?[f.selectionStart,f.selectionEnd]:null;\n    const y=window.scrollY;app.innerHTML=h;lastHtml=h;window.scrollTo(0,y);\n    if(fid){const g=document.getElementById(fid);if(g){try{g.focus({preventScroll:true});if(s0)g.setSelectionRange(s0[0],s0[1])}catch(e){}}}\n    if(typeof afterRender==='function')afterRender()}\n}\nfunction toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}\nfunction kickPlayer(id){if(!me.host||!G||G.ph!=='lobby'||id===me.i)return;G.kk=(G.kk||[]).concat(id);const m=Object.assign({},players);delete m[id];onNet(m,null)}\nfunction enter(){st={i:me.i,n:me.n};ui.scr='game';err='';lastSent='';render();connect();wake()}\nfunction leave(){\n  if(ui.leaving)return;\n  let p=null;if(net&&net.bye&&!me.host)try{p=net.bye()}catch(e){}\n  me.code='';me.host=false;saveMe();\n  const go=()=>{try{location.reload()}catch(e){}};\n  if(p){ui.leaving=true;render();p.then(go,go)}else go();\n}\n\n/* ---------- Most Likely To: vote for who in the room fits best ---------- */\nconst PROMPTS={\n  'Classic':['become famous','get lost in their own town','survive a zombie apocalypse','cry at a film','forget their own birthday','win the lottery and lose the ticket','become a millionaire','end up on reality TV','talk their way out of a parking ticket','fall asleep at a party','adopt ten cats','start a business','text the wrong person','laugh at the worst moment','be late to their own wedding','move abroad on a whim','become a politician','run a marathon','write a book','get a tattoo they regret'],\n  'Silly':['eat something off the floor','trip over nothing','talk to animals like they are people','get stuck in a lift','sing in the shower the loudest','laugh at their own joke before finishing it','wear socks with sandals','fight a seagull for their chips','still be awake at 4am','lose their phone while holding it','dance on a table','fall for an obvious prank','order the weirdest thing on the menu','get a bad haircut and say they love it','name their car','take 200 selfies to post one'],\n  'Party':['be the last one to leave the party','start a dance-off','befriend a stranger at the bar','order shots for everyone','end up in someone else\\'s photos','lose their jacket on a night out','give a speech nobody asked for','fall asleep on the way home','eat a kebab at 3am','know all the words to every song','get everyone kicked out','be found in the kitchen at parties'],\n  'Spicy':['send a risky text','have a secret crush in this room','go on a date with an ex','lie about their age','stalk someone on social media','have the most embarrassing search history','get caught snooping','flirt their way out of trouble','keep a secret the longest','spill a secret first']\n};\nconst PCATS=Object.keys(PROMPTS);\nfunction newGame(){return{cats:['Classic','Silly','Party'],anon:1,self:1,sc:{},used:[]}}\nfunction rulesText(){\n  return `<p>A question pops up: <b>\"Who's most likely to\u2026 get lost in their own town?\"<\/b> Everyone secretly votes for someone in the room on their phone.<\/p>\n<p>When everyone has voted, the result appears on every phone: who got the most votes, and how many each person got. The host can show or hide who voted for whom.<\/p>\n<p>Everyone who gets the most votes wins that title. The host can also type their own questions.<\/p>`;\n}\nfunction hero(){\n  return `<div class=\"hero\" aria-hidden=\"true\"><svg viewBox=\"0 0 400 210\" preserveAspectRatio=\"xMidYMid slice\"><rect width=\"400\" height=\"210\" fill=\"#fff4e6\"/>\n<g fill=\"#ff6b35\"><circle cx=\"200\" cy=\"96\" r=\"34\"/><path d=\"M150 210 Q150 140 200 140 Q250 140 250 210 Z\"/><\/g>\n<text x=\"200\" y=\"66\" text-anchor=\"middle\" font-family=\"Fredoka,'Arial Rounded MT Bold',sans-serif\" font-weight=\"700\" font-size=\"30\" fill=\"#2b2118\">\u2605<\/text>\n${[[40,-1],[110,-1],[290,1],[360,1]].map(([x,d])=>`<g fill=\"#ffb38a\"><circle cx=\"${x}\" cy=\"118\" r=\"20\"/><path d=\"M${x-28} 210 Q${x-28} 150 ${x} 150 Q${x+28} 150 ${x+28} 210 Z\"/><\/g><path d=\"M${x+d*-10} 150 L${x+d*-50} 128\" stroke=\"#2b2118\" stroke-width=\"6\" stroke-linecap=\"round\" transform=\"scale(1)\"/>`).join('')}\n<rect y=\"202\" width=\"400\" height=\"8\" fill=\"#2b2118\"/><\/svg><\/div>`;\n}\nfunction canStart(){const n=G.lob.length;if(n<3)return[false,'Need at least 3 players'];if(!G.cats.length&&!(G.custom||[]).length)return[false,'Pick at least one category'];return[true,'']}\nfunction startGame(){G.pl=G.lob.map(p=>({i:p.i,n:p.n}));G.pl.forEach(p=>{if(G.sc[p.i]==null)G.sc[p.i]=0});G.num=0;nextQ()}\nfunction nextQ(custom){\n  let q=custom;\n  if(!q){let pool=[];G.cats.forEach(c=>PROMPTS[c].forEach(x=>pool.push(x)));let fresh=pool.filter(x=>!G.used.includes(x));if(!fresh.length){G.used=[];fresh=pool}q=pick(fresh)||'be the best at this game';G.used.push(q)}\n  G.pl=G.lob.map(p=>({i:p.i,n:p.n}));G.pl.forEach(p=>{if(G.sc[p.i]==null)G.sc[p.i]=0});\n  Object.assign(G,{q,ph:'vote',rd:rid(),res:null,vd:0});G.num=(G.num||0)+1;\n}\nconst vote=i=>{const s=acts[i];return s&&s.vote&&s.vote.rd===G.rd?s.vote:null};\nfunction gHostTick(){\n  if(G.ph!=='vote')return;\n  G.vd=G.pl.filter(p=>vote(p.i)).length;\n  if(G.vd>=G.pl.length)reveal();\n}\nfunction reveal(){\n  const c={},by={};G.pl.forEach(p=>{const v=vote(p.i);if(v&&v.t&&G.pl.some(x=>x.i===v.t)){c[v.t]=(c[v.t]||0)+1;(by[v.t]=by[v.t]||[]).push(p.i)}});\n  const m=Math.max(0,...Object.values(c)),top=m?Object.keys(c).filter(k=>c[k]===m):[];\n  top.forEach(i=>G.sc[i]=(G.sc[i]||0)+1);\n  G.res={c,by,top,m};G.ph='result';G.rd=rid();\n}\nfunction gReset(){}\nfunction gInput(e){if(e.target.id==='cq')ui.cq=e.target.value}\nfunction scoresV(){\n  const ids=Object.keys(G.sc).filter(i=>G.lob.some(p=>p.i===i)||P(i)).sort((a,b)=>G.sc[b]-G.sc[a]);\n  return ids.length?`<details${ui.sco?' open':''}><summary>Titles so far<\/summary>`+card(ids.map(i=>`<div class=\"row\"><span>${esc(nm(i))}${i===me.i?' <span class=\"tag\">you<\/span>':''}<\/span><b>${G.sc[i]}<\/b><\/div>`).join(''))+`<\/details>`:'';\n}\nconst qText=()=>`<p class=\"mut\">Question ${G.num}<\/p><p class=\"q\">Who's most likely to <b>${esc(G.q)}<\/b>?<\/p>`;\nfunction hostNext(){\n  return hostCard(`<button class=\"pri big\" data-a=\"next\">Next question<\/button><label for=\"cq\" style=\"display:block;margin-top:14px\">\u2026or ask your own: \"Who's most likely to\u2026\"<\/label><input id=\"cq\" maxlength=\"90\" autocomplete=\"off\" placeholder=\"sing karaoke all night\" value=\"${esc(ui.cq||'')}\" data-enter=\"custom\"><button data-a=\"custom\">Ask this one<\/button>`)+`<button data-a=\"lobby\">Back to the lobby (change settings)<\/button>`;\n}\nfunction gameScreen(){\n  const inG=G.pl.some(p=>p.i===me.i);\n  let h=`<div class=\"qcard\">${qText()}<\/div>`;\n  if(G.ph==='vote'){\n    if(!inG)return h+card(\"<p>You'll be in from the next question.<\/p>\");\n    const v=vote(me.i),opts=G.pl.map(p=>p.i).filter lt();const b=app.querySelector(`[data-a=\"${e.target.dataset.enter}\"]`);if(b&&!b.disabled)b.click()}});\napp.addEventListener('click',e=>{\n  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;\n  const a=b.dataset.a,p=b.dataset.p,r=b.dataset.r,k=b.dataset.k;\n  const twice=key=>{if(ui.sure!==key){ui.sure=key;render();return false}ui.sure='';return true};\n  if(a!=='leave'&&ui.sure==='leave')ui.sure='';\n  ui.notice='';\n  switch(a){\n    case 'start':ui.mode='join';ui.scr='join';err='';break;\n    case 'hostnew':ui.mode='host';ui.scr='join';err='';break;\n    case 'home':ui.scr='home';err='';break;\n    case 'create':{const n=(ui.name||'').trim();if(!n){err='Enter your name.';break}\n      me.n=n.slice(0,16);me.host=true;me.code=newCode();freshGame=Date.now();saveMe();acts={};players={};\n      G=Object.assign({ph:'lobby',code:me.code,lob:[],rd:rid()},newGame());enter();return}\n    case 'join':{const n=(ui.name||'').trim(),c=(ui.code||'').trim();if(!n){err='Enter your name.';break}if(c.length!==4){err='The game code has 4 letters.';break}\n      me.n=n.slice(0,16);me.host=false;me.code=c;saveMe();G=null;enter();return}\n    case 'nettest':ui.scr='nettest';err='';runNetTest();return;\n    case 'leave':if(ui.sure!=='leave'){ui.sure='leave';break}leave();return;\n    case 'help':ui.help=!ui.help;try{window.scrollTo(0,0)}catch(x){}break;\n    case 'kick':if(!twice('kick:'+p))break;kickPlayer(p);break;\n    case 'sfxo':if(!me.host||!G||G.ph!=='lobby')break;ui.sfxFor=p;ui.sfxv='';break;\n    case 'sfxc':ui.sfxFor=null;break;\n    case 'sfxs':case 'sfxr':case 'sfxd':{const i=ui.sfxFor;if(!i)break;const v=(ui.sfxv||'').trim();if(a!=='sfxd'&&!v){toast('Type something first.');break}\n      G.sfx=Object.assign({},G.sfx);G.nmx=Object.assign({},G.nmx);\n      if(a==='sfxd'){delete G.sfx[i];delete G.nmx[i]}else if(a==='sfxs')G.sfx[i]=v.slice(0,14);else{G.nmx[i]=v.slice(0,16);delete G.sfx[i]}\n      ui.sfxFor=null;ui.sfxv='';push();return}\n    case 'rnq':if(!me.host||!G||G.ph!=='lobby'||p===me.i)break;G.rn=Object.assign({},G.rn,{[p]:Date.now()});push();return;\n    case 'rnsave':{const n=(ui.rnn||'').trim().slice(0,16);if(!n){toast('Type a new name.');break}if(n===me.n){toast('Pick a different name.');break}\n      me.n=n;ui.name=n;saveMe();st.n=n;st.rnd=G.rn[me.i];ui.rnn='';push();return}\n    case 'rejoin':{const r=ui.rejoin;if(!r)break;me={i:rid(),n:r.n,code:r.c,host:false};ui.name=r.n;ui.rejoin=null;saveMe();G=null;enter();return}\n    case 'sel':ui[k]=ui[k]===p?null:p;break;\n    case 'go':{const [ok,msg]=canStart();if(!ok){toast(msg);break}startGame();push();return}\n    default:{const res=gClick(a,b,{p,r,k,twice});if(res==='push'){push();return}}\n  }\n  render();\n});\n\n/* test hook: only when a test page sets CT_TEST before loading */\n/* ---------- boot ---------- */\nif(me.code&&me.n){\n  if(me.host){const g=ld('G',null);G=g&&g.code===me.code?g:Object.assign({ph:'lobby',code:me.code,lob:[],rd:rid()},newGame());acts=ld('acts',{});if(typeof hostBoot==='function')hostBoot()}\n  const ss=ld('st',null);if(ss&&ss.i===me.i)st=Object.assign({},ss,{n:me.n});\n  ui.scr='game';lastRd=G?G.rd:'';onGame();render();connect();\n}else{\ntry{const k0=sessionStorage.getItem(KEY+'kicked');if(k0){sessionStorage.removeItem(KEY+'kicked');let k=null;try{k=JSON.parse(k0)}catch(x){k={c:k0,n:me.n}}if(typeof k==='string')k={c:k,n:me.n};ui.notice=`The host removed you from game ${k.c}.`;ui.rejoin=k}}catch(e){}\n  render();\n}\n\n}\n<\/script>\n<\/body>\n<\/html>\n"};
