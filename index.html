<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar Roulette</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8336a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar Roulette">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column — a "ticket" card that shows the pick, a 2×2 grid of finder buttons below */
:root {
  --bg: #f3efe8;
  --card: #fffdf9;
  --ink: #1d1a22;
  --muted: #6b6474;
  --line: #ddd5ca;
  --accent: #b8336a;
  --accent-ink: #ffffff;
  --food: #c4581c;
  --open: #2e7d4f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15121a; --card: #1f1a26; --ink: #f1ecf4; --muted: #a59cb0;
    --line: #342c3e; --accent: #f06a9f; --accent-ink: #1a0b12;
    --food: #f39a5c; --open: #6fd39a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--display); font-size: 16px; line-height: 1.5;
  min-height: 100vh;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; display: grid; gap: 8px; }
main > * { min-width: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header { display: grid; gap: 4px; }
h1 { font-size: clamp(1.7rem, 7vw, 2.4rem); font-weight: 800; line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

.ticket {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  /* fixed height: exactly fits a two-line name plus one line each of distance, hours, address and links */
  --name-size: clamp(1.8rem, 7vw, 2.4rem);
  padding: 16px 18px; display: grid; gap: 6px; align-content: start;
  height: calc(0.81 * (2 * 1.05 * var(--name-size) + 220px)); overflow: hidden;
  position: relative;
}
.ticket::before, .ticket::after {
  content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line); transform: translateY(-50%);
}
.ticket::before { left: -12px; clip-path: inset(0 0 0 50%); }
.ticket::after { right: -12px; clip-path: inset(0 50% 0 0); }

.ticket-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-height: 30px; }
.left-count { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.back {
  font-family: var(--mono); font-size: 0.78rem; cursor: pointer; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
}
.back:hover { border-color: var(--accent); color: var(--accent); }
.name { font-size: var(--name-size); font-weight: 800; line-height: 1.0; margin: 0; overflow-wrap: anywhere; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: nowrap; gap: 8px 16px; white-space: nowrap; font-family: var(--mono); font-size: 0.85rem; }
.meta b { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.ticket.food .meta b { color: var(--food); }
.addr b { font-family: var(--mono); font-size: 0.82rem; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.ticket.food .addr b { color: var(--food); }
.addr { color: var(--muted); margin: 0; font-size: 0.9rem; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hours { display: flex; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; align-items: center; gap: 8px; margin: 0; font-family: var(--mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.hours > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill { flex-shrink: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 999px; padding: 2px 9px; border: 1px solid currentColor; }
.pill.open { color: var(--open); }
.pill.unknown { color: var(--muted); }
/* the three result links always share one row */
.links { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 4px; }
.links a {
  flex: 1 1 auto; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--mono); font-size: 0.78rem; color: var(--ink);
  text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px;
}
.links a:hover { border-color: var(--accent); color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.state { color: var(--muted); margin: 0; }
.state.err { color: var(--accent); }

.finders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.finders button {
  font-family: var(--display); font-weight: 800; font-size: 1rem; line-height: 1.15;
  border-radius: 14px; padding: 10px 12px; min-height: 72px; cursor: pointer; transition: transform .12s ease;
  border: 2px solid transparent;
}
.finders button small { display: block; font-family: var(--mono); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.04em; opacity: .85; margin-top: 2px; }
.finders .random.bar { background: var(--accent); color: var(--accent-ink); }
.finders .random.food { background: var(--food); color: var(--accent-ink); }
.finders .closest { background: transparent; color: var(--ink); }
.finders .closest.bar { border-color: var(--accent); }
.finders .closest.food { border-color: var(--food); }
.finders .closest.other { border-color: var(--muted); }
.finders button:active { transform: scale(0.98); }
.finders button:disabled { opacity: .6; cursor: progress; }

.range { display: grid; gap: 2px; }
.range-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.range output { font-family: var(--mono); font-weight: 500; font-size: 1rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.range input { width: 100%; margin: 0; accent-color: var(--accent); height: 26px; }
.range-ends { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.from { display: flex; flex-wrap: nowrap; gap: 6px 10px; align-items: baseline; font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
  min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; visibility: hidden; }
.from > span { overflow: hidden; text-overflow: ellipsis; }
.from button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

.locate {
  font-family: var(--display); font-weight: 800; font-size: 1rem; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px;
}
.locate:hover { border-color: var(--accent); color: var(--accent); }

.locate:disabled { opacity: .6; cursor: progress; }
.manual { display: grid; gap: 6px; }
.manual .locate-btn { flex: 0 0 auto; padding: 10px 12px; font-size: 1.05rem; line-height: 1; }
.manual .row { display: flex; gap: 8px; }
.manual input {
  flex: 1; min-width: 0; width: 0; font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.manual button {
  font-family: var(--display); font-weight: 800; font-size: 1rem; cursor: pointer;
  background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
}
.manual button:hover { border-color: var(--accent); color: var(--accent); }
.settings { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.settings legend { padding: 0 6px; }
.suggest { display: grid; gap: 6px; margin-top: -2px; }
.suggest button {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%;
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.suggest button:hover, .suggest button:focus-visible { border-color: var(--accent); }
.suggest small { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.foot a { color: inherit; }
[hidden] { display: none !important; }
.egg {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--ink) 55%, transparent);
  padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.egg-card {
  background: var(--card); border: 2px solid var(--accent); border-radius: 18px;
  padding: 28px 28px 24px; display: grid; gap: 14px; justify-items: center; text-align: center;
  max-width: 340px; width: 100%; animation: wobble .5s ease;
}
.locate-row { display: flex; gap: 8px; flex-wrap: wrap; }
.locate-row .locate { flex: 1 1 auto; }
#fromText.warn, #roughNote { color: var(--accent); }
.egg-house { font-size: 3rem; line-height: 1; }
.egg h2 { margin: 0; font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 800; line-height: 1.05; color: var(--accent); }
.egg button {
  font-family: var(--display); font-weight: 800; font-size: 1rem; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 22px;
}
@keyframes wobble { 0%{transform:scale(.6) rotate(-6deg);opacity:0} 60%{transform:scale(1.05) rotate(2deg);opacity:1} 100%{transform:none} }
@media (prefers-reduced-motion: reduce) { .egg-card { animation: none; } }
@keyframes flick { 0%{opacity:.3} 50%{opacity:1} 100%{opacity:.3} }
.spinning { animation: flick .3s linear infinite; }
@media (prefers-reduced-motion: reduce) { .spinning { animation: none; } .finders button { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bar Roulette</h1>
  </header>

  <section class="ticket" id="ticket" aria-live="polite">
    <span class="label">Tonight's pick</span>
    <p class="state">Pick a button below. Your browser will ask for your location, or you can type an address.</p>
  </section>

  <div class="finders">
    <button class="random bar" id="randBar" type="button">Random bar<small>bars &amp; pubs</small></button>
    <button class="closest bar" id="nearBar" type="button">Closest bar<small>nearest open</small></button>
    <button class="random food" id="randFood" type="button">Random food<small class="foodKind">takeaway only</small></button>
    <button class="closest food" id="nearFood" type="button">Closest food<small class="foodKind">takeaway only</small></button>
    <button class="closest other" id="nearPharmacy" type="button" hidden>Closest pharmacy<small>nearest open</small></button>
    <button class="closest other" id="nearGrocery" type="button" hidden>Closest grocery<small>nearest open</small></button>
  </div>

  <div class="range">
    <div class="range-head">
      <label class="label" for="dist">Random search distance</label>
      <output id="distOut" for="dist">500 m</output>
    </div>
    <input type="range" id="dist" min="100" max="2000" step="100" value="500" autocomplete="off">
  </div>

  <div class="from" id="from">
    <span id="fromText"></span>
    <span id="roughNote" hidden>Your phone is only sharing an approximate location.</span>
  </div>

  <button type="button" class="locate" id="useLocation">◎ Use my location</button>

  <form class="manual" id="manual">
    <label class="label" for="addr">Or set an address</label>
    <div class="row">
      <input id="addr" type="text" placeholder="Street, place or landmark" autocomplete="off"
        role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
      <button type="submit">Set</button>
    </div>
    <div class="suggest" id="suggest" role="listbox" hidden></div>
  </form>

  <fieldset class="settings">
    <legend class="visually-hidden">Settings</legend>
    <label class="check"><input type="checkbox" id="takeawayOnly" checked> Food: takeaway only (no restaurants)</label>
    <label class="check"><input type="checkbox" id="skipUnknown" checked> Skip places that don't list opening hours</label>
    <label class="check"><input type="checkbox" id="showOther"> Show pharmacy and grocery buttons</label>
  </fieldset>

  <div class="foot" hidden>
    <span id="count"></span>
    <span id="cityNote"></span>
    <span>Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>
  </div>
</main>

<div class="egg" id="egg" hidden role="dialog" aria-modal="true" aria-labelledby="eggTitle">
  <div class="egg-card">
    <span class="egg-house" aria-hidden="true">🏠</span>
    <h2 id="eggTitle">Go home Tyler!</h2>
    <button type="button" id="eggClose">Fine…</button>
  </div>
</div>

<script>
/* ---------- settings ---------- */
const CLOSEST_RADIUS = 2000;  // "Closest" always searches this far, whatever the slider says
const distInput = document.getElementById("dist");
const distOut = document.getElementById("distOut");
const fmtDist = m => m >= 1000 ? (m / 1000).toLocaleString("en", { maximumFractionDigits: 1 }) + " km" : m + " m";
const randomRadius = () => +distInput.value;
distInput.addEventListener("input", () => { distOut.textContent = fmtDist(randomRadius()); });
distOut.textContent = fmtDist(randomRadius());
const KINDS = {
  bar:      { amenities: ["bar", "pub"], noun: "bar" },
  food:     { amenities: ["restaurant", "fast_food", "food_court"], noun: "place to eat" },
  pharmacy: { amenities: ["pharmacy"], noun: "pharmacy" },
  grocery:  { amenities: ["supermarket", "convenience"], noun: "grocery store" }
};
// what to ask the map for: these "amenity" values plus these "shop" values
const ALL_AMENITIES = ["bar", "pub", "restaurant", "fast_food", "food_court", "pharmacy"];
const ALL_SHOPS = ["supermarket", "convenience"];
const placeQuery = area => `(nwr["amenity"~"^(${ALL_AMENITIES.join("|")})$"]${area};nwr["shop"~"^(${ALL_SHOPS.join("|")})$"]${area};);out center tags;`;
const AMENITY_LABEL = { bar: "Bar", pub: "Pub", restaurant: "Restaurant", fast_food: "Takeaway", food_court: "Food court",
  pharmacy: "Pharmacy", supermarket: "Supermarket", convenience: "Convenience store" };
const ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];
const CACHE_MS = 6 * 60 * 60 * 1000;

/* ---------- opening hours (common OSM formats) ----------
   Returns an array of 7 days (0 = Monday), each a list of [startMin, endMin].
   endMin may go past 1440 when a place stays open after midnight.
   Returns null for formats this doesn't understand (shown as "hours unclear"). */
const DAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

function parseHours(raw) {
  if (!raw) return null;
  let s = raw.trim().replace(/[–—]/g, "-").replace(/\s+/g, " ")
    .replace(/\b(mo|tu|we|th|fr|sa|su|ph|sh)\b/gi, d => d.length === 2 && /ph|sh/i.test(d) ? d.toUpperCase() : d[0].toUpperCase() + d[1].toLowerCase());
  if (s === "24/7") return DAYS.map(() => [[0, 1440]]);
  const week = DAYS.map(() => []);
  for (let rule of s.split(";")) {
    rule = rule.trim();
    if (!rule) continue;
    const m = rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)(?:\s*,\s*(?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?))*)?\s*:?\s*(.*)$/);
    if (!m) return null;
    const daySel = m[1], timePart = m[2].trim();
    let days;
    if (!daySel) days = [0,1,2,3,4,5,6];
    else {
      days = [];
      for (const tok of daySel.split(",").map(t => t.trim())) {
        if (tok === "PH" || tok === "SH") continue; // holidays: ignore
        const [a, b] = tok.split("-");
        const ia = DAYS.indexOf(a);
        if (!b) { days.push(ia); continue; }
        let ib = DAYS.indexOf(b), i = ia;
        while (true) { days.push(i); if (i === ib) break; i = (i + 1) % 7; }
      }
      if (!days.length) continue; // rule only about holidays
    }
    if (/^(off|closed)$/i.test(timePart)) { days.forEach(d => week[d] = []); continue; }
    const spans = [];
    for (const t of timePart.split(",").map(x => x.trim())) {
      const tm = t.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})(\+)?$/) || t.match(/^(\d{1,2}):(\d{2})(\+)$/);
      if (!tm) return null;
      const start = +tm[1] * 60 + +tm[2];
      let end;
      if (tm.length === 4) end = start + 4 * 60;            // "18:00+" = open-ended, assume ~4 h
      else { end = +tm[3] * 60 + +tm[4]; if (end <= start) end += 1440; }
      spans.push([start, end]);
    }
    if (!spans.length) return null;
    days.forEach(d => week[d] = spans);                     // later rules override earlier ones
  }
  return week;
}

// Opening status for `now`: {state:"open"|"closed"|"unknown", text}
function hoursStatus(raw, now) {
  if (!raw) return { state: "unknown", text: "Hours not listed" };
  const week = parseHours(raw);
  if (!week) return { state: "unknown", text: "Hours unclear, check before you go" };
  const today = (now.getDay() + 6) % 7, yest = (today + 6) % 7;
  const min = now.getHours() * 60 + now.getMinutes();
  const fmt = x => { x = ((x % 1440) + 1440) % 1440; return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };
  const span = ([a, b]) => fmt(a) + "–" + (b === 1440 ? "24:00" : fmt(b));
  // still open from last night?
  const carry = week[yest].find(([a, b]) => b > 1440 && min < b - 1440);
  if (carry) return { state: "open", text: "Open until " + fmt(carry[1]) + " (from last night)" };
  const todays = week[today];
  if (todays.length === 1 && todays[0][0] === 0 && todays[0][1] >= 1440)
    return { state: "open", text: "Open 24 hours today" };
  const isOpen = todays.some(([a, b]) => min >= a && min < b);
  const text = todays.length ? "Today " + todays.map(span).join(", ") : "Closed today";
  return { state: isOpen ? "open" : "closed", text };
}

/* ---------- page state ---------- */
const ticket = document.getElementById("ticket");
const countEl = document.getElementById("count");
const buttons = [...document.querySelectorAll(".finders button")];
const fromBox = document.getElementById("from");
const fromText = document.getElementById("fromText");
const skipUnknown = document.getElementById("skipUnknown");
const takeawayOnly = document.getElementById("takeawayOnly");
const showOther = document.getElementById("showOther");
const seen = new Set();   // places already shown by Random; lives only while the page is open
// Remember the settings in this browser
for (const box of [skipUnknown, takeawayOnly, showOther]) {
  try { const v = localStorage.getItem("setting:" + box.id); if (v !== null) box.checked = v === "1"; } catch {}
  box.addEventListener("change", () => {
    try { localStorage.setItem("setting:" + box.id, box.checked ? "1" : "0"); } catch {}
    updateFoodLabels(); updateOther();
  });
}
function updateOther() {
  document.getElementById("nearPharmacy").hidden = !showOther.checked;
  document.getElementById("nearGrocery").hidden = !showOther.checked;
}
updateOther();
function nounFor(kind) { return kind === "food" && takeawayOnly.checked ? "takeaway place" : KINDS[kind].noun; }
function foodAmenities() { return takeawayOnly.checked ? ["fast_food"] : KINDS.food.amenities; }
function updateFoodLabels() {
  document.querySelectorAll(".foodKind").forEach(el => el.textContent = takeawayOnly.checked ? "takeaway only" : "restaurants & takeaway");
}
updateFoodLabels();
let here = null;       // {lat, lon, label}
let places = null;     // all places near `here`
let placesRadius = 0;  // how far `places` reaches
const lastPick = { bar: null, food: null, pharmacy: null, grocery: null };

function setState(msg, isErr) {
  ticket.className = "ticket";
  ticket.innerHTML = '<span class="label">Tonight\'s pick</span>';
  const p = document.createElement("p");
  p.className = "state" + (isErr ? " err" : "");
  p.textContent = msg;
  ticket.appendChild(p);
}

function distance(a, b) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- location ---------- */
function tryGeo(opts) {
  return new Promise((resolve, reject) =>
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }), reject, opts));
}

async function getPosition() {
  if (!window.isSecureContext)
    throw new Error("Browsers only share location on https:// pages or files opened directly. Open the file in your browser, or type an address below.");
  if (!navigator.geolocation) throw new Error("This browser can't share its location. Type an address below instead.");
  try {
    const quick = await tryGeo({ enableHighAccuracy: false, timeout: 10000, maximumAge: 120000 });
    if (!(quick.acc > 100)) return quick;
    // Rough fix: spend a few more seconds trying for a precise one, keep whichever is better.
    try {
      const fine = await tryGeo({ enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
      return fine.acc < quick.acc ? fine : quick;
    } catch { return quick; }
  } catch (e1) {
    if (e1.code === 1) throw new Error(
      "Location is blocked for this page. Turn it back on in your browser's site settings, or type an address instead.");
    try {
      return await tryGeo({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    } catch (e2) {
      const why = e2.code === 3 ? "it took too long" : "your device couldn't work out a position";
      throw new Error(`Couldn't get your location (${why}, code ${e2.code}). Check that location services are on, or type an address below.`);
    }
  }
}

async function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

// Address lookup: tries inside Oslo first (fast and avoids look-alike names elsewhere),
// then Norway, then anywhere. Answers are remembered, so the same text is instant next time.
async function geocode(text) {
  const key = "geo:" + text.toLowerCase();
  try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c) return c; } catch {}
  const base = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=no&q=" + encodeURIComponent(text);
  const tries = [
    `${base}&viewbox=${CITY.w},${CITY.n},${CITY.e},${CITY.s}&bounded=1`,
    `${base}&countrycodes=no`,
    base
  ];
  let answered = false;
  for (const url of tries) {
    let res;
    try { res = await fetchWithTimeout(url, { headers: { "Accept": "application/json" } }, 8000); }
    catch { continue; }
    if (!res.ok) continue;
    answered = true;
    const data = await res.json();
    if (!data.length) continue;
    const name = data[0].display_name.split(",").slice(0, 2).map(x => x.trim()).join(", ");
    const hit = { lat: +data[0].lat, lon: +data[0].lon, name };
    try { localStorage.setItem(key, JSON.stringify(hit)); } catch {}
    return hit;
  }
  if (!answered) throw new Error("The address lookup didn't answer. Try again in a minute.");
  throw new Error(`Couldn't find "${text}". Check the spelling, or add the street and city, like "Karl Johans gate 1, Oslo".`);
}

/* ---------- place data ---------- */
function toPlaces(elements) {
  return elements.map(el => {
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    const t = el.tags || {};
    const addr = [ [t["addr:street"], t["addr:housenumber"]].filter(Boolean).join(" "), t["addr:city"] ].filter(Boolean).join(", ");
    const cuisine = (t.cuisine || "").split(";")[0].replace(/_/g, " ");
    const kind = ALL_AMENITIES.includes(t.amenity) ? t.amenity : t.shop;
    return { id: el.type + "/" + el.id, lat, lon, amenity: kind,
      name: t.name || "Unnamed " + (AMENITY_LABEL[t.amenity] || "place").toLowerCase(),
      cuisine, addr, hours: t.opening_hours || "", web: t.website || t["contact:website"] || "" };
  }).filter(p => p.lat != null);
}

function raceServers(q, ms = 40000) {
  const ctrls = ENDPOINTS.map(() => new AbortController());
  const timer = setTimeout(() => ctrls.forEach(c => c.abort()), ms);
  const fails = [];
  const attempts = ENDPOINTS.map((url, i) =>
    fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q),
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, signal: ctrls[i].signal })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => {
      if (!Array.isArray(j.elements) || j.remark) throw new Error(j.remark || "bad data");
      return { j, i };
    })
    .catch(e => { fails.push(new URL(url).host + ": " + (e.name === "AbortError" ? "timed out" : e.message)); throw e; }));
  return Promise.any(attempts)
    .then(({ j, i }) => { ctrls.forEach((c, k) => k !== i && c.abort()); return j.elements; })
    .catch(() => { throw new Error(fails.join(" · ")); })
    .finally(() => clearTimeout(timer));
}

// One lookup fetches bars AND food, so switching between them is instant.
// A cached area is reused whenever it was fetched with at least the radius needed now.
async function fetchLive(pos, radius) {
  const gLat = Math.round(pos.lat * 1000) / 1000, gLon = Math.round(pos.lon * 1000) / 1000;
  const key = "places3:" + gLat + "," + gLon;
  let elements = null;
  try {
    const c = JSON.parse(localStorage.getItem(key) || "null");
    if (c && Date.now() - c.t < CACHE_MS && c.r >= radius) elements = c.e;
  } catch {}
  if (!elements) {
    const q = `[out:json][timeout:25];` + placeQuery(`(around:${radius + 120},${gLat},${gLon})`);
    try { elements = await raceServers(q); }
    catch (e) { throw new Error("None of the map servers answered. Try again in a minute. (Details: " + e.message + ")"); }
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), r: radius, e: elements })); } catch {}
  }
  return toPlaces(elements);
}

/* ---------- all of Oslo, kept in the browser ----------
   Fetched once in the background when the page opens, refreshed weekly.
   Searches inside this box then need no network at all. */
const CITY = { name: "Oslo", s: 59.78, w: 10.40, n: 60.02, e: 11.00 };
const CITY_KEY = "city:oslo:v2";   // v2 = also has pharmacies and groceries
const CITY_MAX_AGE = 7 * 24 * 60 * 60 * 1000;
const cityNote = document.getElementById("cityNote");
let cityPlaces = null;   // array of places once ready
let cityPromise = null;  // in-flight download

const pack = p => [p.id, +p.lat.toFixed(6), +p.lon.toFixed(6), p.amenity, p.name, p.cuisine, p.addr, p.hours, p.web];
const unpack = a => ({ id: a[0], lat: a[1], lon: a[2], amenity: a[3], name: a[4], cuisine: a[5], addr: a[6], hours: a[7], web: a[8] });

function cityCovers(pos, radius) {
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(pos.lat * Math.PI / 180));
  return pos.lat - dLat >= CITY.s && pos.lat + dLat <= CITY.n && pos.lon - dLon >= CITY.w && pos.lon + dLon <= CITY.e;
}

function noteCity(savedAt) {
  const d = new Date(savedAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  cityNote.textContent = `${CITY.name} saved for instant search · updated ${d}`;
}

// Slow path: ask the map servers for all of Oslo (~30 s). Only used if the ready-made file isn't available.
function downloadCity() {
  cityNote.textContent = `Saving ${CITY.name} for instant search…`;
  const q = `[out:json][timeout:180];` + placeQuery(`(${CITY.s},${CITY.w},${CITY.n},${CITY.e})`);
  return raceServers(q, 200000).then(elements => {
    const list = toPlaces(elements);
    useCity({ v: 2, t: Date.now(), rows: list.map(pack) });
    return list;
  });
}

// Fast path: oslo.json sits next to the page on GitHub and is rebuilt weekly by a GitHub Action.
async function fetchCityFile() {
  const res = await fetchWithTimeout("oslo.json", { cache: "no-cache" }, 15000);
  if (!res.ok) throw new Error("no city file");
  const data = await res.json();
  if (!data || !Array.isArray(data.rows) || !data.rows.length) throw new Error("bad city file");
  if (!(data.v >= 2)) throw new Error("old city file without pharmacies and groceries");
  return data;
}

function useCity(data) {
  data = { v: 2, ...data };
  try { localStorage.setItem(CITY_KEY, JSON.stringify(data)); } catch {}
  cityPlaces = data.rows.map(unpack);
  noteCity(data.t);
  return cityPlaces;
}

(function initCity() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CITY_KEY) || "null"); } catch {}
  if (saved && Array.isArray(saved.rows)) { cityPlaces = saved.rows.map(unpack); noteCity(saved.t); }
  const age = saved ? Date.now() - saved.t : Infinity;
  if (age < 12 * 60 * 60 * 1000) return;            // fresh enough, nothing to do

  if (!saved) cityNote.textContent = `Saving ${CITY.name} for instant search…`;
  cityPromise = fetchCityFile()
    .then(data => (!saved || data.t > saved.t) ? useCity(data) : cityPlaces)
    .catch(() => (!saved || age > CITY_MAX_AGE) ? downloadCity() : cityPlaces)
    .catch(e => {
      if (!cityPlaces) cityNote.textContent = `Couldn't save ${CITY.name} yet. It will try again next time you open the page.`;
      throw e;
    })
    .finally(() => { cityPromise = null; });
  cityPromise.catch(() => {});
})();

async function fetchPlaces(pos, radius) {
  let list;
  if (cityCovers(pos, radius) && cityPlaces) {
    list = cityPlaces;                                    // instant
  } else if (cityCovers(pos, radius) && cityPromise) {
    // Oslo is still downloading: use whichever arrives first, the city or a small local lookup.
    list = await Promise.any([cityPromise, fetchLive(pos, radius)])
      .catch(() => { throw new Error("None of the map servers answered. Try again in a minute."); });
  } else {
    list = await fetchLive(pos, radius);
  }
  return list
    .map(p => ({ ...p, dist: distance(pos, p) }))
    .filter(p => p.dist <= radius);
}

/* ---------- showing a pick ---------- */
const shown = [];   // results shown this visit, newest last

function show(p, kind, status, how, fromBack) {
  if (!fromBack) shown.push({ p, kind, how });
  const walk = Math.max(1, Math.round(p.dist / 80));
  ticket.className = "ticket" + (kind === "food" ? " food" : "");
  ticket.innerHTML = "";
  const top = document.createElement("div"); top.className = "ticket-top";
  if (shown.length > 1) {
    const back = document.createElement("button");
    back.type = "button"; back.className = "back"; back.textContent = "← Back";
    back.setAttribute("aria-label", "Show the previous result");
    back.addEventListener("click", goBack);
    top.append(back);
  }
  const lab = document.createElement("span"); lab.className = "label";
  lab.textContent = [AMENITY_LABEL[p.amenity] || "Place", p.cuisine].filter(Boolean).join(" · ");
  top.append(lab);
  if (how) { const c = document.createElement("span"); c.className = "left-count"; c.textContent = how; top.append(c); }
  const h = document.createElement("h2"); h.className = "name"; h.textContent = p.name;
  ticket.append(top, h);
  const hr = document.createElement("p"); hr.className = "hours";
  const pill = document.createElement("span");
  pill.className = "pill " + (status.state === "open" ? "open" : "unknown");
  pill.textContent = status.state === "open" ? "Open now" : "Check hours";
  const ht = document.createElement("span"); ht.textContent = status.text;
  hr.append(pill, ht); ticket.append(hr);
  // distance and address share one line to keep the box short
  const a = document.createElement("p"); a.className = "addr";
  const d = document.createElement("b"); d.textContent = `${Math.round(p.dist)} m · ~${walk} min`;
  a.append(d); if (p.addr) a.append(" · " + p.addr);
  ticket.append(a);
  const links = document.createElement("div"); links.className = "links";
  // From GPS: let Maps use your live position. From a typed address: start there.
  const fromGps = here.label === "your location";
  const dest = `${p.lat},${p.lon}`;
  const dirWeb = `https://www.google.com/maps/dir/?api=1${fromGps ? "" : `&origin=${here.lat},${here.lon}`}&destination=${dest}&travelmode=walking`;
  const dirIos = `comgooglemaps://?${fromGps ? "" : `saddr=${here.lat},${here.lon}&`}daddr=${dest}&directionsmode=walking`;
  // Search the name around the spot, so Maps opens the actual place (with photos and reviews), not just a pin.
  const viewWeb = `https://www.google.com/maps/search/${encodeURIComponent(p.name)}/@${dest},18z`;
  const viewIos = `comgooglemaps://?q=${encodeURIComponent(p.name)}&center=${dest}&zoom=18`;
  const mk = (href, text) => { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; return a; };
  const mkMaps = (web, ios, text) => { const a = mk(web, text); a.addEventListener("click", ev => openInMaps(ev, web, ios)); return a; };
  links.append(mkMaps(dirWeb, dirIos, "Directions"), mkMaps(viewWeb, viewIos, "Google Maps"));
  if (p.web) links.append(mk(p.web, "Website"));
  ticket.append(links);
}

// On phones, open the Google Maps app directly instead of a new browser tab.
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /android/i.test(navigator.userAgent);
function openInMaps(ev, webUrl, iosUrl) {
  if (IS_IOS) {
    ev.preventDefault();
    // Try the app; if it isn't installed the page stays visible, so fall back to the website.
    const t = setTimeout(() => { if (!document.hidden) location.href = webUrl; }, 1200);
    document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(t); }, { once: true });
    location.href = iosUrl;
  } else if (IS_ANDROID) {
    ev.preventDefault();
    // An Android "intent" link names the Google Maps app directly, so Chrome opens it without
    // loading the Google Maps website first. If the app isn't installed, it falls back to the website.
    const u = new URL(webUrl);
    location.href = `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;` +
      `package=com.google.android.apps.maps;S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
  }
  // Computers: normal link, opens Google Maps in a new tab.
}

function goBack() {
  if (shown.length < 2) return;
  shown.pop();
  const prev = shown[shown.length - 1];
  show(prev.p, prev.kind, hoursStatus(prev.p.hours, new Date()), "", true);
}

async function spinThrough(list) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || list.length < 2) return;
  for (let i = 0; i < 6; i++) {
    const p = list[Math.floor(Math.random() * list.length)];
    ticket.innerHTML = `<span class="label">Spinning…</span>`;
    const h = document.createElement("h2"); h.className = "name spinning"; h.textContent = p.name;
    ticket.append(h);
    await new Promise(r => setTimeout(r, 40 + i * 12));
  }
}

/* ---------- main flow ---------- */
function setFrom() {
  // the line always takes up the same space, so setting a location never moves the page
  fromBox.style.visibility = here ? "visible" : "hidden";
  if (!here) return;
  let txt = "Searching from: " + here.label;
  if (here.acc) txt += ` (±${here.acc >= 1000 ? (here.acc / 1000).toFixed(1) + " km" : Math.round(here.acc) + " m"})`;
  fromText.textContent = txt;
  fromText.classList.toggle("warn", here.acc > 300);
  document.getElementById("roughNote").hidden = !(here.acc > 300);
}

async function ensurePlaces(radius) {
  if (!here) {
    setState("Finding where you are…");
    const pos = await getPosition();
    here = { ...pos, label: "your location" };
    places = null; setFrom();
  }
  if (!places || placesRadius < radius) {
    setState(`Looking for places within ${fmtDist(radius)}…`);
    places = await fetchPlaces(here, radius);
    placesRadius = radius;
  }
}

async function find(kind, mode) {
  buttons.forEach(b => b.disabled = true);
  try {
    // Random uses the slider; Closest ignores it and always looks up to 2 km away.
    const limit = mode === "random" ? randomRadius() : CLOSEST_RADIUS;
    await ensurePlaces(limit);
    const now = new Date();
    const all = places.filter(p => (kind === "food" ? foodAmenities() : KINDS[kind].amenities).includes(p.amenity) && p.dist <= limit)
      .map(p => ({ p, st: hoursStatus(p.hours, now) }));
    const open = all.filter(x => x.st.state === "open");
    const unknown = !skipUnknown.checked ? all.filter(x => x.st.state === "unknown") : [];
    const closed = all.length - open.length - all.filter(x => x.st.state === "unknown").length;
    countEl.textContent = `${open.length} open ${nounFor(kind)}${open.length === 1 ? "" : "s"}` +
      (unknown.length ? ` + ${unknown.length} with no hours` : "") + (closed ? ` · ${closed} closed skipped` : "");

    const pool = [...open, ...unknown];
    if (!pool.length) {
      setState(all.length
        ? `Every ${nounFor(kind)} within ${fmtDist(limit)} is closed right now${skipUnknown.checked ? " (or doesn't list its hours)" : ""}.`
        : `No ${nounFor(kind)}s found within ${fmtDist(limit)}.`, true);
      return;
    }
    let pick;
    if (mode === "closest") {
      // Prefer places known to be open; fall back to ones without hours only if none are open.
      const ranked = (open.length ? open : unknown).slice().sort((a, b) => a.p.dist - b.p.dist);
      pick = ranked[0];
      show(pick.p, kind, pick.st, "");
    } else {
      // Never repeat a place during this visit; once all are used up, start the list over.
      let how = "";
      let choices = pool.filter(x => !seen.has(x.p.id));
      if (!choices.length) {
        pool.forEach(x => seen.delete(x.p.id));
        choices = pool.length > 1 ? pool.filter(x => x.p.id !== lastPick[kind]) : pool;
      }
      await spinThrough(choices.map(x => x.p));
      pick = choices[Math.floor(Math.random() * choices.length)];
      lastPick[kind] = pick.p.id;
      seen.add(pick.p.id);
      how = `${choices.length - 1} left`;   // places you haven't been shown yet
      show(pick.p, kind, pick.st, how);
    }
  } catch (e) {
    setState(e.message, true);
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

document.getElementById("randBar").addEventListener("click", () => find("bar", "random"));
document.getElementById("nearBar").addEventListener("click", () => find("bar", "closest"));
document.getElementById("randFood").addEventListener("click", () => find("food", "random"));
document.getElementById("nearFood").addEventListener("click", () => find("food", "closest"));
document.getElementById("nearPharmacy").addEventListener("click", () => find("pharmacy", "closest"));

document.getElementById("useLocation").addEventListener("click", async () => {
  const locBtn = document.getElementById("useLocation");
  buttons.forEach(b => b.disabled = true); locBtn.disabled = true;
  try {
    setState("Finding where you are…");
    const pos = await getPosition();
    here = { ...pos, label: "your location" }; places = null; placesRadius = 0; setFrom();
    const r = randomRadius();
    setState(`Looking for places within ${fmtDist(r)}…`);
    places = await fetchPlaces(here, r); placesRadius = r;
    setState("Using your location. Now pick a button.");
  } catch (e) {
    setState(e.message, true);
  } finally {
    buttons.forEach(b => b.disabled = false); locBtn.disabled = false;
  }
});

  ["Aker Brygge", 59.9105, 10.7277],
  ["Grønland", 59.9126, 10.7604, ["gronland"]],
  ["Tøyen", 59.9150, 10.7740, ["toyen"]],
  ["Karl Johans gate", 59.9133, 10.7420, ["karl johan", "egertorget"]],

  ["Alexander Kiellands plass", 59.9282, 10.7499, ["alexander kielland"]],
  ["Torshov", 59.9339, 10.7637],
  ["Sagene", 59.9373, 10.7522],
  ["Carl Berners plass", 59.9265, 10.7780, ["carl berner"]],
  ["Frogner (Solli plass)", 59.9145, 10.7225, ["frogner", "solli plass"]],
  ["Bjørvika (Operaen)", 59.9075, 10.7531, ["bjørvika", "bjorvika", "operaen", "operahuset"]],
  ["Tjuvholmen", 59.9070, 10.7210],
  ["Kampen", 59.9135, 10.7810],
  ["Storo", 59.9475, 10.7748]
];
const norm = t => t.toLowerCase().replace(/[.,]/g, "").replace(/\s+/g, " ").trim();
function findSpot(text) {
  const n = norm(text);
  return SPOTS.find(([name, , , alias = []]) => norm(name) === n || alias.some(a => norm(a) === n));
}
// Own suggestion list: under the field, at most two, only once something is typed.
(function suggestions() {
  const input = document.getElementById("addr");
  const box = document.getElementById("suggest");
  const hide = () => { box.hidden = true; box.innerHTML = ""; input.setAttribute("aria-expanded", "false"); };
  function matches(text) {
    const n = norm(text);
    if (!n) return [];
    const scored = [];
    for (const [name, , , alias = []] of SPOTS) {
      const words = [name, ...alias].map(norm);
      let score = Infinity;
      for (const w of words) {
        if (w.startsWith(n)) score = Math.min(score, 0);                          // starts with what you typed
        else if (w.split(/[\s/()-]+/).some(part => part.startsWith(n))) score = Math.min(score, 1); // a word starts with it
        else if (n.length >= 3 && w.includes(n)) score = Math.min(score, 2);      // somewhere inside
      }
      if (score < Infinity) scored.push([score, name]);
    }
    return scored.sort((a, b) => a[0] - b[0] || a[1].localeCompare(b[1], "no")).slice(0, 2).map(x => x[1]);
  }
  function pick(name) {
    input.value = name; hide(); input.blur(); setFromText(name);
  }
  input.addEventListener("input", () => {
    const list = matches(input.value);
    if (!list.length || (list.length === 1 && norm(list[0]) === norm(input.value))) return hide();
    box.innerHTML = "";
    list.forEach(name => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "option");
      const t = document.createElement("span"); t.textContent = name;
      const sm = document.createElement("small"); sm.textContent = "Oslo";
      b.append(t, sm);
      // pointerdown so the tap counts before the field loses focus
      b.addEventListener("pointerdown", ev => { ev.preventDefault(); pick(name); });
      b.addEventListener("click", () => pick(name));   // keyboard Enter/Space
      box.append(b);
    });
    box.hidden = false; input.setAttribute("aria-expanded", "true");
  });
  input.addEventListener("blur", () => setTimeout(() => { if (!box.contains(document.activeElement)) hide(); }, 150));
  input.addEventListener("keydown", ev => {
    if (ev.key === "Escape") hide();
    if (ev.key === "ArrowDown" && !box.hidden) { ev.preventDefault(); box.querySelector("button")?.focus(); }
  });
  document.getElementById("manual").addEventListener("submit", hide);
})();

async function setFromText(text) {
  buttons.forEach(b => b.disabled = true);
  try {
    const spot = findSpot(text);
    let pos;
    if (spot) pos = { lat: spot[1], lon: spot[2], name: spot[0] + ", Oslo" };   // instant
    else { setState("Looking up that address…"); pos = await geocode(text); }
    here = { lat: pos.lat, lon: pos.lon, label: pos.name || text }; places = null; placesRadius = 0; setFrom();
    const r = randomRadius();
    setState(`Looking for places within ${fmtDist(r)}…`);
    places = await fetchPlaces(here, r); placesRadius = r;
    setState(`Found ${here.label}. Now pick a button.`);
  } catch (e) {
    setState(e.message, true);
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

document.getElementById("manual").addEventListener("submit", async ev => {
  ev.preventDefault();
  const input = document.getElementById("addr");
  const text = input.value.trim();
  if (!text) {
    // Easter egg: 5 quick presses on an empty field
    const t = Date.now();
    emptyPresses = t - lastEmptyPress < 700 ? emptyPresses + 1 : 1;
    lastEmptyPress = t;
    if (emptyPresses >= 5) { emptyPresses = 0; showEgg(); return; }
    return;   // don't focus the field: that pops up the keyboard and shifts the page
  }
  emptyPresses = 0;
  input.blur();   // close the phone keyboard
  await setFromText(text);
});

// Make it installable as an app (only works when served over https, e.g. GitHub Pages)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
