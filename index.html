<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar Roulette &amp; Mafia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8336a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar Roulette">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Limelight&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: two big tiles that fill the phone screen, each dressed in its own app's look */
:root {
  --bg: #f3efe8;
  --ink: #1d1a22;
  --muted: #6b6474;
  --bar: #b8336a;
  --bar-ink: #ffffff;
  --noir: #140a10;
  --noir-ink: #f4e8e0;
  --blood: #e3343e;
  --moon: #f6e3c4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --noir-face: Limelight, Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15121a; --ink: #f1ecf4; --muted: #a59cb0; --bar: #c2386f; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--display);
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 900px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto 1fr 1fr; gap: 12px; }
h1 { margin: 0; font-family: var(--mono); font-weight: 400; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
@media (min-width: 720px) { main { grid-template-rows: auto auto; grid-template-columns: 1fr 1fr; align-content: center; height: auto; min-height: 100%; } h1 { grid-column: 1 / -1; } main .tile { min-height: 380px; } }

.tile {
  position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 190px; border-radius: 22px; padding: 22px; text-decoration: none;
  transition: transform .15s ease;
}
.tile:active { transform: scale(0.985); }
.tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tile .name { margin: 0; line-height: 0.95; }
.tile .what { margin: 8px 0 0; font-size: 0.95rem; line-height: 1.35; max-width: 30ch; }
.tile .go { position: absolute; top: 20px; right: 20px; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em; opacity: .85; }

.bar { background: var(--bar); color: var(--bar-ink); }
.bar .name { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 11vw, 3.4rem); letter-spacing: -0.03em; }
.bar svg { position: absolute; top: 18px; left: 18px; width: 64px; height: 64px; }

.mafia { background: var(--noir); color: var(--noir-ink); }
.mafia .name { font-family: var(--noir-face); font-weight: 400; font-size: clamp(2.6rem, 12vw, 3.6rem); letter-spacing: 0.04em; color: var(--noir-ink); }
.mafia .what { color: #bba5a8; }
.mafia .sky { position: absolute; inset: 0 0 auto 0; height: 62%; width: 100%; }
.mafia::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--blood); }
.mafia .name, .mafia .what { position: relative; }
.mafia .go { z-index: 1; }

@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>What's the plan?</h1>

  <a class="tile bar" href="bar.html">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M10 12 H54 L32 36 Z" fill="#fffdf9"/>
      <rect x="30.5" y="35" width="3" height="17" fill="#fffdf9"/>
      <rect x="21" y="50" width="22" height="4" rx="2" fill="#fffdf9"/>
      <line x1="38" y1="4" x2="28" y2="22" stroke="#7a9940" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="30" cy="18" r="5" fill="#7a9940"/>
    </svg>
    <span class="go">Open →</span>
    <p class="name">Bar finder</p>
    <p class="what">A random bar, takeaway or Polet that's open right now, close by.</p>
  </a>

  <a class="tile mafia" href="mafia.html">
    <svg class="sky" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1224"/><stop offset="1" stop-color="#140a10"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffe9c8" stop-opacity=".5"/><stop offset="1" stop-color="#ffe9c8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="150" fill="url(#dusk)"/>
      <circle cx="300" cy="48" r="58" fill="url(#glow)"/>
      <circle cx="300" cy="48" r="24" fill="#f6e3c4"/>
      <g fill="#0a0408">
        <rect x="0" y="96" width="34" height="54"/><rect x="30" y="80" width="26" height="70"/><rect x="52" y="104" width="40" height="46"/>
        <rect x="88" y="70" width="22" height="80"/><rect x="106" y="98" width="36" height="52"/><rect x="138" y="62" width="30" height="88"/>
        <rect x="164" y="92" width="44" height="58"/><rect x="204" y="110" width="26" height="40"/><rect x="226" y="76" width="38" height="74"/>
        <rect x="260" y="100" width="24" height="50"/><rect x="280" y="56" width="46" height="94"/><rect x="322" y="88" width="30" height="62"/>
        <rect x="348" y="72" width="28" height="78"/><rect x="372" y="94" width="28" height="56"/>
      </g>
      <g fill="#f2c46d" opacity=".85">
        <rect x="94" y="80" width="4" height="7"/><rect x="146" y="74" width="4" height="7"/><rect x="156" y="92" width="4" height="7" fill="#e3343e"/>
        <rect x="236" y="88" width="4" height="7"/><rect x="290" y="70" width="4" height="7"/><rect x="306" y="94" width="4" height="7"/>
        <rect x="356" y="84" width="4" height="7" fill="#e3343e"/><rect x="40" y="92" width="4" height="7"/>
      </g>
    </svg>
    <span class="go">Play →</span>
    <p class="name">Mafia</p>
    <p class="what">The party game for a room full of people, each on their own phone.</p>
  </a>
</main>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
